    owner: "chant"
    carrier: "check.schema.json"
    what: "A member's recorded generated files sit in its own directory, or are forge CI files at the fixed paths forges read."
  - category: "wsp-check"
    concept: "WSP083"
    name: "linked-environments-disjoint"
    owner: "chant"
    carrier: "check.schema.json"
    what: "Linked members share at least one environment name, matched exactly, when both name any."
  - category: "wsp-check"
    concept: "WSP091"
    name: "link-target-unknown"
    owner: "chant"
    carrier: "check.schema.json"
    what: "Every member link names another member of the workspace. A link to an unknown name, an example group or the consumer itself fails closed."
  - category: "wsp-check"
    concept: "WSP092"
    name: "link-kind-unknown"
    owner: "chant"
    carrier: "check.schema.json"
    what: "Every member link's kind is one chant knows. Unknown link kinds fail closed; output is the default, and telemetry is the other."
  - category: "wsp-check"
    concept: "WSP093"
    name: "link-output-missing"
    owner: "chant"
    carrier: "check.schema.json"
    what: "Every member link names an output its producer exposes, matched exactly. A producer that renames an output fails this for every consumer that links to the old name."
  - category: "wsp-check"
    concept: "WSP094"
    name: "link-unresolved"
    owner: "chant"
    carrier: "check.schema.json"
    what: "A member link whose producer's outputs can't be read in source is kept, unresolved, and reported."
  - category: "wsp-check"
    concept: "WSP095"
    name: "join-ambiguous"
    owner: "chant"
    carrier: "check.schema.json"
    what: "No inferred join is ambiguous: a parameter that matches outputs of two producers (or two outputs of one) needs a declared link saying which."
  - category: "wsp-check"
    concept: "WSP096"
    name: "link-duplicate"
    owner: "chant"
    carrier: "check.schema.json"
    what: "A link is stated once: no consumer lists the same member and output twice."
  - category: "wsp-check"
    concept: "WSP097"
    name: "outputs-not-listable"
    owner: "chant"
    carrier: "check.schema.json"
    what: "An entry lists outputs only when its kind takes them from the entry: other, or a kind from a package. A chant member's outputs are read from its source, and a nested workspace exposes none."
  - category: "wsp-check"
    concept: "WSP098"
    name: "link-protocol-misplaced"
    owner: "chant"
    carrier: "check.schema.json"
    what: "A link states a protocol only when it is a telemetry link: protocol is the OTLP protocol the consumer sends to the producer's collector, and no other link kind has one."
  - category: "wsp-check"
    concept: "WSP101"
    name: "generated-drift"
    owner: "chant"
    carrier: "check.schema.json"
    what: "A generated file is what its generator writes. Declared generators run only with --generated."
  - category: "wsp-check"
    concept: "WSP102"
    name: "generated-missing"
    owner: "chant"
    carrier: "check.schema.json"
    what: "Every declared generated file exists."
  - category: "wsp-check"
    concept: "WSP103"
    name: "generator-failed"
    owner: "chant"
    carrier: "check.schema.json"
    what: "A declared generator runs, exits 0 and writes the file."
  - category: "wsp-check"
    concept: "WSP104"
    name: "generated-hand-written"
    owner: "chant"
    carrier: "check.schema.json"
    what: "An entry kept by hand is reported with its reason, and its generator is not run."
  - category: "wsp-check"
    concept: "WSP105"
    name: "generated-not-compared"
    owner: "chant"
    carrier: "check.schema.json"
    what: "An entry not compared with its generator's output is reported with the reason."
  - category: "wsp-check"
    concept: "WSP106"
    name: "generated-source-missing"
    owner: "chant"
    carrier: "check.schema.json"
    what: "Every source a generated entry names exists."
  - category: "wsp-check"
    concept: "WSP111"
    name: "record-asset-drift"
    owner: "chant"
    carrier: "check.schema.json"
    what: "Every file a current record pins by hash still hashes to the pinned sha256. A changed file asks for the record to be revisited."
  - category: "wsp-check"
    concept: "WSP112"
    name: "record-asset-missing"
    owner: "chant"
    carrier: "check.schema.json"
    what: "Every file a current record pins by hash exists."
  - category: "wsp-check"
    concept: "WSP113"
    name: "record-asset-stale"
    owner: "chant"
    carrier: "check.schema.json"
    what: "No current record pins a file at the same hash as a record it supersedes while the file is unchanged since: when a decision changes, the artifacts it rests on follow."
  - category: "wsp-check"
    concept: "WSP114"
    name: "records-unreadable"
    owner: "chant"
    carrier: "check.schema.json"
    what: "The records of the kind named with --kind can be read."
  - category: "wsp-check"
    concept: "WSP115"
    name: "record-kind-unloadable"
    owner: "chant"
    carrier: "check.schema.json"
    what: "Every record kind the declaration names is a file that exports a valid recordKind, with the schema it names."
  - category: "wsp-check"
    concept: "WSP116"
    name: "decision-points-invalid"
    owner: "chant"
    carrier: "check.schema.json"
    what: "Every answer kind the declaration names has a decision points file that matches decision-points.schema.json, with each input naming a read-contract output, pinned model ids and a chain ending in its one quorum (ws-058)."
  - category: "wsp-check"
    concept: "WSP117"
    name: "work-acceptance-unmet"
    owner: "chant"
    carrier: "check.schema.json"
    what: "Every done work item meets its acceptance criteria: each has evidence that names it, passed, and has the verification the criterion expects, and a manual verdict is from someone other than the implementer (#2772)."
  - category: "wsp-check"
    concept: "WSP121"
    name: "box-credential-declared"
    owner: "chant"
    carrier: "check.schema.json"
    what: "A box holds no credential: no file in a box member's directory carries a literal secret, in its declarations, an env or a vault's defaults. Variable references and secret-manager references (op://, bws://, infisical://) are not secrets."
  - category: "wsp-check"
    concept: "WSP122"
    name: "box-capability-unbrokered"
    owner: "chant"
    carrier: "check.schema.json"
    what: "Every capability a box declares names the broker that holds its credential and enforces its scope."
  - category: "wsp-check"
    concept: "WSP123"
    name: "box-isolation-collision"
    owner: "chant"
    carrier: "check.schema.json"
    what: "No two boxes on one host resolve to the same port, state path or cookie name, and no two ports in one box share an offset."
  - category: "wsp-check"
    concept: "WSP124"
    name: "box-isolation-literal"
    owner: "chant"
    carrier: "check.schema.json"
    what: "No host's state root and no box's state entry is a literal machine path: state paths derive from an environment reference and the member's name."
  - category: "wsp-check"
    concept: "WSP131"
    name: "diagram-source-missing"
    owner: "chant"
    carrier: "check.schema.json"
    what: "A diagram's source file, when it names one, exists in the tree read."
  - category: "wsp-check"
    concept: "WSP132"
    name: "diagram-render-missing"
    owner: "chant"
    carrier: "check.schema.json"
    what: "A diagram's render, when it names one, exists in the tree read. Only a mermaid or excalidraw diagram may name none."
  - category: "wsp-check"
    concept: "WSP133"
    name: "diagram-render-drift"
    owner: "chant"
    carrier: "check.schema.json"
    what: "A diagram that records a sourceHash is unchanged since its render was made: the source's bytes still hash to it. Runs no renderer."
  - category: "wsp-check"
    concept: "WSP125"
    name: "box-fountain-callback-undeclared"
    owner: "chant"
    carrier: "check.schema.json"
    what: "A box member that builds a fountain Box declares the callback token fountain gives its persistent sandbox: the fountain-callback capability, brokered by fountain, with scope owner."
  - category: "wsp-check"
    concept: "WSP126"
    name: "box-intent-unknown"
    owner: "chant"
    carrier: "check.schema.json"
    what: "The intent a box block names is the id of a record of a declared kind named decision, the record that says what the box is for."
  - category: "wsp-check"
    concept: "WSP127"
    name: "box-intent-unconstrained"
    owner: "chant"
    carrier: "check.schema.json"
    what: "The decision record a box names as its intent constrains a member or path of this workspace, with member: and a declared member's name or a path: entry at, above or inside one's directory; not necessarily the box's own member."
  - category: "wsp-check"
    concept: "WSP141"
    name: "link-live-missing"
    owner: "chant"
    carrier: "check.schema.json"
    what: "With --live, a declared member link names an output its producer's estate publishes now, matched exactly."
  - category: "wsp-check"
    concept: "WSP142"
    name: "link-live-unresolved"
    owner: "chant"
    carrier: "check.schema.json"
    what: "With --live, a declared member link that could not be resolved against a live read is kept, unresolved, and reported."
  - category: "hud-view"
    concept: "H1"
    reads: "records --current --json"
    owner: "hud"
    carrier: "alecraso/hud"
    what: "Review queue: decided records grouped by area, oldest first, each as a decision card."
  - category: "hud-view"
    concept: "H2"
    reads: "records --json, records --at"
    owner: "hud"
    carrier: "alecraso/hud"
    what: "Decision page: options side by side with rejected options kept, the supersession chain, amendment history and provenance."
  - category: "hud-view"
    concept: "H3"
    reads: "records, and writes through records review and records new in a pull request"
    owner: "hud"
    carrier: "alecraso/hud"
    what: "Review actions: agree, dissent with a required reason, abstain and propose, each verdict a pull request under the signed-in principal."
  - category: "hud-view"
    concept: "H4"
    reads: "the quorum in records"
    owner: "hud"
    carrier: "alecraso/hud"
    what: "Quorum meter: counted and not-counted principals with reasons and open concerns."
  - category: "hud-view"
    concept: "H5"
    reads: "session records, records --since <session id>; writes records new, review --session and close (#2693)"
    owner: "hud"
    carrier: "alecraso/hud"
    what: "Review session: agenda, attendance, presence and follow mode, live meters and a summary of what changed at close."
  - category: "hud-view"
    concept: "H6"
    reads: "the constrains lists in records --json, graph --kind, ls, the forge"
    owner: "hud"
    carrier: "alecraso/hud"
    what: "Impact: constrained targets with their live state, and provisional dependants flagged."
  - category: "hud-view"
    concept: "H7"
    reads: "the pins in records"
    owner: "hud"
    carrier: "alecraso/hud"
    what: "Evidence drift: pin states, with the pinned and current artifact side by side."
  - category: "hud-view"
    concept: "H8"
    reads: "graph --intent"
    owner: "hud"
    carrier: "alecraso/hud"
    what: "Intent graph: the region at the centre, with artifacts, decisions and commits in bands and findings drawn as nodes."
  - category: "hud-view"
    concept: "H9"
    reads: "graph --intent, records --constrains"
    owner: "hud"
    carrier: "alecraso/hud"
    what: "Anchor states for constraint paths and pins, and re-anchor as an action that drafts a record."
  - category: "hud-view"
    concept: "H10"
    reads: "every document it passes on"
    owner: "hud"
    carrier: "alecraso/hud"
    what: "Text from records, commits and comments goes to any agent fenced as data."
  - category: "hud-view"
    concept: "H11"
    reads: "hud-side state, with the resulting records in git"
    owner: "hud"
    carrier: "alecraso/hud"
    what: "Every walk answer is kept as a disposition list, so a group can review a walk without redoing it."
