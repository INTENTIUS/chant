# The owner roster for the workspace boundary (#2657, ws-052; #3161, ws-086).
#
# One row per concept: who owns it (chant, hud, studio, behold or plugin), what
# carries it (a read-contract schema, a command, or the repository that owns
# it), and one sentence. A plugin owns only a record kind a workspace pins from
# a third party, and its joins. test/boundary-roster.test.ts fails when a workspace command, reason
# code, finding code, link or edge kind, intent node kind, member kind or WSP id
# exists in code with no row here, or when a row names one that does not exist.
# scripts/generate-boundary-doc.ts renders this file into
# docs/src/content/docs/reference/boundary.mdx; run it after editing a row.
#
# Categories, in page order:
#   area              the boundary table of #2657, one row per cell
#   command           every `chant workspace` command and sub-verb
#   member-kind       the built-in member kinds (kinds.ts)
#   record-kind       record kinds: the reference workspace's and this repository's, or one a workspace pins from a third party
#   member-link-kind  LINK_KINDS in links.ts
#   record-link-kind  RECORD_LINK_KINDS in record-assets.ts
#   intent-node-kind  node kinds of intent.schema.json
#   intent-edge-kind  edge kinds of intent.schema.json
#   reason-code       REASONS in reason-codes.ts, less the finding codes
#   finding-code      the finding codes of intent.schema.json
#   wsp-check         WORKSPACE_CHECKS in checks.ts and checks/*.ts
#   hud-view          the hud reader requirements H1 to H11 of #2650
rows:
  - category: "area"
    concept: "declaration, kinds, members, links, lineage, migrations, `init --from`, `upgrade`"
    owner: "chant"
    carrier: "declaration.schema.json, workspace-kinds.schema.json, workspace-principals.schema.json, .chant/workspace.lock.json"
    what: "The repository specification itself: what a workspace declares, how each member is read, how members join, and where the files came from."
  - category: "area"
    concept: "records: schemas, states, seals, pins, supersession, attestation, provenance"
    owner: "chant"
    carrier: "records.schema.json"
    what: "How a record file is validated, sealed, pinned to the files it rests on, superseded and traced to a signed commit."
  - category: "area"
    concept: "the read contract: versioned JSON of `ls`, `graph`, `check`, `records`, `status`, `graph --intent`, `graph --composites`, `points`, `work history`, `signers`, `evidence verify`, closed reason codes"
    owner: "chant"
    carrier: "ls.schema.json, graph.schema.json, check.schema.json, records.schema.json, status.schema.json, intent.schema.json, composites.schema.json, points.schema.json, work-history.schema.json, signers.schema.json, evidence.schema.json"
    what: "The only way a reader sees a workspace: one JSON Schema per document, a contract version and a chant floor."
  - category: "area"
    concept: "commit trailers: `Chant-Agent`, `Chant-Lease`, `Chant-Run`, `Chant-Record`, `Chant-Applied-By`, `Chant-Applied-At`, `Chant-Applied-Commit`"
    owner: "chant"
    carrier: "intent.schema.json, intent-record.schema.json"
    what: "The names a commit uses to point at its agent session, work lease, agent run, records and apply; whoever makes the commit writes them, and chant reads them back (#3149, ws-075)."
  - category: "area"
    concept: "the agent run record: `workspace runs`, `runs start`, `end` and `record`, the run ledger on chant/lifecycle"
    owner: "chant"
    carrier: "runs.schema.json, runs-write.schema.json, run-statement.schema.json"
    what: "What each agent run cost and which commits it made, written by whatever ran the agent and read with totals per work item, decision and principal; chant records runs and never starts one (#3033, ws-076). A runner or steward key can sign a statement over a run, kept in the same ledger (#3192, ws-090)."
  - category: "area"
    concept: "reader conformance: a reader reads only through the read contract and writes nothing"
    owner: "chant"
    carrier: "@intentius/chant/workspace/conformance, @intentius/chant/workspace/conformance/vitest"
    what: "The suite a reader such as hud runs in its own CI, with any test runner, on a workspace it generates from the fixture that @intentius/chant ships."
  - category: "area"
    concept: "the publish call: `chant workspace box publish`, the publisher protocol, and the apply record every publish leaves"
    owner: "chant"
    carrier: "box-publish.schema.json, status.schema.json"
    what: "A surface asks for a box's work to be published with one chant call; chant runs the publisher the box block names and checks the commit it made for the Chant-Applied-* trailers, while the merge, push and pull request stay the orchestrator's (#3165, ws-088)."
  - category: "area"
    concept: "writer conformance: a writer writes only through the write contract, and keeps no fact outside the repo"
    owner: "chant"
    carrier: "@intentius/chant/workspace/conformance, @intentius/chant/workspace/conformance/vitest"
    what: "The suite a writer such as hud or studio's factory runs in its own CI: scripted writes through the writer, each one chant command whose changes chant reports, and the amnesia test, which deletes the writer's private state and expects the same facts back (#3159, ws-074)."
  - category: "area"
    concept: "work in progress that survives the box: snapshots under refs/chant/wip/<branch>, kept attempts, work branches and their replication"
    owner: "chant"
    carrier: "wip.schema.json, wip-write.schema.json, declaration.schema.json"
    what: "One ref namespace for checkpoints of a branch's working tree, which hud's turn checkpoints and studio's checkpoints use, replicated with the work branches, kept attempts and ledger to the remote the box block's replicate names (#3172, ws-085)."
  - category: "area"
    concept: "the writing and verifying commands: `approve`, `records pin`, `verify`, `check`, gates, ledgers"
    owner: "chant"
    carrier: "chant approve, chant workspace records pin, chant workspace records new, amend, review and close, chant workspace verify, chant workspace check"
    what: "Every change to the repository that carries weight is made or checked by a chant command, so a UI writes only by calling one."
  - category: "area"
    concept: "findings as data"
    owner: "chant"
    carrier: "check.schema.json, intent.schema.json"
    what: "A finding is a node or a row with a closed code, so a reader can draw it and a test can assert it."
  - category: "area"
    concept: "rendering"
    owner: "hud"
    carrier: "alecraso/hud"
    what: "Drawing the documents of the read contract for a person."
  - category: "area"
    concept: "review actions as UI (agree, dissent, propose, quorum meter, live sessions)"
    owner: "hud"
    carrier: "alecraso/hud"
    what: "The buttons and meters a reviewer uses; each verdict lands as a pull request that chant then reads."
  - category: "area"
    concept: "identity, sessions, who is looking"
    owner: "hud"
    carrier: "alecraso/hud"
    what: "Signing a person in, knowing who is present, and mapping the session to the forge identity or signer principal it passes to chant's write commands as --by or --actor (#3163); chant never authenticates a person."
  - category: "area"
    concept: "who a person-attributed record or gate approval names: forge identities, signer principals, identity.attribution, signed gates"
    owner: "chant"
    carrier: "declaration.schema.json, status.schema.json"
    what: "The forms a person is named by, the declaration's identity block read at base, and the seal that attests an approval against the signers at base (#3163, ws-080)."
  - category: "area"
    concept: "the agent chat, the dev proxy, comment mode"
    owner: "hud"
    carrier: "alecraso/hud"
    what: "The interactive surfaces around a workspace, none of which chant serves."
  - category: "area"
    concept: "the question put to the person at each finding"
    owner: "hud"
    carrier: "alecraso/hud"
    what: "hud asks and never answers; the finding it asks about comes from chant as data."
  - category: "area"
    concept: "domain record kinds (contract, evidence, review session, driver, proposal, notes)"
    owner: "chant"
    carrier: "the reference workspace's kind files and schemas, named in chant.workspace.json records"
    what: "The record kinds a development model works in, shipped by chant as data and upgraded through lineage; core still ships no kind of its own, and the declaration names the ones a workspace holds (#3148, ws-082, ws-086)."
  - category: "area"
    concept: "decision-point standards: the `understand` point and the `slice-tier` inputs"
    owner: "chant"
    carrier: "the reference workspace's decisions/points.json, points.schema.json"
    what: "The points every factory asks and the inputs each reads, declared once so two orchestrators ask the same question (#3150, ws-086)."
  - category: "area"
    concept: "the factory's rules: readiness, attempts, outcomes, done"
    owner: "chant"
    carrier: "the factory reference Op (#3406)"
    what: "Which work items are ready, which lease outcomes count as attempts, what done means and what happens to an unfinished attempt, as declared and tested behaviour; an orchestrator supplies only execution (#3162, ws-087)."
  - category: "area"
    concept: "record kinds a workspace pins from a third party, and their `commitJoins`"
    owner: "plugin"
    carrier: "a pinned package's record kind file, its schema and its commitJoins export (intent-joins.ts reads it)"
    what: "A kind chant does not ship, and how a commit is tied to its records; core calls the join and never parses the package's own trailers, while chant's trailers join a commit to chant's kinds (ws-075)."
  - category: "area"
    concept: "agent prompts, context bundles, how a builder is run"
    owner: "studio"
    carrier: "arugula-salad/studio"
    what: "What an agent is told and given, and the builder's harness (Claude Code in the box, fountainRun); chant hands out data and no prompts (ws-086)."
  - category: "area"
    concept: "hosting and provisioning: boxes, the lobby, the door, the planter and beds"
    owner: "studio"
    carrier: "arugula-salad/studio"
    what: "Where a box runs and how it is reached and credentialed; the box's configuration it reads from the declaration through the read contract (ws-074, ws-086)."
  - category: "area"
    concept: "publishing a box's work: the merge, the push and the pull request"
    owner: "studio"
    carrier: "arugula-salad/studio"
    what: "The work behind a publish, run as the publisher a box block names; chant runs no push and calls no forge (#3165, ws-086)."
  - category: "area"
    concept: "reading a workspace for the infra plane"
    owner: "behold"
    carrier: "INTENTIUS/behold"
    what: "behold reads a workspace only through the read contract and writes only through chant, under hud's rules (ws-086)."
  - category: "command"
    concept: "workspace init"
    owner: "chant"
    carrier: "declaration.schema.json"
    what: "Proposes a chant.workspace.json from the projects under a directory."
  - category: "command"
    concept: "workspace ls"
    owner: "chant"
    carrier: "ls.schema.json"
    what: "Lists the declaration's members, the record kinds it names and its example groups, with a reason code for each one that can't be read."
  - category: "command"
    concept: "workspace graph"
    owner: "chant"
    carrier: "graph.schema.json"
    what: "Prints the composed IR of every member, with member links and, given --kind, the records and their links. A member whose stamp, toolchain, command line and environment are unchanged is served from the per-member cache in the user's cache directory, never written into the workspace (ws-059)."
  - category: "command"
    concept: "workspace graph --intent"
    owner: "chant"
    carrier: "intent.schema.json"
    what: "Prints the intent graph over one region, through the kinds given with --kind or else every kind the declaration names: its commits, the decisions that constrain it, the artifacts they pin, and findings as nodes."
  - category: "command"
    concept: "workspace graph --composites"
    owner: "chant"
    carrier: "composites.schema.json"
    what: "Prints each composite instance with the components that can deploy it, how each match was made and whether it crossed a member link; an instance with no component is listed with none, and the choice is never made here."
  - category: "command"
    concept: "workspace patch"
    owner: "chant"
    carrier: "patch.schema.json"
    what: "Prints the hunks of a range, a work branch or one commit, file by file, cut to a size limit, for a reader that runs no git."
  - category: "command"
    concept: "workspace check"
    owner: "chant"
    carrier: "check.schema.json"
    what: "Checks the declaration with WSP ids and the lineage lock with reason codes, and prints the result as a read-contract document."
  - category: "command"
    concept: "workspace status"
    owner: "chant"
    carrier: "status.schema.json"
    what: "Shows each member's releases in one environment from the lifecycle ledgers, read-only."
  - category: "command"
    concept: "workspace records"
    owner: "chant"
    carrier: "records.schema.json, records-since.schema.json"
    what: "Reads the records a record kind locates, or every kind the declaration names, validated against its schema, with provenance and reason codes; with --since, what changed in them between two revisions."
  - category: "command"
    concept: "workspace work"
    owner: "chant"
    carrier: "work-lease.schema.json"
    what: "Claims, renews and releases the lease on a work item: a compare-and-set ref with a fencing token and an expiry, pushed to the remote so separate clones coordinate, with each change appended to _leases/<id>.jsonl on chant/lifecycle (#2732, ws-055)."
  - category: "command"
    concept: "workspace work history"
    owner: "chant"
    carrier: "work-history.schema.json"
    what: "Reads one work item's lease history from _leases/<id>.jsonl in the ledger of the member that owns its work kind, as claims with their token, holder and how each ended, so a runner counts failed attempts without reading git (#2785)."
  - category: "command"
    concept: "workspace work evidence"
    owner: "chant"
    carrier: "work-evidence.schema.json"
    what: "Attaches one piece of evidence for an acceptance criterion under the lease the caller holds, through records amend: the workEvidence activity as a command, so a writer that is not an Op, such as hud, writes it through chant (#3159)."
  - category: "command"
    concept: "workspace runs"
    owner: "chant"
    carrier: "runs.schema.json"
    what: "Reads the agent runs in _agent-runs/<id>.jsonl on chant/lifecycle with the commits each made, joined by the run's own list and its Chant-Run trailer, and totals tokens and cost per work item, decision and principal, listing a run with no cost as unpriced rather than zero (#3033, ws-076)."
  - category: "command"
    concept: "workspace runs start"
    owner: "chant"
    carrier: "runs-write.schema.json"
    what: "Appends an agent run's start to the run ledger: who it worked for, its session, harness, model, work item and lease. chant records runs and never starts one (#3033)."
  - category: "command"
    concept: "workspace runs end"
    owner: "chant"
    carrier: "runs-write.schema.json"
    what: "Appends a started run's end: its outcome, tokens, cost with currency and price source, the transcript pinned by hash, and the commits it made with their patch-ids (#3033)."
  - category: "command"
    concept: "workspace runs record"
    owner: "chant"
    carrier: "runs-write.schema.json"
    what: "Appends a finished run's start and end in one write, for a caller that reports a run only once it is over (#3033)."
  - category: "command"
    concept: "workspace runs sign"
    owner: "chant"
    carrier: "runs-write.schema.json"
    what: "Appends a statement over an ended run to its ledger file: a DSSE envelope over the run record's hash, its work item, harness, model and commits, signed with a runner or steward key .chant/trust.json lists at base, or signed elsewhere and checked before it is stored (#3192, ws-090)."
  - category: "command"
    concept: "workspace runs statement"
    owner: "chant"
    carrier: "run-statement.schema.json"
    what: "Prints the agent-run statement and the payload to sign, for a signer whose key is kept elsewhere, such as a lobby, which signs it and hands the envelope back for runs sign (#3192)."
  - category: "command"
    concept: "workspace runs verify"
    owner: "chant"
    carrier: "run-statement.schema.json"
    what: "Judges each run's stored statements offline against the runner keys at base and reports which runs are signed; it fails only with --require signed (#3192, studio-035)."
  - category: "command"
    concept: "workspace box"
    owner: "chant"
    carrier: "box-listing-write.schema.json, box-publish.schema.json"
    what: "A member's box block through chant: box listing set writes the listing, so a tool never edits the declaration itself (#3308, ws-074), and box publish runs the box's declared publisher (#3165, ws-088)."
  - category: "command"
    concept: "workspace box listing"
    owner: "chant"
    carrier: "box-listing-write.schema.json"
    what: "box listing set <member> changes only members[i].box.listing in the declaration, in place, keeping its formatting and comments, copies a --cover picture into the repository, honours the write scope and identity rule at base, and never commits (#3308)."
  - category: "command"
    concept: "workspace box publish"
    owner: "chant"
    carrier: "box-publish.schema.json"
    what: "box publish <member> <item> or --records runs the publisher the box block names, with a JSON request on stdin, checks its answer and holds the commit it made to the apply record of ws-075; chant itself never commits, pushes or calls a forge (#3165, ws-088)."
  - category: "command"
    concept: "workspace lock"
    owner: "chant"
    carrier: "write-lock.schema.json"
    what: "Says who holds the working tree's write lock, and takes and releases it for a batch of writes across chant calls run with CHANT_WRITE_LOCK=<token> (#3173, ws-089)."
  - category: "command"
    concept: "workspace wip"
    owner: "chant"
    carrier: "wip.schema.json"
    what: "Lists the work-in-progress snapshots under refs/chant/wip/<branch>, newest first, and how far each ref the box's replicate policy names is from its remote, read locally (#3172, ws-085). hud and studio list checkpoints through it."
  - category: "command"
    concept: "workspace wip save"
    owner: "chant"
    carrier: "wip-write.schema.json"
    what: "Snapshots the whole working tree, uncommitted records included, onto refs/chant/wip/<branch> through a temporary index, so the index, HEAD and branch never move; pushes when the policy's on includes save (#3172). hud's turn checkpoints and studio's checkpoints are these."
  - category: "command"
    concept: "workspace wip restore"
    owner: "chant"
    carrier: "wip-write.schema.json"
    what: "Puts the working tree back as a snapshot holds it, after a pre-restore snapshot of how it is, and resets the index to HEAD; the branch never moves (#3172)."
  - category: "command"
    concept: "workspace wip push"
    owner: "chant"
    carrier: "wip-write.schema.json"
    what: "Pushes the work branches, kept attempts, snapshots and ledger branch the box's replicate policy names to its remote under their own names, never forced, for the host's schedule (#3172)."
  - category: "command"
    concept: "workspace wip fetch"
    owner: "chant"
    carrier: "wip-write.schema.json"
    what: "On a replacement box, mirrors the remote's replicated refs into refs/chant/replica/<remote>/ and creates or fast-forwards the local ones, leaving a checked-out, ahead or forked ref as it is (#3172)."
  - category: "command"
    concept: "workspace records pin"
    owner: "chant"
    carrier: "chant workspace records pin <path>"
    what: "Prints a file's path from the workspace root and its sha256, for a decision's evidence pin."
  - category: "command"
    concept: "workspace records new"
    owner: "chant"
    carrier: "records-new.schema.json"
    what: "Writes one new record in a kind's directory from validated JSON fields, allocating the next id, and never commits; with --sign, sealed by its author."
  - category: "command"
    concept: "workspace records amend"
    owner: "chant"
    carrier: "records-amend.schema.json"
    what: "Sets fields of one record under its schema and the approval rule, refusing a change to an approved record that only a superseding record can make; with --sign it seals the author again, and without it a change removes the author seal."
  - category: "command"
    concept: "workspace records review"
    owner: "chant"
    carrier: "records-review.schema.json"
    what: "Appends a dated review verdict to one record, bound to the digest of the record text, with a note required for a dissent, and with --sign an ssh seal by the reviewer. With --session, the session must exist and be open, and the verdict goes on its verdicts list in the same command."
  - category: "command"
    concept: "workspace records close"
    owner: "chant"
    carrier: "records-close.schema.json"
    what: "Closes an open review session in one write: its state, close time and closing commit, and the seal computed by chant's rule (#2693)."
  - category: "command"
    concept: "workspace points"
    owner: "chant"
    carrier: "points.schema.json"
    what: "Lists the decision points each declared answer kind's points file declares, and the questions asked of them, with the open ones and any model's answer and confidence (ws-058, #2739)."
  - category: "command"
    concept: "workspace points ask"
    owner: "chant"
    carrier: "points-write.schema.json"
    what: "Asks a point's table, model and quorum deciders for one set of inputs and records the answer, proposed when a model gave it; chant calls no model, and a backend's response is handed in with --response."
  - category: "command"
    concept: "workspace points answer"
    owner: "chant"
    carrier: "points-write.schema.json"
    what: "Records people's answer to an open question, or their confirmation of a model's proposal, once the point's quorum is met, with their note (#3351)."
  - category: "command"
    concept: "workspace points retract"
    owner: "chant"
    carrier: "points-write.schema.json"
    what: "Takes people's answer back once the point's quorum is met: the question is escalated to people again, and the answer, its note, and who retracted it, when and why stay in the record's retractions (#3351, ws-084)."
  - category: "command"
    concept: "workspace agent"
    owner: "chant"
    carrier: "agent.schema.json"
    what: "Prints an agent session from the declaration at base: the one member it is bound to, the record kinds and verbs its write scope allows, and the spec records --current prints, so a session that resumes rebuilds its context from the repository alone (#2548, ws-067)."
  - category: "command"
    concept: "workspace verify"
    owner: "chant"
    carrier: "chant workspace verify"
    what: "Checks the commits in base..head against the signers and roles read from base."
  - category: "command"
    concept: "workspace signers"
    owner: "chant"
    carrier: "signers.schema.json"
    what: "Shows the signer set's versions along the base's first-parent line, each signed by a threshold of the one before, and writes and signs the rotation file for the next version."
  - category: "command"
    concept: "workspace evidence"
    owner: "chant"
    carrier: "chant workspace evidence"
    what: "Runner evidence: an in-toto statement over record hashes in a DSSE envelope, signed by a runner or service key the policy at base lists."
  - category: "command"
    concept: "workspace evidence sign"
    owner: "chant"
    carrier: "chant workspace evidence sign"
    what: "Signs runner evidence over the records a kind locates at a commit, with a runner key, never a signer's."
  - category: "command"
    concept: "workspace evidence verify"
    owner: "chant"
    carrier: "evidence.schema.json"
    what: "Verifies runner evidence offline against the runner keys at base, and says whether the records still hash as signed."
  - category: "command"
    concept: "workspace pin"
    owner: "chant"
    carrier: "chant workspace pin --json"
    what: "Prints the integrity value that pins a plugin loaded by path, and says whether the declared pin matches it."
  - category: "command"
    concept: "workspace lineage"
    owner: "chant"
    carrier: "chant workspace lineage --json"
    what: "Shows each scope in the lineage lock with its template, pin, edited files and open manual steps."
  - category: "command"
    concept: "workspace lineage resolve"
    owner: "chant"
    carrier: "chant workspace lineage resolve <path>"
    what: "Closes a manual step once the file has been merged by hand."
  - category: "command"
    concept: "workspace upgrade"
    owner: "chant"
    carrier: "chant workspace upgrade"
    what: "Brings a lineage scope to a newer template version in a worktree and gates the patch on its digest."
  - category: "command"
    concept: "workspace adopt-lineage"
    owner: "chant"
    carrier: "chant workspace adopt-lineage --json"
    what: "Gives a scope with no lineage one matched against the template's versions, or moves a directory lineage onto git."
  - category: "command"
    concept: "workspace hash-index"
    owner: "chant"
    carrier: "chant workspace hash-index"
    what: "Computes the per-version file hashes adopt-lineage matches a scope against, for a template's CI to publish."
  - category: "command"
    concept: "workspace versions"
    owner: "chant"
    carrier: "chant workspace versions --json"
    what: "Reports the template, chant and lexicon versions of every lineage lock under a directory, by template family."
  - category: "command"
    concept: "workspace export"
    owner: "chant"
    carrier: "chant workspace export --json"
    what: "Writes the members that travel, with their lineage and records, into the export member as a workspace of their own, switching host-bound values."
  - category: "command"
    concept: "workspace import"
    owner: "chant"
    carrier: "chant workspace import --json"
    what: "Brings an export back per file against its recorded hashes, switches host values back, and records the return with the commits the files were made in."
  - category: "command"
    concept: "workspace admit"
    owner: "chant"
    carrier: "chant workspace admit --json"
    what: "Adds a return's signers to .chant/trust.json under admitted, so the returned work reads as attested once an admin merges it."
  - category: "command"
    concept: "workspace build"
    owner: "chant"
    carrier: "chant workspace build"
    what: "Builds every chant member and example project, each under its own chant."
  - category: "command"
    concept: "workspace lint"
    owner: "chant"
    carrier: "chant workspace lint"
    what: "Runs each member's own lint, with one SARIF run per member."
  - category: "command"
    concept: "workspace audit"
    owner: "chant"
    carrier: "chant workspace audit"
    what: "Audits each member's files on disk with its own audit config, adding a member field to each finding."
  - category: "command"
    concept: "workspace member-run"
    owner: "chant"
    carrier: "chant workspace member-run"
    what: "The internal entry one member's process runs under when a per-member command fans out; not for readers."
  - category: "member-kind"
    concept: "chant"
    owner: "chant"
    carrier: "declaration.schema.json, workspace-kinds.schema.json"
    what: "A chant project, with a chant.config.ts or chant.config.json in its directory."
  - category: "member-kind"
    concept: "workspace"
    owner: "chant"
