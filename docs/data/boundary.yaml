# The owner roster for the chant and hud boundary (#2657, ws-052).
#
# One row per concept: who owns it (chant, hud or plugin), what carries it (a
# read-contract schema, a command, or the repository that owns it), and one
# sentence. test/boundary-roster.test.ts fails when a workspace command, reason
# code, finding code, link or edge kind, intent node kind, member kind or WSP id
# exists in code with no row here, or when a row names one that does not exist.
# scripts/generate-boundary-doc.ts renders this file into
# docs/src/content/docs/reference/boundary.mdx; run it after editing a row.
#
# Categories, in page order:
#   area              the boundary table of #2657, one row per cell
#   command           every `chant workspace` command and sub-verb
#   member-kind       the built-in member kinds (kinds.ts)
#   record-kind       record kinds: decision, session and work in this repository, the rest from a plugin
#   member-link-kind  LINK_KINDS in links.ts
#   record-link-kind  RECORD_LINK_KINDS in record-assets.ts
#   intent-node-kind  node kinds of intent.schema.json
#   intent-edge-kind  edge kinds of intent.schema.json
#   reason-code       REASONS in reason-codes.ts, less the finding codes
#   finding-code      the finding codes of intent.schema.json
#   wsp-check         WORKSPACE_CHECKS in checks.ts and checks/*.ts
#   hud-view          the hud reader requirements H1 to H11 of #2650
rows:
  - category: "area"
    concept: "declaration, kinds, members, links, lineage, migrations, `init --from`, `upgrade`"
    owner: "chant"
    carrier: "declaration.schema.json, workspace-kinds.schema.json, .chant/workspace.lock.json"
    what: "The repository specification itself: what a workspace declares, how each member is read, how members join, and where the files came from."
  - category: "area"
    concept: "records: schemas, states, seals, pins, supersession, attestation, provenance"
    owner: "chant"
    carrier: "records.schema.json"
    what: "How a record file is validated, sealed, pinned to the files it rests on, superseded and traced to a signed commit."
  - category: "area"
    concept: "the read contract: versioned JSON of `ls`, `graph`, `check`, `records`, `status`, `graph --intent`, `graph --composites`, closed reason codes"
    owner: "chant"
    carrier: "ls.schema.json, graph.schema.json, check.schema.json, records.schema.json, status.schema.json, intent.schema.json, composites.schema.json"
    what: "The only way a reader sees a workspace: one JSON Schema per document, a contract version and a chant floor."
  - category: "area"
    concept: "reader conformance: a reader reads only through the read contract and writes nothing"
    owner: "chant"
    carrier: "@intentius/chant/workspace/conformance, @intentius/chant/workspace/conformance/vitest"
    what: "The suite a reader such as hud runs in its own CI, with any test runner, on a workspace it generates from the fixture that @intentius/chant ships."
  - category: "area"
    concept: "the writing and verifying commands: `approve`, `records pin`, `verify`, `check`, gates, ledgers"
    owner: "chant"
    carrier: "chant approve, chant workspace records pin, chant workspace records new, amend, review and close, chant workspace verify, chant workspace check"
    what: "Every change to the repository that carries weight is made or checked by a chant command, so a UI writes only by calling one."
  - category: "area"
    concept: "findings as data"
    owner: "chant"
    carrier: "check.schema.json, intent.schema.json"
    what: "A finding is a node or a row with a closed code, so a reader can draw it and a test can assert it."
  - category: "area"
    concept: "rendering"
    owner: "hud"
    carrier: "alecraso/hud"
    what: "Drawing the documents of the read contract for a person."
  - category: "area"
    concept: "review actions as UI (agree, dissent, propose, quorum meter, live sessions)"
    owner: "hud"
    carrier: "alecraso/hud"
    what: "The buttons and meters a reviewer uses; each verdict lands as a pull request that chant then reads."
  - category: "area"
    concept: "identity, sessions, who is looking"
    owner: "hud"
    carrier: "alecraso/hud"
    what: "Signing a person in and knowing who is present; chant never authenticates a person."
  - category: "area"
    concept: "the agent chat, the dev proxy, comment mode"
    owner: "hud"
    carrier: "alecraso/hud"
    what: "The interactive surfaces around a workspace, none of which chant serves."
  - category: "area"
    concept: "the question put to the person at each finding"
    owner: "hud"
    carrier: "alecraso/hud"
    what: "hud asks and never answers; the finding it asks about comes from chant as data."
  - category: "area"
    concept: "domain record kinds (contracts, units, evidence, drivers, sessions)"
    owner: "plugin"
    carrier: "a record kind file and its schema, named in chant.workspace.json records or passed with --kind; jhgaylor/chud (transitional owner, jhgaylor/chud#78, #79, #80)"
    what: "The record kinds a development model defines; core ships none of them, and the declaration names the ones a workspace holds."
  - category: "area"
    concept: "`commitJoins` and other joins from commits to records"
    owner: "plugin"
    carrier: "a record kind file's commitJoins export (intent-joins.ts reads it)"
    what: "How a commit is tied to a unit, contract or evidence; core calls the join and never parses a plugin's trailers."
  - category: "area"
    concept: "agent prompts and context bundles"
    owner: "plugin"
    carrier: "jhgaylor/chud (transitional owner, jhgaylor/chud#78, #79, #80)"
    what: "What an agent is told and given; chant hands out data and no prompts."
  - category: "command"
    concept: "workspace init"
    owner: "chant"
    carrier: "declaration.schema.json"
    what: "Proposes a chant.workspace.json from the projects under a directory."
  - category: "command"
    concept: "workspace ls"
    owner: "chant"
    carrier: "ls.schema.json"
    what: "Lists the declaration's members, the record kinds it names and its example groups, with a reason code for each one that can't be read."
  - category: "command"
    concept: "workspace graph"
    owner: "chant"
    carrier: "graph.schema.json"
    what: "Prints the composed IR of every member, with member links and, given --kind, the records and their links."
  - category: "command"
    concept: "workspace graph --intent"
    owner: "chant"
    carrier: "intent.schema.json"
    what: "Prints the intent graph over one region, through the kinds given with --kind or else every kind the declaration names: its commits, the decisions that constrain it, the artifacts they pin, and findings as nodes."
  - category: "command"
    concept: "workspace graph --composites"
    owner: "chant"
    carrier: "composites.schema.json"
    what: "Prints each composite instance with the components that can deploy it, how each match was made and whether it crossed a member link; an instance with no component is listed with none, and the choice is never made here."
  - category: "command"
    concept: "workspace check"
    owner: "chant"
    carrier: "check.schema.json"
    what: "Checks the declaration with WSP ids and the lineage lock with reason codes, and prints the result as a read-contract document."
  - category: "command"
    concept: "workspace status"
    owner: "chant"
    carrier: "status.schema.json"
    what: "Shows each member's releases in one environment from the lifecycle ledgers, read-only."
  - category: "command"
    concept: "workspace records"
    owner: "chant"
    carrier: "records.schema.json, records-since.schema.json"
    what: "Reads the records a record kind locates, or every kind the declaration names, validated against its schema, with provenance and reason codes; with --since, what changed in them between two revisions."
  - category: "command"
    concept: "workspace records pin"
    owner: "chant"
    carrier: "chant workspace records pin <path>"
    what: "Prints a file's path from the workspace root and its sha256, for a decision's evidence pin."
  - category: "command"
    concept: "workspace records new"
    owner: "chant"
    carrier: "records-new.schema.json"
    what: "Writes one new record in a kind's directory from validated JSON fields, allocating the next id, and never commits; with --sign, sealed by its author."
  - category: "command"
    concept: "workspace records amend"
    owner: "chant"
    carrier: "records-amend.schema.json"
    what: "Sets fields of one record under its schema and the approval rule, refusing a change to an approved record that only a superseding record can make; with --sign it seals the author again, and without it a change removes the author seal."
  - category: "command"
    concept: "workspace records review"
    owner: "chant"
    carrier: "records-review.schema.json"
    what: "Appends a dated review verdict to one record, bound to the digest of the record text, with a note required for a dissent, and with --sign an ssh seal by the reviewer. With --session, the session must exist and be open, and the verdict goes on its verdicts list in the same command."
  - category: "command"
    concept: "workspace records close"
    owner: "chant"
    carrier: "records-close.schema.json"
    what: "Closes an open review session in one write: its state, close time and closing commit, and the seal computed by chant's rule (#2693)."
  - category: "command"
    concept: "workspace verify"
    owner: "chant"
    carrier: "chant workspace verify"
    what: "Checks the commits in base..head against the signers and roles read from base."
  - category: "command"
    concept: "workspace lineage"
    owner: "chant"
    carrier: "chant workspace lineage --json"
    what: "Shows each scope in the lineage lock with its template, pin, edited files and open manual steps."
  - category: "command"
    concept: "workspace lineage resolve"
    owner: "chant"
    carrier: "chant workspace lineage resolve <path>"
    what: "Closes a manual step once the file has been merged by hand."
  - category: "command"
    concept: "workspace upgrade"
    owner: "chant"
    carrier: "chant workspace upgrade"
    what: "Brings a lineage scope to a newer template version in a worktree and gates the patch on its digest."
  - category: "command"
    concept: "workspace build"
    owner: "chant"
    carrier: "chant workspace build"
    what: "Builds every chant member and example project, each under its own chant."
  - category: "command"
    concept: "workspace lint"
    owner: "chant"
    carrier: "chant workspace lint"
    what: "Runs each member's own lint, with one SARIF run per member."
  - category: "command"
    concept: "workspace audit"
    owner: "chant"
    carrier: "chant workspace audit"
    what: "Audits each member's files on disk with its own audit config, adding a member field to each finding."
  - category: "command"
    concept: "workspace member-run"
    owner: "chant"
    carrier: "chant workspace member-run"
    what: "The internal entry one member's process runs under when a per-member command fans out; not for readers."
  - category: "member-kind"
    concept: "chant"
    owner: "chant"
    carrier: "declaration.schema.json, workspace-kinds.schema.json"
    what: "A chant project, with a chant.config.ts or chant.config.json in its directory."
  - category: "member-kind"
    concept: "workspace"
    owner: "chant"
    carrier: "declaration.schema.json, workspace-kinds.schema.json"
    what: "A nested workspace with its own declaration, opaque to the outer one."
  - category: "member-kind"
    concept: "other"
    owner: "chant"
    carrier: "declaration.schema.json, workspace-kinds.schema.json"
    what: "A directory chant does not read; the entry says why in because."
  - category: "member-kind"
    concept: "examples"
    owner: "chant"
    carrier: "declaration.schema.json, workspace-kinds.schema.json"
    what: "An example group: every chant project its glob matches is built and linted."
  - category: "record-kind"
    concept: "decision"
    owner: "chant"
    carrier: "docs/design/decisions/decision.kind.mjs, decision.schema.json"
    what: "The decision record chant's own design and the reference workspace use; the intent graph reads decisions as core nodes."
  - category: "record-kind"
    concept: "work"
    owner: "chant"
    carrier: "reference-workspace/work/work.kind.mjs, work.schema.json"
    what: "A work item: a record with needs and implements links that people and agents share as one queue with no server. records gives each one ready and blockedBy, and the intent graph reads work items as core nodes (#2683). jhgaylor/chud#78 makes units work items."
  - category: "record-kind"
    concept: "contract"
    owner: "plugin"
    carrier: "a record kind file and its schema, passed with --kind; jhgaylor/chud (transitional owner, jhgaylor/chud#78, #79, #80)"
    what: "A unit of work's acceptance criteria, cited by the commits that serve it."
  - category: "record-kind"
    concept: "unit"
    owner: "plugin"
    carrier: "a record kind file and its schema, passed with --kind; jhgaylor/chud (transitional owner, jhgaylor/chud#78, #79, #80)"
    what: "A unit of work, joined to the commits it produced."
  - category: "record-kind"
    concept: "evidence"
    owner: "plugin"
    carrier: "a record kind file and its schema, passed with --kind; jhgaylor/chud (transitional owner, jhgaylor/chud#78, #79, #80)"
    what: "The result of a check run on a tree, cited by a contract or unit."
  - category: "record-kind"
    concept: "driver"
    owner: "plugin"
    carrier: "a record kind file and its schema, passed with --kind; jhgaylor/chud (transitional owner, jhgaylor/chud#78, #79, #80)"
    what: "A record that groups contracts under one intent, which a split unit serves in place of a contract."
  - category: "record-kind"
    concept: "session"
    owner: "chant"
    carrier: "reference-workspace/design/sessions/session.kind.mjs, session.schema.json"
    what: "A review session with its agenda, attendance and the verdicts it produced, sealed on close; chud's numbered session files, such as sessions/S-0001.json, are the shape it started from (#2673)."
  - category: "member-link-kind"
    concept: "output"
    owner: "chant"
    carrier: "graph.schema.json, check.schema.json"
    what: "A consumer names a producer's output, matched exactly; the default and only member link kind."
  - category: "record-link-kind"
    concept: "asset"
    owner: "chant"
    carrier: "graph.schema.json"
    what: "A current record pins a file by hash."
  - category: "record-link-kind"
    concept: "constrains"
    owner: "chant"
    carrier: "graph.schema.json"
    what: "A current record governs a member or a workspace path."
  - category: "intent-node-kind"
    concept: "region"
    owner: "chant"
    carrier: "intent.schema.json"
    what: "The path, and optional line range, the intent graph is over."
  - category: "intent-node-kind"
    concept: "file"
    owner: "chant"
    carrier: "intent.schema.json"
    what: "A file under a directory region, marked when it is a declared generated file."
  - category: "intent-node-kind"
    concept: "member"
    owner: "chant"
    carrier: "intent.schema.json"
    what: "The member a region, file or link belongs to."
  - category: "intent-node-kind"
    concept: "commit"
    owner: "chant"
    carrier: "intent.schema.json"
    what: "A commit that touched the region, with its trailers and provenance level."
  - category: "intent-node-kind"
    concept: "unit"
    owner: "plugin"
    carrier: "intent.schema.json"
    what: "A unit of work a plugin's commitJoins tied to a commit."
  - category: "intent-node-kind"
    concept: "contract"
    owner: "plugin"
    carrier: "intent.schema.json"
    what: "A contract a plugin's commitJoins tied to a unit or commit."
  - category: "intent-node-kind"
    concept: "evidence"
    owner: "plugin"
    carrier: "intent.schema.json"
    what: "Evidence a plugin's commitJoins tied to a contract or unit."
  - category: "intent-node-kind"
    concept: "decision"
    owner: "chant"
    carrier: "intent.schema.json"
    what: "A decision record that constrains the region, with its state, provenance and reviews."
  - category: "intent-node-kind"
    concept: "work"
    owner: "chant"
    carrier: "intent.schema.json"
    what: "A work item that constrains the region, or that one there implements, needs or addresses, with its state, ready and blockedBy (#2683)."
  - category: "intent-node-kind"
    concept: "artifact"
    owner: "chant"
    carrier: "intent.schema.json"
    what: "A file a decision pins, with its pin state."
  - category: "intent-node-kind"
    concept: "link"
    owner: "chant"
    carrier: "intent.schema.json"
    what: "A member link touching the region's member."
  - category: "intent-node-kind"
    concept: "finding"
    owner: "chant"
    carrier: "intent.schema.json"
    what: "A finding with a closed code and the nodes it concerns."
  - category: "intent-edge-kind"
    concept: "constrains"
    owner: "chant"
    carrier: "intent.schema.json"
    what: "A decision or work item governs a region, file, member, contract or issue, at a named granularity."
  - category: "intent-edge-kind"
    concept: "pins"
    owner: "chant"
    carrier: "intent.schema.json"
    what: "A decision pins an artifact, with the pin's state."
  - category: "intent-edge-kind"
    concept: "touched-by"
    owner: "chant"
    carrier: "intent.schema.json"
    what: "A region was changed by a commit, with the lines touched."
  - category: "intent-edge-kind"
    concept: "produced-by"
    owner: "plugin"
    carrier: "intent.schema.json"
    what: "A commit was produced by a unit, as a plugin's commitJoins says."
  - category: "intent-edge-kind"
    concept: "serves"
    owner: "plugin"
    carrier: "intent.schema.json"
    what: "A unit serves a contract, as a plugin's commitJoins says."
  - category: "intent-edge-kind"
    concept: "supersedes"
    owner: "chant"
    carrier: "intent.schema.json"
    what: "A newer decision replaces an older one, derived as records derives it."
  - category: "intent-edge-kind"
    concept: "within"
    owner: "chant"
    carrier: "intent.schema.json"
    what: "A commit falls inside a decision's window, with the state decided when the decision's own unit made it and decided-by-window when it only falls there; shown for judgment, never a finding. A commit inside a work item's window has the state worked (#2683)."
  - category: "intent-edge-kind"
    concept: "cites-evidence"
    owner: "plugin"
    carrier: "intent.schema.json"
    what: "A unit, contract or decision cites evidence, contributed by a plugin's commitJoins."
  - category: "intent-edge-kind"
    concept: "links"
    owner: "chant"
    carrier: "intent.schema.json"
    what: "A consumer member links to a producer member."
  - category: "intent-edge-kind"
    concept: "implements"
    owner: "chant"
    carrier: "intent.schema.json"
    what: "A work item carries out a decision (#2683)."
  - category: "intent-edge-kind"
    concept: "needs"
    owner: "chant"
    carrier: "intent.schema.json"
    what: "A work item waits on another work item (#2683)."
  - category: "intent-edge-kind"
    concept: "addressed-by"
    owner: "chant"
    carrier: "intent.schema.json"
    what: "A finding is being closed by a work item that came from it or implements the decision it concerns (#2683)."
  - category: "reason-code"
    concept: "declaration-missing"
    owner: "chant"
    carrier: "check.schema.json, composites.schema.json, graph.schema.json, intent.schema.json, ls.schema.json, status.schema.json"
    what: "No chant.workspace.json or .jsonc between the directory and the git root."
  - category: "reason-code"
    concept: "declaration-ambiguous"
    owner: "chant"
    carrier: "check.schema.json, composites.schema.json, graph.schema.json, intent.schema.json, ls.schema.json, status.schema.json"
    what: "Both chant.workspace.json and chant.workspace.jsonc exist."
  - category: "reason-code"
    concept: "declaration-unparseable"
    owner: "chant"
    carrier: "check.schema.json, composites.schema.json, graph.schema.json, intent.schema.json, ls.schema.json, status.schema.json"
    what: "The declaration is not valid JSON, or not valid JSONC for .jsonc."
  - category: "reason-code"
    concept: "declaration-invalid"
    owner: "chant"
    carrier: "check.schema.json, composites.schema.json, graph.schema.json, intent.schema.json, ls.schema.json, status.schema.json"
    what: "The declaration does not match its schema, repeats a name, or --member names no entry."
  - category: "reason-code"
    concept: "placement-invalid"
    owner: "chant"
    carrier: "check.schema.json, composites.schema.json, graph.schema.json, intent.schema.json, ls.schema.json, status.schema.json"
    what: "A member or group match breaks a placement rule."
  - category: "reason-code"
    concept: "reader-too-old"
    owner: "chant"
    carrier: "check.schema.json, composites.schema.json, graph.schema.json, intent.schema.json, ls.schema.json, status.schema.json"
    what: "The declaration's minReader is newer than the chant reading it."
  - category: "reason-code"
    concept: "root-chant-required"
    owner: "chant"
    carrier: "check.schema.json, composites.schema.json, graph.schema.json, intent.schema.json, ls.schema.json, status.schema.json"
    what: "The declaration pins a chant version other than the reader's, and that chant is not installed at the workspace root."
  - category: "reason-code"
    concept: "not-a-git-repository"
    owner: "chant"
    carrier: "check.schema.json, composites.schema.json, graph.schema.json, intent.schema.json, ls.schema.json, records-since.schema.json, records.schema.json, status.schema.json"
    what: "--at, or a ledger read, needs a git repository and there is none."
  - category: "reason-code"
    concept: "revision-unknown"
    owner: "chant"
    carrier: "check.schema.json, composites.schema.json, graph.schema.json, intent.schema.json, ls.schema.json, records-since.schema.json, records.schema.json"
    what: "--at names no commit."
  - category: "reason-code"
    concept: "environment-invalid"
    owner: "chant"
    carrier: "status.schema.json"
    what: "An environment name that can't name a ledger directory."
  - category: "reason-code"
    concept: "dir-missing"
    owner: "chant"
    carrier: "composites.schema.json, graph.schema.json, ls.schema.json"
    what: "The member's directory does not exist."
  - category: "reason-code"
    concept: "unknown-kind"
    owner: "chant"
    carrier: "composites.schema.json, graph.schema.json, ls.schema.json"
    what: "No built-in kind or pinned package supplies the member's kind."
  - category: "reason-code"
    concept: "kind-probe-failed"
    owner: "chant"
    carrier: "composites.schema.json, graph.schema.json, ls.schema.json"
    what: "The member's directory is not what its kind reads."
  - category: "reason-code"
    concept: "no-matches"
    owner: "chant"
    carrier: "ls.schema.json"
    what: "An example group matches no directory holding a chant project."
  - category: "reason-code"
    concept: "kind-not-run"
    owner: "chant"
    carrier: "composites.schema.json, graph.schema.json"
    what: "The member's kind is one the per-member commands don't run, such as other."
  - category: "reason-code"
    concept: "command-failed"
    owner: "chant"
    carrier: "composites.schema.json, graph.schema.json"
    what: "The member's own command exited with a failure."
  - category: "reason-code"
    concept: "output-unreadable"
    owner: "chant"
    carrier: "composites.schema.json, graph.schema.json"
    what: "The member's command printed something that isn't the document asked for."
  - category: "reason-code"
    concept: "ir-version-unsupported"
    owner: "chant"
    carrier: "composites.schema.json, graph.schema.json"
    what: "The member's IR has a version this chant can't read."
  - category: "reason-code"
    concept: "ledger-unreadable"
    owner: "chant"
    carrier: "status.schema.json"
    what: "Reading the ledger failed, so nothing from it is listed."
  - category: "reason-code"
    concept: "ledger-malformed"
    owner: "chant"
    carrier: "status.schema.json"
    what: "Some lines of the ledger aren't release records; the rest are listed."
  - category: "reason-code"
    concept: "gates-no-ledger"
    owner: "chant"
    carrier: "status.schema.json"
    what: "The checkout has no chant/lifecycle branch, so there is no gate ledger to read."
  - category: "reason-code"
    concept: "gates-no-gate-ledger"
    owner: "chant"
    carrier: "status.schema.json"
    what: "The branch has no gate ledger for the member: no run of it has reached a gate."
  - category: "reason-code"
    concept: "gates-ledger-unreadable"
    owner: "chant"
    carrier: "status.schema.json"
    what: "Reading the member's gate ledger failed, so no gate is listed."
  - category: "reason-code"
    concept: "record-unparseable"
    owner: "chant"
    carrier: "intent.schema.json, records-amend.schema.json, records-close.schema.json, records-new.schema.json, records-review.schema.json, records.schema.json"
    what: "No front matter, a YAML error or a value outside the JSON subset of YAML, or for a JSON kind a file that is not one object or repeats a member name."
  - category: "reason-code"
    concept: "record-schema-invalid"
    owner: "chant"
    carrier: "intent.schema.json, records-amend.schema.json, records-close.schema.json, records-new.schema.json, records-review.schema.json, records.schema.json"
    what: "The record's front matter, or its JSON object, does not match the kind's schema."
  - category: "reason-code"
    concept: "record-id-duplicate"
    owner: "chant"
    carrier: "intent.schema.json, records-amend.schema.json, records-close.schema.json, records-new.schema.json, records-review.schema.json, records.schema.json"
    what: "Another record earlier in path order has the same id."
  - category: "reason-code"
