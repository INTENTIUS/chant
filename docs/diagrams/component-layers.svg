<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 468 540" width="468" height="540" font-family="'Inter','SF Pro Display',system-ui,-apple-system,'Segoe UI',sans-serif"><defs><style>:root{--pin-bg0:#F7F9FC;--pin-bg1:#EDF1F7;--pin-dots:#D5DCE6;--pin-text:#1A2230;--pin-textMuted:#5A6577;--pin-textFaint:#7A8699;--pin-edge:#B7C0CE;--pin-neutralFill:#FFFFFF;--pin-neutralStroke:#D5DCE6;--pin-neutralBar:#9AA7B8;--pin-accentFill:#EAF1FF;--pin-accentStroke:#4C8DFF;--pin-accentBar:#4C8DFF;--pin-goodFill:#E6F7EE;--pin-goodStroke:#1F6B49;--pin-goodBar:#1FAE6B;--pin-warnFill:#FDEAEA;--pin-warnStroke:#C0392B;--pin-warnBar:#E5484D;--pin-selectedStroke:#4C8DFF;}@media (prefers-reduced-motion: no-preference){@keyframes pin-pulse{0%,100%{opacity:1}50%{opacity:.5}}.pin-pulse{animation:pin-pulse 1.6s ease-in-out infinite}@keyframes pin-flow{to{stroke-dashoffset:-20}}.pin-flow{stroke-dasharray:4 6;animation:pin-flow .9s linear infinite}}</style><linearGradient id="pin-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--pin-bg0, #F7F9FC)"/><stop offset="1" stop-color="var(--pin-bg1, #EDF1F7)"/></linearGradient><pattern id="pin-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="var(--pin-dots, #D5DCE6)"/></pattern></defs><rect width="468" height="540" fill="url(#pin-bg)"/><rect width="468" height="540" fill="url(#pin-dots)" opacity="0.6"/><g data-edge-from="Deterministic core" data-edge-to="Build archive" data-edge-via="wrapped by"><path class="pin-edge-line" d="M 234 426 C 234 352, 234 352, 234 278" fill="none" stroke="var(--pin-edge, #B7C0CE)" stroke-width="1.4" stroke-linecap="round"/><path d="M 234 426 C 234 352, 234 352, 234 278" fill="none" stroke="transparent" stroke-width="14" stroke-linecap="round" pointer-events="stroke"/></g><g><rect x="198.5" y="343" width="71.0" height="18" rx="9" fill="var(--pin-bg0, #F7F9FC)" stroke="var(--pin-neutralStroke, #D5DCE6)" stroke-width="1"/><text x="234.0" y="355.5" text-anchor="m