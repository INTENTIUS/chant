" y="402" fill="var(--pin-text, #1A2230)" font-size="15" font-weight="700">Phase — parallel steps</text><text x="105" y="440" font-size="11"><tspan fill="var(--pin-textFaint, #7A8699)">flag: </tspan><tspan fill="var(--pin-textMuted, #5A6577)">parallel: true</tspan></text><text x="105" y="456" font-size="11"><tspan fill="var(--pin-textFaint, #7A8699)">how: </tspan><tspan fill="var(--pin-textMuted, #5A6577)">Temporal schedules concurrently</tspan></text></g><g data-node-id="Gate step"><rect x="119" y="532" width="184" height="84" rx="12" fill="var(--pin-accentFill, #EAF1FF)" stroke="var(--pin-accentStroke, #4C8DFF)" stroke-width="1.2"/><rect x="119" y="532" width="4" height="84" rx="2" fill="var(--pin-accentBar, #4C8DFF)"/><g transform="translate(133 547) scale(0.9166666666666666)" fill="none" stroke="var(--pin-textFaint, #7A8699)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/></g><text x="165" y="558" fill="var(--pin-text, #1A2230)" font-size="15" font-weight="700">Gate step</text><text x="135" y="596" font-size="11"><tspan fill="var(--pin-textFaint, #7A8699)">does: </tspan><tspan fill="var(--pin-textMuted, #5A6577)">pause · await signal</tspan></text><text x="135" y="612" font-size="11"><tspan fill="var(--pin-textFaint, #7A8699)">or: </tspan><tspan fill="var(--pin-textMuted, #5A6577)">timeout expires</tspan></text></g><g data-node-id="Remaining phases…"><rect x="110" y="688" width="203" height="52" rx="12" fill="var(--pin-neutralFill, #FFFFFF)" stroke="var(--pin-neutralStroke, #D5DCE6)" stroke-width="1.2"/><rect x="110" y="688" width="4" height="52" rx="2" fill="var(--pin-neutralBar, #9AA7B8)"/><g transform="translate(124 703) scale(0.9166666666666666)" fill="none" stroke="var(--pin-textFaint, #7A8699)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/></g><text x="156" y="714" fill="var(--pin-text, #1A2230)" font-size="15" font-weight="7