    container: node:22
    env:
      CHANT_BEFORE_MERGE_PR: '${{ github.event.inputs.apply_pr }}'
      CHANT_BEFORE_MERGE_HEAD: '${{ github.event.inputs.apply_head }}'
      CHANT_BEFORE_MERGE_DIGEST: '${{ github.event.inputs.apply_digest }}'
    steps:
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download the waves' outcomes
        uses: https://code.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with:
          path: .chant/op-waves/tf-apply/outcomes
      - name: Post terragucci/apply after wave 1
