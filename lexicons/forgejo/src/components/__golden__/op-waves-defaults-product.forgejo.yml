        run: terragucci run wave --op tf-apply --wave 1 --of 4 --apply-status terragucci/apply --at "${CHANT_BEFORE_MERGE_HEAD:-$GITHUB_SHA}" --forge forgejo
  apply-status-2:
    runs-on: docker
