          if-no-files-found: ignore
  control-dispatch:
    runs-on: docker
    needs:
      - wave-4-rest-record
    if: '${{ ((github.event_name == ''push'' && (github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch))) || (github.event_name == ''workflow_dispatch'' && github.event.inputs.apply_head != '''') || (github.event_name == ''workflow_dispatch'' && github.event.inputs.apply_wave != '''')) && (!cancelled() && github.event.inputs.apply_head == '''') }}'
    container: node:22
    steps:
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download the waves' outcomes
        uses: https://code.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with:
          path: .chant/op-waves/tf-apply/outcomes
      - name: Add up the waves' outcomes
        run: |
          outcome="$(terragucci run wave --spec .chant/op-waves/tf-apply.spec.json --waves-outcome)" || exit 1
          echo "CHANT_CONTROL_OUTCOME=$outcome" >> "$GITHUB_ENV"
      - name: Tell the control repo forgejo.example.com/acme/control how network's waves ended
        env:
          CHANT_CONTROL_TOKEN: '${{ secrets.TG_CONTROL_TOKEN }}'
          CHANT_CONTROL_SHA: '${{ github.event.inputs.apply_commit || github.sha }}'
        run: |
          if [ -z "${CHANT_CONTROL_OUTCOME:-}" ]; then echo "chant: this run started a follow-on run for the next wave, which tells the control repo how the waves ended"; exit 0; fi
          set -u
          member='network'
          op='deploy'
          sha="${CHANT_CONTROL_SHA:-}"
          case "$sha" in ""|*[!0-9a-f]*) echo "chant: the dispatch names no commit sha, so forgejo.example.com/acme/control was not told" >&2; exit 1 ;; esac
          outcome="${CHANT_CONTROL_OUTCOME:-}"
          case "$outcome" in applied|partial|unchanged|waiting|failed) ;; *) echo "chant: the waves' outcome (\"$outcome\") is not one of applied, partial, unchanged, waiting, failed, so forgejo.example.com/acme/control was not told" >&2; exit 1 ;; esac
          [ -n "${CHANT_CONTROL_TOKEN:-}" ] || { echo "chant: CHANT_CONTROL_TOKEN is empty; map the TG_CONTROL_TOKEN secret into it, so forgejo.example.com/acme/control can be told" >&2; exit 1; }
          answer="$(mktemp)"
          code="$(printf 'Authorization: token %s\n' "$CHANT_CONTROL_TOKEN" | curl -sS -o "$answer" -w '%{http_code}' -X POST -H @- -H 'Accept: application/json' -H 'Content-Type: application/json' -d '{"ref":"main","inputs":{"member":"'"$member"'","op":"'"$op"'","sha":"'"$sha"'","outcome":"'"$outcome"'"}}' 'https://forgejo.example.com/api/v1/repos/acme/control/actions/workflows/chant-dependents.yml/dispatches')" || { echo "chant: the dispatch to forgejo.example.com/acme/control could not be sent" >&2; exit 1; }
          case "$code" in 2??) echo "chant: told forgejo.example.com/acme/control that $member ran its waves ($outcome) (HTTP $code)" ;; *) echo "chant: forgejo.example.com/acme/control refused the dispatch (HTTP $code): $(head -c 400 "$answer")" >&2; exit 1 ;; esac
  before-merge-done:
    runs-on: docker
    needs:
      - wave-4-rest-record
    if: '${{ ((github.event_name == ''push'' && (github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch))) || (github.event_name == ''workflow_dispatch'' && github.event.inputs.apply_head != '''') || (github.event_name == ''workflow_dispatch'' && github.event.inputs.apply_wave != '''')) && (!cancelled() && !contains(needs.*.result, ''failure'') && !contains(needs.*.result, ''skipped'') && github.event.inputs.apply_head != '''') }}'
    container: node:22
    env:
      CHANT_BEFORE_MERGE_PR: '${{ github.event.inputs.apply_pr }}'
      CHANT_BEFORE_MERGE_HEAD: '${{ github.event.inputs.apply_head }}'
      CHANT_BEFORE_MERGE_DIGEST: '${{ github.event.inputs.apply_digest }}'
    steps:
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download the waves' outcomes
        uses: https://code.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with:
          path: .chant/op-waves/tf-apply/outcomes
      - name: Merge the pull request whose head the waves applied
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          CHANT_MERGE_TOKEN: '${{ secrets.TG_MERGE_TOKEN }}'
        run: terragucci run wave --op tf-apply --wave 4 --merge auto --forge forgejo --merge-token-env CHANT_MERGE_TOKEN
  apply-status-1:
    runs-on: docker
    needs:
