# file: terragucci.yml
name: tf-apply

on:
  push:
    branches:
      - main
      - release
  workflow_dispatch:
    inputs:
      apply_pr:
        description: 'Before merge: the pull request whose decided head the waves apply'
        required: false
        type: string
      apply_head:
        description: 'Before merge: the decided head, a commit sha'
        required: false
        type: string
      apply_digest:
        description: 'Before merge: the digest of the decision on chant/lifecycle'
        required: false
        type: string
      apply_wave:
        description: 'Follow-on: the wave past the listed ones that the rest wave''s jobs run'
        required: false
        type: string
      apply_commit:
        description: 'Follow-on of a push: the pushed commit the waves go on with'
        required: false
        type: string

jobs:
  wave-1-canary-plan:
    runs-on: docker
    if: '${{ ((github.event_name == ''push'' && (github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch))) || (github.event_name == ''workflow_dispatch'' && github.event.inputs.apply_head != '''') || (github.event_name == ''workflow_dispatch'' && github.event.inputs.apply_wave != '''')) && (github.event.inputs.apply_wave == '''') }}'
    container: node:22
    timeout-minutes: 180
    env:
      CHANT_LOCK_WAIT: '10500'
      CHANT_WAVES_SPEC_COMMAND: '["terragucci","waves-spec"]'
      CHANT_BEFORE_MERGE_PR: '${{ github.event.inputs.apply_pr }}'
      CHANT_BEFORE_MERGE_HEAD: '${{ github.event.inputs.apply_head }}'
      CHANT_BEFORE_MERGE_DIGEST: '${{ github.event.inputs.apply_digest }}'
    outputs:
      report_0: '${{ steps.chant-handover.outputs.report_0 }}'
      report_1: '${{ steps.chant-handover.outputs.report_1 }}'
      report_2: '${{ steps.chant-handover.outputs.report_2 }}'
      report_3: '${{ steps.chant-handover.outputs.report_3 }}'
    steps:
      - name: Check the job runs where the spec set it to run
        env:
          CHANT_JOB_GUARD: '{"forge":"forgejo","job":"the plan job of wave 1 (canary) of tf-apply","branches":["main","release"],"beforeMerge":{"op":"tf-apply"}}'
          GITHUB_TOKEN: '${{ github.token }}'
