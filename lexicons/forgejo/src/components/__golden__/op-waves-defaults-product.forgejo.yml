# file: tf-apply-resume.yml
name: tf-apply-resume

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

concurrency:
  group: tf-apply-resume
  cancel-in-progress: true

jobs:
  resume:
    runs-on: docker
    container: node:22
    steps:
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resume the waves of tf-apply whose approval arrived
        run: terragucci run resume --op tf-apply
        env:
          CHANT_FORGE_TOKEN: '${{ secrets.CHANT_FORGE_TOKEN }}'
