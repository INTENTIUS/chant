    if: '${{ ((github.event_name == ''push'' && (github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch))) || (github.event_name == ''workflow_dispatch'' && github.event.inputs.apply_head != '''') || (github.event_name == ''workflow_dispatch'' && github.event.inputs.apply_wave != '''')) && ((!cancelled()) && github.event.inputs.apply_wave == '''') }}'
    container: node:22
    env:
      CHANT_BEFORE_MERGE_PR: '${{ github.event.inputs.apply_pr }}'
      CHANT_BEFORE_MERGE_HEAD: '${{ github.event.inputs.apply_head }}'
      CHANT_BEFORE_MERGE_DIGEST: '${{ github.event.inputs.apply_digest }}'
    steps:
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
