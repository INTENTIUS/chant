    env:
      CHANT_LOCK_WAIT: '10500'
      CHANT_WAVES_SPEC_COMMAND: '["terragucci","waves-spec"]'
      CHANT_BEFORE_MERGE_PR: '${{ github.event.inputs.apply_pr }}'
      CHANT_BEFORE_MERGE_HEAD: '${{ github.event.inputs.apply_head }}'
      CHANT_BEFORE_MERGE_DIGEST: '${{ github.event.inputs.apply_digest }}'
    outputs:
      report_0: '${{ steps.chant-handover.outputs.report_0 }}'
      report_1: '${{ steps.chant-handover.outputs.report_1 }}'
      report_2: '${{ steps.chant-handover.outputs.report_2 }}'
      report_3: '${{ steps.chant-handover.outputs.report_3 }}'
    steps:
      - name: Check the job runs where the spec set it to run
        env:
