name: migrations

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: migrations
  cancel-in-progress: false

jobs:
  wave-1-dev:
    runs-on: plan
    container: node:22
    steps:
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Plan, gate and apply wave 1 (dev)
        run: chant run wave --spec waves.json --wave 1
      - name: Keep the job's outcome
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: migrations-wave-1-dev-outcome
          path: .chant/op-waves/migrations/outcomes/outcome-wave-1.json
          if-no-files-found: ignore
  wave-2-prod-decide:
    runs-on: plan
    needs:
      - wave-1-dev
    if: '!cancelled()'
    container: node:22
    steps:
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download the earlier jobs' outcomes
        uses: https://code.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with:
          path: .chant/op-waves/migrations/outcomes
      - name: Plan wave 2 (prod) and decide its gate
        run: chant run wave --spec waves.json --wave 2 --decide
      - name: Keep wave 2's decision
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: migrations-wave-2-decision
          path: .chant/op-waves/migrations/wave-2.json
          if-no-files-found: ignore
      - name: Keep the job's outcome
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: migrations-wave-2-prod-decide-outcome
          path: .chant/op-waves/migrations/outcomes/outcome-wave-2.json
          if-no-files-found: ignore
  wave-2-prod-us:
    runs-on:
      - self-hosted
      - us
    needs:
      - wave-2-prod-decide
    container: node:22
    permissions:
      id-token: write
    env:
      REGION: us
      CLOUD_TOKEN_AUDIENCE: us.example
    steps:
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download wave 2's decision
        uses: https://code.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with:
          name: migrations-wave-2-decision
          path: .chant/op-waves/migrations
      - name: Download the earlier jobs' outcomes
        uses: https://code.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with:
          path: .chant/op-waves/migrations/outcomes
      - name: Apply job group us of wave 2 (prod)
        run: chant run wave --spec waves.json --wave 2 --group us
      - name: Keep the job's outcome
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: migrations-wave-2-prod-us-outcome
          path: .chant/op-waves/migrations/outcomes/outcome-wave-2-group-us.json
          if-no-files-found: ignore
  wave-2-prod-eu:
    runs-on: eu-apply
    needs:
      - wave-2-prod-decide
    container: node:22
    steps:
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download wave 2's decision
        uses: https://code.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with:
          name: migrations-wave-2-decision
          path: .chant/op-waves/migrations
      - name: Download the earlier jobs' outcomes
        uses: https://code.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with:
          path: .chant/op-waves/migrations/outcomes
      - name: Apply job group eu of wave 2 (prod)
        run: chant run wave --spec waves.json --wave 2 --group eu
      - name: Keep the job's outcome
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: migrations-wave-2-prod-eu-outcome
          path: .chant/op-waves/migrations/outcomes/outcome-wave-2-group-eu.json
          if-no-files-found: ignore
