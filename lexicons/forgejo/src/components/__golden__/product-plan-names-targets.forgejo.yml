  yodel-replan-staging:
    if: github.event_name == 'issue_comment' && (github.event.issue.pull_request || github.event.is_pull) && (startsWith(github.event.comment.body, '/yodel plan'))
    runs-on: docker
    container: node:22
    outputs:
      go: '${{ steps.decide.outputs.go }}'
      pr: '${{ steps.decide.outputs.pr }}'
      head: '${{ steps.head.outputs.head }}'
      report_0: '${{ steps.plan.outputs.report_0 }}'
      report_1: '${{ steps.plan.outputs.report_1 }}'
      report_2: '${{ steps.plan.outputs.report_2 }}'
      report_3: '${{ steps.plan.outputs.report_3 }}'
    steps:
      - name: Read the comment and decide whether it plans again
        id: decide
        env:
          CHANT_REPLAN_TOKEN: '${{ github.token }}'
          CHANT_REPLAN_COMMANDS: '["/yodel plan"]'
          CHANT_REPLAN_TARGET: staging
