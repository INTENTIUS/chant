  yodel-replan-note-prod:
    needs:
      - yodel-replan-prod
    if: always() && github.event_name == 'issue_comment' && needs.yodel-replan-prod.outputs.go == '1' && (needs.yodel-replan-prod.result == 'success' || needs.yodel-replan-prod.result == 'failure')
    runs-on: docker
    container: node:22
    steps:
      - name: Check out the target branch's commit
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Take the plan report from the re-plan job
        run: |
          set -u
          node -e 'const fs=require("fs"),p=require("path"),z=require("zlib");const dir=process.argv[1];let b="";for(const l of fs.readFileSync(0,"utf8").split("\n")){if(!l.trim())continue;let s="";try{s=JSON.parse(l)}catch{}if(typeof s==="string")b+=s}if(!b){console.log("chant: the yodel-replan-prod job handed on no report");process.exit(0)}let files;try{files=JSON.parse(z.gunzipSync(Buffer.from(b,"base64"),{maxOutputLength:268435456}).toString("utf8"))}catch(e){console.log("chant: the report the yodel-replan-prod job handed on does not read: "+e.message);process.exit(0)}if(!files||typeof files!=="object"||Array.isArray(files)){console.log("chant: the report the yodel-replan-prod job handed on is not a set of files");process.exit(0)}let n=0;for(const [k,v] of Object.entries(files)){const parts=k.split("/");if(typeof v!=="string"||k.length>1024||parts.some((x)=>!x||x==="."||x===".."||/[\\\x00-\x1f]/.test(x))){console.log("chant: left out "+JSON.stringify(k));continue}try{const f=p.join(dir,...parts);fs.mkdirSync(p.dirname(f),{recursive:true});fs.writeFileSync(f,Buffer.from(v,"base64"));n++}catch(e){console.log("chant: could not write "+JSON.stringify(k)+": "+e.message)}}console.log("chant: took "+n+" report files from the yodel-replan-prod job")' out/yodel <<'END_OF_REPORT'
          ${{ toJSON(needs.yodel-replan-prod.outputs.report_0) }}
          ${{ toJSON(needs.yodel-replan-prod.outputs.report_1) }}
          ${{ toJSON(needs.yodel-replan-prod.outputs.report_2) }}
          ${{ toJSON(needs.yodel-replan-prod.outputs.report_3) }}
          END_OF_REPORT
      - name: Keep the plan report
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: yodel-report-prod-replan
          path: out/yodel
          if-no-files-found: ignore
      - name: Post the plan note and yodel/prod/plan
        if: always()
        env:
          PR_NUMBER: '${{ needs.yodel-replan-prod.outputs.pr }}'
          HEAD_SHA: '${{ needs.yodel-replan-prod.outputs.head }}'
          PLAN_RESULT: '${{ needs.yodel-replan-prod.result }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: yodel chant components pr-post --pr "$PR_NUMBER" --head "$HEAD_SHA" --env default --output out/yodel --forge forgejo --member prod --result "$PLAN_RESULT" --context yodel/prod/plan
