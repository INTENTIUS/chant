name: chant-pr-prod

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - ci/green/**

env:
  CHANT_ENV: prod

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: docker
    container: node:22
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0
      - run: command -v tofu >/dev/null 2>&1 || (curl -fsSL https://get.opentofu.org/install-opentofu.sh -o /tmp/install-opentofu.sh && sh /tmp/install-opentofu.sh --install-method standalone)
      - name: Plan the members this pull request reaches
        env:
          BASE_SHA: '${{ github.event.pull_request.base.sha }}'
          PR_NUMBER: '${{ github.event.pull_request.number }}'
          GITHUB_TOKEN: '${{ github.token }}'
          CHANT_RUNNER_KEY: '${{ secrets.CHANT_RUNNER_KEY }}'
        run: chant ci run plan --in-place --no-push --base "$BASE_SHA" --pr "$PR_NUMBER" --env prod --gate pr-apply --forge forgejo --wave-gate release
      - name: Keep the plan report
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: chant-pr-plan
          path: .chant/pr
          if-no-files-found: ignore
  record:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: docker
    container: node:22
    concurrency:
      group: chant-record-prod
      cancel-in-progress: false
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0
      - run: command -v tofu >/dev/null 2>&1 || (curl -fsSL https://get.opentofu.org/install-opentofu.sh -o /tmp/install-opentofu.sh && sh /tmp/install-opentofu.sh --install-method standalone)
      - name: Record the plan on the merged commit; nothing applies
        env:
          BASE_SHA: '${{ github.event.before }}'
          GITHUB_TOKEN: '${{ github.token }}'
          CHANT_RUNNER_KEY: '${{ secrets.CHANT_RUNNER_KEY }}'
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then git fetch origin "main" && BASE_SHA="$(git merge-base FETCH_HEAD "$GITHUB_SHA")"; if [ "$BASE_SHA" = "$GITHUB_SHA" ]; then BASE_SHA="$(git rev-parse --verify --quiet "$GITHUB_SHA^" || echo 4b825dc642cb6eb9a060e54bf8d69288fbee4904)"; fi; fi; export BASE_SHA
          chant ci run record --in-place --base "$BASE_SHA" --env prod --gate pr-apply --forge forgejo
      - name: Keep the record report
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: chant-pr-record
          path: .chant/pr
          if-no-files-found: ignore
  apply-wave-1:
    if: startsWith(github.ref, 'refs/tags/ci/green/')
    runs-on: docker
    container: node:22
    concurrency:
      group: chant-apply-prod
      cancel-in-progress: false
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0
      - run: command -v tofu >/dev/null 2>&1 || (curl -fsSL https://get.opentofu.org/install-opentofu.sh -o /tmp/install-opentofu.sh && sh /tmp/install-opentofu.sh --install-method standalone)
      - name: Restore the newest record of this commit's apply
        uses: https://code.forgejo.org/actions/cache/restore@v4
        with:
          path: .chant/pr-resume/pr-apply.json
          key: chant-apply-prod-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-wave-1
          restore-keys: chant-apply-prod-${{ github.sha }}-
      - name: Apply wave 1 of the newest green commit, under the approval its plan has
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          CHANT_RUNNER_KEY: '${{ secrets.CHANT_RUNNER_KEY }}'
        run: |
          git fetch --quiet --tags origin "+refs/heads/main:refs/remotes/origin/main" && GREEN_SHA="$(chant ci last-green)" && git checkout --quiet --detach "$GREEN_SHA"
          chant ci run apply --in-place --env prod --gate pr-apply --forge forgejo --wave-gate release --wave 1
      - name: Keep the record for the next wave and a re-run
        if: always()
        uses: https://code.forgejo.org/actions/cache/save@v4
        with:
          path: .chant/pr-resume/pr-apply.json
          key: chant-apply-prod-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-wave-1
      - name: Keep the wave 1 apply report
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: chant-pr-apply-wave-1
          path: .chant/pr
          if-no-files-found: ignore
  apply-wave-2:
    if: startsWith(github.ref, 'refs/tags/ci/green/')
    runs-on: docker
    needs:
      - apply-wave-1
    container: node:22
    concurrency:
      group: chant-apply-prod
      cancel-in-progress: false
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0
      - run: command -v tofu >/dev/null 2>&1 || (curl -fsSL https://get.opentofu.org/install-opentofu.sh -o /tmp/install-opentofu.sh && sh /tmp/install-opentofu.sh --install-method standalone)
      - name: Restore the newest record of this commit's apply
        uses: https://code.forgejo.org/actions/cache/restore@v4
        with:
          path: .chant/pr-resume/pr-apply.json
          key: chant-apply-prod-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-wave-2
          restore-keys: chant-apply-prod-${{ github.sha }}-
      - name: Apply wave 2 of the newest green commit, under the approval its plan has
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          CHANT_RUNNER_KEY: '${{ secrets.CHANT_RUNNER_KEY }}'
        run: |
          git fetch --quiet --tags origin "+refs/heads/main:refs/remotes/origin/main" && GREEN_SHA="$(chant ci last-green)" && git checkout --quiet --detach "$GREEN_SHA"
          chant ci run apply --in-place --env prod --gate pr-apply --forge forgejo --wave-gate release --wave 2
      - name: Keep the record for the next wave and a re-run
        if: always()
        uses: https://code.forgejo.org/actions/cache/save@v4
        with:
          path: .chant/pr-resume/pr-apply.json
          key: chant-apply-prod-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-wave-2
      - name: Keep the wave 2 apply report
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: chant-pr-apply-wave-2
          path: .chant/pr
          if-no-files-found: ignore
