apiVersion: 1
policies:
    - orgId: 1
      receiver: oncall
      group_by:
        - grafana_folder
        - alertname
      routes:
        - receiver: tickets
          object_matchers:
            - - severity
              - =
              - ticket
          mute_time_intervals:
            - weekends
        - receiver: oncall
          object_matchers:
            - - severity
              - =
              - page
            - - team
              - =~
              - checkout|payments
          routes:
            - receiver: tickets
              object_matchers:
                - - env
                  - '!='
                  - prod
              active_time_intervals:
                - release-window
          group_wait: 10s
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
