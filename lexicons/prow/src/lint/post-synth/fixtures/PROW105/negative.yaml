# The presubmit runs on untrusted, where no job holds a credential.
presubmits:
  acme/infra:
    - name: pull-infra-check
      cluster: untrusted
      spec:
        automountServiceAccountToken: false
        containers:
          - name: check
            image: hashicorp/terraform:1.14
            command:
              - terraform
              - validate
postsubmits:
  acme/infra:
    - name: post-infra-apply
      cluster: trusted
      spec:
        serviceAccountName: tf-apply
        containers:
          - name: apply
            image: hashicorp/terraform:1.14
            command:
              - terraform
              - apply
