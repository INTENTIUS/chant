# Generated by terragucci.
# terragucci writes this file from terragucci.yml (runtime: prow). Change terragucci.yml
# and run `npx terragucci init` rather than editing it here.
# Add this file to your Prow installation's job config (its job_config_path).
# The plan, apply and drift jobs run on trusted as the service accounts tf-plan (plan, drift)
# and tf-apply (apply), and read the GitHub token from the Secret terragucci-github-token.

presubmits:
  acme/infra:
    - name: terragucci-check
      cluster: untrusted
      namespace: test-pods
      always_run: true
      decorate: true
      branches:
        - ^main$
      annotations:
        description: 'terragucci: format check, validate, the source allowlist and the policy tests of every root. No credential; a fork''s pull request runs it after /ok-to-test.'
      spec:
        automountServiceAccountToken: false
        containers:
          - name: terragucci
            image: ghcr.io/intentius/terragucci-tofu:1
            command:
              - bash
              - -c
            args:
              - |-
                set -eu
                git config --global --add safe.directory "$PWD" 2>/dev/null || true
                export GITHUB_ACTIONS=true GITHUB_SERVER_URL="${GITHUB_SERVER_URL:-https://github.com}" GITHUB_API_URL="${GITHUB_API_URL:-https://api.github.com}" GITHUB_REPOSITORY='acme/infra'
                export GITHUB_SHA="$(git rev-parse HEAD)" TF_IN_AUTOMATION=1 TF_INPUT=0
                export GITHUB_EVENT_NAME=pull_request GITHUB_REF="refs/pull/${PULL_NUMBER}/merge" GITHUB_BASE_REF="$PULL_BASE_REF"
                export TG_PR="$PULL_NUMBER" TG_SHA="$PULL_PULL_SHA" TG_BASE="$PULL_BASE_SHA" TG_BRANCH="$PULL_BASE_REF"
                export TG_JOB_URL='https://prow.example.com/prowjob?prowjob='"${PROW_JOB_ID:-}"
                tg_keep() { [ -z "${ARTIFACTS:-}" ] || for d in terragucci-report terragucci-check .chant/op-waves; do [ ! -d "$d" ] || cp -R "$d" "$ARTIFACTS/" 2>/dev/null || true; done; }
                trap tg_keep EXIT
                (
                set -eu
                tofu fmt -check -recursive -diff . || exit 3
                failed=0
                tg_check() {
                  dir="$1"
                  tg_init tofu -chdir="$dir" init -backend=false -input=false -no-color >/dev/null || return 1
                  terragucci check-root "$dir" --binary tofu
                }
                tg_init() {
                  if [ -n "${TF_PLUGIN_CACHE_DIR:-}" ]; then until mkdir "$tgtmp/init.lock" 2>/dev/null; do sleep 1; done; fi
                  "$@"; rc=$?
                  if [ -n "${TF_PLUGIN_CACHE_DIR:-}" ]; then rmdir "$tgtmp/init.lock"; fi
                  return $rc
                }
                tgtmp="$(mktemp -d)"
                n=0
                for dir in 'network' 'app' 'cache'; do
                  n=$((n+1))
                  { export TERRAGUCCI_CHECK_PART="$tgtmp/$n.md"; if tg_check "$dir"; then echo 0 >"$tgtmp/$n.rc"; else echo 1 >"$tgtmp/$n.rc"; fi; } >"$tgtmp/$n.out" 2>&1 &
                  eval "tgpid$n=$!"
                done
                wait
                n=0
                for dir in 'network' 'app' 'cache'; do
                  n=$((n+1))
                  cat "$tgtmp/$n.out"
                  if [ -s "$tgtmp/$n.md" ]; then
                    mkdir -p terragucci-check; cat "$tgtmp/$n.md" >>terragucci-check/report.md
                    if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then cat "$tgtmp/$n.md" >>"$GITHUB_STEP_SUMMARY"; fi
                  fi
                  [ "$(cat "$tgtmp/$n.rc" 2>/dev/null)" = 0 ] || failed=1
                done
                terragucci check-policy || failed=1
                exit "$failed"
                )
    - name: terragucci-plan
      cluster: trusted
      namespace: test-pods
      always_run: true
      decorate: true
      branches:
        - ^main$
      trigger: (?m)^/(test (all|terragucci-plan)|terragucci plan)( .*)?$
      rerun_command: /terragucci plan
      annotations:
        description: 'terragucci: plans a pull request from this repository with the plan service account and posts the plan note. A fork''s pull request is not planned before merge.'
      spec:
        serviceAccountName: tf-plan
        containers:
          - name: terragucci
            image: ghcr.io/intentius/terragucci-tofu:1
            command:
              - bash
              - -c
            args:
              - |-
                set -eu
                git config --global --add safe.directory "$PWD" 2>/dev/null || true
                export GITHUB_ACTIONS=true GITHUB_SERVER_URL="${GITHUB_SERVER_URL:-https://github.com}" GITHUB_API_URL="${GITHUB_API_URL:-https://api.github.com}" GITHUB_REPOSITORY='acme/infra'
                export GITHUB_SHA="$(git rev-parse HEAD)" TF_IN_AUTOMATION=1 TF_INPUT=0
                export GITHUB_EVENT_NAME=pull_request GITHUB_REF="refs/pull/${PULL_NUMBER}/merge" GITHUB_BASE_REF="$PULL_BASE_REF"
                export TG_PR="$PULL_NUMBER" TG_SHA="$PULL_PULL_SHA" TG_BASE="$PULL_BASE_SHA" TG_BRANCH="$PULL_BASE_REF"
                export TG_JOB_URL='https://prow.example.com/prowjob?prowjob='"${PROW_JOB_ID:-}"
                tg_keep() { [ -z "${ARTIFACTS:-}" ] || for d in terragucci-report terragucci-check .chant/op-waves; do [ ! -d "$d" ] || cp -R "$d" "$ARTIFACTS/" 2>/dev/null || true; done; }
                trap tg_keep EXIT
                (cd / && node -e 'const api=String(process.env.GITHUB_API_URL).replace(/\/+$/,""),repo=process.env.GITHUB_REPOSITORY;fetch(api+"/repos/"+repo+"/pulls/"+process.env.PULL_NUMBER,{headers:{authorization:"Bearer "+process.env.GITHUB_TOKEN,accept:"application/vnd.github+json"}}).then((r)=>r.ok?r.json():Promise.reject(new Error("GitHub answered "+r.status+" to the pull request"))).then((p)=>process.exit(p&&p.head&&p.head.repo&&p.head.repo.full_name===repo?0:3),(e)=>{console.error("terragucci: "+e.message);process.exit(1)})') || tg_fork=$?
                if [ "${tg_fork:-0}" -eq 3 ]; then echo "terragucci: pull request $PULL_NUMBER is from a fork, so it is not planned before merge; terragucci-check covers it, and it plans and applies after it merges"; exit 0; fi
                [ "${tg_fork:-0}" -eq 0 ] || exit 1
                (
                unset GITHUB_TOKEN TG_TOKEN
                bash <<'PLAN' || exit $?
                set +e -uo pipefail
                export TG_SHA="${TG_SHA:-$(git rev-parse HEAD)}" TG_PR="${TG_PR:-${PR_NUMBER:-}}" TG_ROOT="${CHANT_PLAN_ARGUMENT:-}"
                [ -n "${GITHUB_BASE_REF:-}${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-}" ] || export TG_BASE="${TG_BASE:-${BASE_SHA:-}}"
                terragucci stage tf-plan --out terragucci-report --binary tofu --layers 'network;app,cache' --report-url "${TG_JOB_URL:-}" ${TG_ROOT:+--root "$TG_ROOT"}
                rc=$?
                terragucci plan-handoff --report terragucci-report --env default --exit "$rc"
                PLAN
                ) && tg_rc=0 || tg_rc=$?
                export CHANT_PLAN_NOTE_WORDS='{"footer":"<sub><img src=\"https://intentius.io/terragucci/brand/taco-small.png\" width=\"26\" height=\"16\" alt=\"\"> Posted by [terragucci](https://intentius.io/terragucci/)</sub>","artifact":"terragucci-report","noReport":"Planned in [this run]({run}), which keeps no report artifact; with `reports` set, the note links the report in the bucket.","marker":"terragucci:waves","anchors":{"member":"root-{id}","group":"group-{id}"},"overrideKey":"policy.override","approvalRulesKey":"approval_rules","applyStage":"tf-apply","productMarker":"terragucci:plan"}'
                export CHANT_PLAN_NOTE_NOTICES="$(mktemp)"
                TG_TOKEN="$GITHUB_TOKEN" terragucci plan-note --forge github --report terragucci-report --notices "$CHANT_PLAN_NOTE_NOTICES" || true
                terragucci components pr-post --pr "$PULL_NUMBER" --head "$PULL_PULL_SHA" --env default --output terragucci-report --forge github --result "$([ "$tg_rc" -eq 0 ] && echo success || echo failure)" --context terragucci/plan
                exit "$tg_rc"
            env:
              - name: GITHUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: terragucci-github-token
                    key: token
postsubmits:
  acme/infra:
    - name: terragucci-plan
      cluster: trusted
      namespace: test-pods
      decorate: true
      branches:
        - ^main$
      annotations:
        description: 'terragucci: the merged commit''s plan against its first parent, with the plan service account, kept in the job''s artifacts.'
      spec:
        serviceAccountName: tf-plan
        containers:
          - name: terragucci
            image: ghcr.io/intentius/terragucci-tofu:1
            command:
              - bash
              - -c
            args:
              - |-
                set -eu
                git config --global --add safe.directory "$PWD" 2>/dev/null || true
                export GITHUB_ACTIONS=true GITHUB_SERVER_URL="${GITHUB_SERVER_URL:-https://github.com}" GITHUB_API_URL="${GITHUB_API_URL:-https://api.github.com}" GITHUB_REPOSITORY='acme/infra'
                export GITHUB_SHA="$(git rev-parse HEAD)" TF_IN_AUTOMATION=1 TF_INPUT=0
                export GITHUB_EVENT_NAME=push GITHUB_REF_NAME="$PULL_BASE_REF"
                export GITHUB_REF="refs/heads/$GITHUB_REF_NAME" TG_BRANCH="$GITHUB_REF_NAME"
                export TG_JOB_URL='https://prow.example.com/prowjob?prowjob='"${PROW_JOB_ID:-}"
                tg_keep() { [ -z "${ARTIFACTS:-}" ] || for d in terragucci-report terragucci-check .chant/op-waves; do [ ! -d "$d" ] || cp -R "$d" "$ARTIFACTS/" 2>/dev/null || true; done; }
                trap tg_keep EXIT
                export BASE_SHA="$(git rev-parse -q --verify HEAD^ || true)"
                (
                unset GITHUB_TOKEN TG_TOKEN
                bash <<'PLAN' || exit $?
                set +e -uo pipefail
                export TG_SHA="${TG_SHA:-$(git rev-parse HEAD)}" TG_PR="${TG_PR:-${PR_NUMBER:-}}" TG_ROOT="${CHANT_PLAN_ARGUMENT:-}"
                [ -n "${GITHUB_BASE_REF:-}${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-}" ] || export TG_BASE="${TG_BASE:-${BASE_SHA:-}}"
                terragucci stage tf-plan --out terragucci-report --binary tofu --layers 'network;app,cache' --report-url "${TG_JOB_URL:-}" ${TG_ROOT:+--root "$TG_ROOT"}
                rc=$?
                terragucci plan-handoff --report terragucci-report --env default --exit "$rc"
                PLAN
                ) && tg_rc=0 || tg_rc=$?
                terragucci components pr-post --stale --tip "$GITHUB_SHA" --env default --forge github --context terragucci/plan --preview-comment || true
                exit "$tg_rc"
            env:
              - name: GITHUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: terragucci-github-token
                    key: token
    - name: terragucci-apply
      cluster: trusted
      namespace: test-pods
      decorate: true
      decoration_config:
        timeout: '3h'
      max_concurrency: 1
      branches:
        - ^main$
      annotations:
        description: 'terragucci: applies the 2 waves in order with the apply service account, each behind its gate. Rerun it from Deck once a held wave is approved.'
      spec:
        serviceAccountName: tf-apply
        containers:
          - name: terragucci
            image: ghcr.io/intentius/terragucci-tofu:1
            command:
              - bash
              - -c
            args:
              - |-
                set -eu
                git config --global --add safe.directory "$PWD" 2>/dev/null || true
                export GITHUB_ACTIONS=true GITHUB_SERVER_URL="${GITHUB_SERVER_URL:-https://github.com}" GITHUB_API_URL="${GITHUB_API_URL:-https://api.github.com}" GITHUB_REPOSITORY='acme/infra'
                export GITHUB_SHA="$(git rev-parse HEAD)" TF_IN_AUTOMATION=1 TF_INPUT=0
                export GITHUB_EVENT_NAME=push GITHUB_REF_NAME="$PULL_BASE_REF"
                export GITHUB_REF="refs/heads/$GITHUB_REF_NAME" TG_BRANCH="$GITHUB_REF_NAME"
                export TG_JOB_URL='https://prow.example.com/prowjob?prowjob='"${PROW_JOB_ID:-}"
                tg_keep() { [ -z "${ARTIFACTS:-}" ] || for d in terragucci-report terragucci-check .chant/op-waves; do [ ! -d "$d" ] || cp -R "$d" "$ARTIFACTS/" 2>/dev/null || true; done; }
                trap tg_keep EXIT
                export CHANT_LOCK_WAIT=10500 CHANT_WAVES_SPEC_COMMAND='["terragucci","waves-spec"]' CHANT_WAVES_SPEC_RUNS=head CHANT_DEFAULT_BRANCH="$GITHUB_REF_NAME"
                tg_rc=0
                terragucci run wave --spec .chant/op-waves/tf-apply.spec.json --wave 1 --render-spec || { rc=$?; [ "$tg_rc" -ne 0 ] || tg_rc=$rc; }
                [ -z "${ARTIFACTS:-}" ] || { mkdir -p "$ARTIFACTS/wave-1"; [ ! -d terragucci-report ] || cp -R terragucci-report/. "$ARTIFACTS/wave-1/"; }
                terragucci run wave --op tf-apply --wave 1 --of 2 --apply-status terragucci/apply --at "$GITHUB_SHA" --forge github || true
                terragucci run wave --spec .chant/op-waves/tf-apply.spec.json --wave 2 --render-spec || { rc=$?; [ "$tg_rc" -ne 0 ] || tg_rc=$rc; }
                [ -z "${ARTIFACTS:-}" ] || { mkdir -p "$ARTIFACTS/wave-2"; [ ! -d terragucci-report ] || cp -R terragucci-report/. "$ARTIFACTS/wave-2/"; }
                terragucci run wave --op tf-apply --wave 2 --of 2 --apply-status terragucci/apply --at "$GITHUB_SHA" --forge github || true
                exit "$tg_rc"
            env:
              - name: GITHUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: terragucci-github-token
                    key: token
periodics:
  - name: terragucci-drift
    cluster: trusted
    namespace: test-pods
    cron: '0 6 * * *'
    decorate: true
    extra_refs:
      - org: acme
        repo: infra
        base_ref: main
        workdir: true
    annotations:
      description: 'terragucci: plans every root with -refresh-only and keeps the drift issue. It never applies.'
    spec:
      serviceAccountName: tf-plan
      containers:
        - name: terragucci
          image: ghcr.io/intentius/terragucci-tofu:1
          command:
            - bash
            - -c
          args:
            - |-
              set -eu
              git config --global --add safe.directory "$PWD" 2>/dev/null || true
              export GITHUB_ACTIONS=true GITHUB_SERVER_URL="${GITHUB_SERVER_URL:-https://github.com}" GITHUB_API_URL="${GITHUB_API_URL:-https://api.github.com}" GITHUB_REPOSITORY='acme/infra'
              export GITHUB_SHA="$(git rev-parse HEAD)" TF_IN_AUTOMATION=1 TF_INPUT=0
              export GITHUB_EVENT_NAME=schedule GITHUB_REF_NAME='main'
              export GITHUB_REF="refs/heads/$GITHUB_REF_NAME" TG_BRANCH="$GITHUB_REF_NAME"
              export TG_JOB_URL='https://prow.example.com/prowjob?prowjob='"${PROW_JOB_ID:-}"
              tg_keep() { [ -z "${ARTIFACTS:-}" ] || for d in terragucci-report terragucci-check .chant/op-waves; do [ ! -d "$d" ] || cp -R "$d" "$ARTIFACTS/" 2>/dev/null || true; done; }
              trap tg_keep EXIT
              set +e -uo pipefail
              terragucci stage tf-drift --out terragucci-report --binary tofu --forge github --layers 'network;app,cache' --report-url "${TG_JOB_URL:-}"
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: terragucci-github-token
                  key: token
