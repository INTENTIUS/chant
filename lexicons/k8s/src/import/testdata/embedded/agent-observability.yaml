apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: observability
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/managed-by: chant
    app.kubernetes.io/component: config
data:
  alertmanager.yml: |
    route:
      receiver: default
      group_by:
        - alertname
        - slo
      group_wait: 10s
      group_interval: 1m
      routes:
        - receiver: oncall
          matchers:
            - severity="page"
          repeat_interval: 1h
        - receiver: tickets
          matchers:
            - severity="ticket"
          repeat_interval: 12h
    inhibit_rules:
      - source_matchers:
          - severity="page"
        target_matchers:
          - severity="ticket"
        equal:
          - slo
    receivers:
      - name: default
      - name: oncall
      - name: tickets

