      containers:
        - name: otel-gateway
          image: otel/opentelemetry-collector-contrib:0.130.0
          args:
            - --config=/etc/otel/config.yaml
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 13133
              name: health
          resources:
            requests:
              cpu: '200m'
              memory: '512Mi'
            limits:
              cpu: '1'
              memory: '1Gi'
          volumeMounts:
            - name: config
              mountPath: /etc/otel
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /
              port: health
          readinessProbe:
            httpGet:
              path: /
              port: health
      volumes:
        - name: config
          configMap:
            name: otel-gateway-config

---
apiVersion: v1
kind: Service
metadata:
  name: otel-gateway
  namespace: observability
  labels:
    app.kubernetes.io/name: otel-gateway
    app.kubernetes.io/managed-by: chant
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: otel-gateway
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: otel-gateway-headless
  namespace: observability
  labels:
    app.kubernetes.io/name: otel-gateway
    app.kubernetes.io/managed-by: chant
    app.kubernetes.io/component: gateway
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: otel-gateway
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-gateway-sa
  namespace: observability
  labels:
    app.kubernetes.io/name: otel-gateway
    app.kubernetes.io/managed-by: chant
    app.kubernetes.io/component: gateway

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-gateway-config
  namespace: observability
  labels:
    app.kubernetes.io/name: otel-gateway
    app.kubernetes.io/managed-by: chant
    app.kubernetes.io/component: config
  annotations:
    otel.chant.dev/role: gateway
    otel.chant.dev/workload: Deployment/otel-gateway
data:
  config.yaml: |
    # chant: semconv gen_ai github.com/open-telemetry/semantic-conventions@v1.41.1 (transform/genai_content, redaction/genai_content, filter/genai_spans, spanmetrics/genai, sum/genai_tokens)
    
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      transform/genai_content:
        error_mode: ignore
        trace_statements:
          - context: span
            statements: ["delete_key(span.attributes, \"gen_ai.system_instructions\")", "delete_key(span.attributes, \"gen_ai.input.messages\")", "delete_key(span.attributes, \"gen_ai.output.messages\")", "delete_key(span.attributes, \"gen_ai.tool.call.arguments\")", "delete_key(span.attributes, \"gen_ai.tool.call.result\")", "delete_key(span.attributes, \"gen_ai.retrieval.query.text\")", "delete_key(span.attributes, \"gen_ai.retrieval.documents\")", "delete_key(span.attributes, \"gen_ai.prompt\")", "delete_key(span.attributes, \"gen_ai.completion\")", "delete_matching_keys(span.attributes, \"^gen_ai\\\\.(prompt|completion)\\\\.[0-9]+\\\\..+$\")"]
          - context: spanevent
            statements: ["delete_key(spanevent.attributes, \"gen_ai.system_instructions\")", "delete_key(spanevent.attributes, \"gen_ai.input.messages\")", "delete_key(spanevent.attributes, \"gen_ai.output.messages\")", "delete_key(spanevent.attributes, \"gen_ai.tool.call.arguments\")", "delete_key(spanevent.attributes, \"gen_ai.tool.call.result\")", "delete_key(spanevent.attributes, \"gen_ai.retrieval.query.text\")", "delete_key(spanevent.attributes, \"gen_ai.retrieval.documents\")", "delete_key(spanevent.attributes, \"gen_ai.prompt\")", "delete_key(spanevent.attributes, \"gen_ai.completion\")", "delete_matching_keys(spanevent.attributes, \"^gen_ai\\\\.(prompt|completion)\\\\.[0-9]+\\\\..+$\")"]
        log_statements:
          - context: log
            statements: ["delete_key(log.attributes, \"gen_ai.system_instructions\")", "delete_key(log.attributes, \"gen_ai.input.messages\")", "delete_key(log.attributes, \"gen_ai.output.messages\")", "delete_key(log.attributes, \"gen_ai.tool.call.arguments\")", "delete_key(log.attributes, \"gen_ai.tool.call.result\")", "delete_key(log.attributes, \"gen_ai.retrieval.query.text\")", "delete_key(log.attributes, \"gen_ai.retrieval.documents\")", "delete_key(log.attributes, \"gen_ai.prompt\")", "delete_key(log.attributes, \"gen_ai.completion\")", "delete_matching_keys(log.attributes, \"^gen_ai\\\\.(prompt|completion)\\\\.[0-9]+\\\\..+$\")", "delete_matching_keys(log.body, \"^(content|message|tool_calls)$\") where IsMap(log.body) and (IsMatch(log.event_name, \"^(gen_ai\\\\.system\\\\.message|gen_ai\\\\.user\\\\.message|gen_ai\\\\.assistant\\\\.message|gen_ai\\\\.tool\\\\.message|gen_ai\\\\.choice)$\") or IsMatch(log.attributes[\"event.name\"], \"^(gen_ai\\\\.system\\\\.message|gen_ai\\\\.user\\\\.message|gen_ai\\\\.assistant\\\\.message|gen_ai\\\\.tool\\\\.message|gen_ai\\\\.choice)$\"))", "set(log.body, \"\") where IsString(log.body) and (IsMatch(log.event_name, \"^(gen_ai\\\\.system\\\\.message|gen_ai\\\\.user\\\\.message|gen_ai\\\\.assistant\\\\.message|gen_ai\\\\.tool\\\\.message|gen_ai\\\\.choice)$\") or IsMatch(log.attributes[\"event.name\"], \"^(gen_ai\\\\.system\\\\.message|gen_ai\\\\.user\\\\.message|gen_ai\\\\.assistant\\\\.message|gen_ai\\\\.tool\\\\.message|gen_ai\\\\.choice)$\"))"]
      redaction/genai_content:
        allow_all_keys: true
        blocked_key_patterns: [^(gen_ai\.system_instructions|gen_ai\.input\.messages|gen_ai\.output\.messages|gen_ai\.tool\.call\.arguments|gen_ai\.tool\.call\.result|gen_ai\.retrieval\.query\.text|gen_ai\.retrieval\.documents|gen_ai\.prompt|gen_ai\.completion)$, "^gen_ai\\.(prompt|completion)\\.[0-9]+\\..+$"]
      tail_sampling:
        decision_wait: 5s
        num_traces: 50000
        policies:
          - name: errors
            type: status_code
            status_code:
              status_codes: [ERROR]
          - name: slow
            type: latency
            latency:
              threshold_ms: 2000
          - name: baseline
            type: probabilistic
            probabilistic:
              sampling_percentage: 10
      batch:
        timeout: 5s
      filter/genai_spans:
        error_mode: ignore
        traces:
          span: ["attributes[\"gen_ai.operation.name\"] == nil"]
    
    exporters:
      otlp/tempo:
        endpoint: tempo:4317
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889
        metric_expiration: 10m
      otlphttp/loki:
        endpoint: http://loki:3100/otlp
    
    connectors:
      spanmetrics:
        histogram:
          unit: ms
          explicit:
            buckets: [50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s, 10s]
        metrics_flush_interval: 15s
      forward/genai: {}
      forward/sampled: {}
      spanmetrics/genai:
        namespace: genai
        dimensions:
          - name: gen_ai.operation.name
          - name: gen_ai.request.model
          - name: gen_ai.tool.name
          - name: error.type
        histogram:
          unit: s
          explicit:
            buckets: [100ms, 250ms, 500ms, 1s, 2s, 5s, 10s, 20s, 40s, 80s]
        metrics_flush_interval: 15s
      sum/genai_tokens:
        spans:
          genai.tokens.input:
            source_attribute: gen_ai.usage.input_tokens
            description: Input tokens used by GenAI operations
            conditions: ["attributes[\"gen_ai.usage.input_tokens\"] != nil and not (kind == SPAN_KIND_INTERNAL and (attributes[\"gen_ai.operation.name\"] == \"invoke_agent\" or attributes[\"gen_ai.operation.name\"] == \"invoke_workflow\"))"]
            attributes:
              - key: gen_ai.request.model
                default_value: unknown
          genai.tokens.output:
            source_attribute: gen_ai.usage.output_tokens
            description: Output tokens used by GenAI operations
            conditions: ["attributes[\"gen_ai.usage.output_tokens\"] != nil and not (kind == SPAN_KIND_INTERNAL and (attributes[\"gen_ai.operation.name\"] == \"invoke_agent\" or attributes[\"gen_ai.operation.name\"] == \"invoke_workflow\"))"]
            attributes:
              - key: gen_ai.request.model
                default_value: unknown
    
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, transform/genai_content, redaction/genai_content]
          exporters: [spanmetrics, forward/genai, forward/sampled]
        traces/sampled:
          receivers: [forward/sampled]
          processors: [tail_sampling, batch]
          exporters: [otlp/tempo]
        traces/genai:
          receivers: [forward/genai]
          processors: [filter/genai_spans]
          exporters: [spanmetrics/genai, sum/genai_tokens]
        metrics:
          receivers: [otlp, spanmetrics, spanmetrics/genai, sum/genai_tokens]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, transform/genai_content, redaction/genai_content, batch]
          exporters: [otlphttp/loki]

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: otel-gateway
  namespace: observability
  labels:
    app.kubernetes.io/name: otel-gateway
    app.kubernetes.io/managed-by: chant
    app.kubernetes.io/component: gateway
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-gateway

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboards
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: dashboards
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:12.4.11
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: 'true'
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: 'false'
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: 'false'
            - name: GF_PLUGINS_PREINSTALL_DISABLED
              value: 'true'
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: '100m'
              memory: '128Mi'
            limits:
              cpu: '1'
              memory: '512Mi'
          securityContext:
            runAsNonRoot: true
            runAsUser: 472
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning
              readOnly: true
            - name: grafana-dashboards-0
              mountPath: /var/lib/grafana/dashboards/Agent observability
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: grafana-provisioning
          projected:
            sources:
              - configMap:
                  name: grafana-datasources
                  items:
                    - key: chant.yaml
                      path: datasources/chant.yaml
              - configMap:
                  name: grafana-dashboard-providers
                  items:
                    - key: chant.yaml
                      path: dashboards/chant.yaml
        - name: grafana-dashboards-0
          projected:
            sources:
              - configMap:
                  name: grafana-dashboard-red-traces-span-metrics
                  items:
                    - key: red-traces-span-metrics.json
                      path: red-traces-span-metrics.json
              - configMap:
                  name: grafana-dashboard-slo-support-agent-runs
                  items:
                    - key: slo-support-agent-runs.json
                      path: slo-support-agent-runs.json
              - configMap:
                  name: grafana-dashboard-genai-agents
                  items:
                    - key: genai-agents.json
                      path: genai-agents.json

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-red-traces-span-metrics
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboards
    grafana_dashboard: '1'
  annotations:
    k8s-sidecar-target-directory: Agent observability
data:
  red-traces-span-metrics.json: |
    {
      "annotations": {
        "list": []
      },
      "description": "Rate, errors and duration per service from the traces.span.metrics span metrics.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "type": "row",
          "collapsed": false,
          "title": "Rate and errors",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": []
        },
        {
          "type": "timeseries",
          "id": 2,
          "title": "Rate",
          "description": "Spans per second by service, from traces_span_metrics_calls_total.",
