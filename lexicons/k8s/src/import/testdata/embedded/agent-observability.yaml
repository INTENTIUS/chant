apiVersion: v1
kind: Namespace
metadata:
  name: agents
  labels:
    app.kubernetes.io/name: agents
    app.kubernetes.io/managed-by: chant
    app.kubernetes.io/part-of: agent-observability
    app.kubernetes.io/component: namespace

---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/name: observability
    app.kubernetes.io/managed-by: chant
    app.kubernetes.io/part-of: agent-observability
    app.kubernetes.io/component: namespace

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-agent
  namespace: observability
  labels:
    app.kubernetes.io/name: otel-agent
    app.kubernetes.io/managed-by: chant
    app.kubernetes.io/component: agent
  annotations:
    otel.chant.dev/role: agent
    otel.chant.dev/config: otel-agent-config
    otel.chant.dev/gateways: observability/otel-gateway=loadbalancing,observability/otel-gateway=service
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-agent
    spec:
      serviceAccountName: otel-agent-sa
      containers:
        - name: otel-agent
          image: otel/opentelemetry-collector-contrib:0.130.0
          args:
            - --config=/etc/otel/config.yaml
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 13133
              name: health
          resources:
            requests:
              cpu: '100m'
              memory: '256Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
          volumeMounts:
            - name: config
              mountPath: /etc/otel
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /
              port: health
          readinessProbe:
            httpGet:
              path: /
              port: health
      volumes:
        - name: config
          configMap:
            name: otel-agent-config
      tolerations:
        - operator: Exists

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-agent-sa
  namespace: observability
  labels:
    app.kubernetes.io/name: otel-agent
    app.kubernetes.io/managed-by: chant
    app.kubernetes.io/component: agent

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-agent-role
  labels:
    app.kubernetes.io/name: otel-agent
    app.kubernetes.io/managed-by: chant
    app.kubernetes.io/component: rbac
rules:
  - apiGroups:
      - ''
    resources:
      - pods
      - nodes
      - endpoints
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ''
    resources:
      - nodes/proxy
    verbs:
      - get
  - apiGroups:
      - ''
    resources:
      - nodes/stats
      - configmaps
      - events
    verbs:
      - create
      - get
  - apiGroups:
      - ''
    resources:
      - configmaps
    verbs:
      - get
      - update
      - create
    resourceNames:
      - otel-container-insight-clusterleader

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-agent-binding
  labels:
    app.kubernetes.io/name: otel-agent
    app.kubernetes.io/managed-by: chant
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-agent-role
subjects:
  - kind: ServiceAccount
    name: otel-agent-sa
    namespace: observability

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-agent-config
  namespace: observability
  labels:
    app.kubernetes.io/name: otel-agent
    app.kubernetes.io/managed-by: chant
    app.kubernetes.io/component: config
  annotations:
    otel.chant.dev/role: agent
    otel.chant.dev/workload: DaemonSet/otel-agent
    otel.chant.dev/gateways: observability/otel-gateway=loadbalancing,observability/otel-gateway=service
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      batch:
        timeout: 1s
    
    exporters:
      loadbalancing/gateway:
        routing_key: traceID
        protocol:
          otlp:
            tls:
              insecure: true
        resolver:
          k8s:
            service: otel-gateway-headless.observability
            ports: [4317]
      otlp/gateway:
        endpoint: otel-gateway.observability.svc:4317
        tls:
          insecure: true
    
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [loadbalancing/gateway]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/gateway]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/gateway]

---
apiVersion: v1
kind: Service
metadata:
  name: otel-agent
  namespace: observability
  labels:
    app.kubernetes.io/name: otel-agent
    app.kubernetes.io/managed-by: chant
    app.kubernetes.io/component: agent
spec:
  selector:
    app.kubernetes.io/name: otel-agent
  internalTrafficPolicy: Local
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP

---
apiVersion: rbac.authorization.k8s.io/v1
