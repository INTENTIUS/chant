  namespace: observability
  labels:
    app.kubernetes.io/name: otel-agent
    app.kubernetes.io/managed-by: chant
    app.kubernetes.io/component: rbac
rules:
  - apiGroups:
      - ''
    resources:
      - endpoints
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: otel-agent-endpoints
  namespace: observability
  labels:
    app.kubernetes.io/name: otel-agent
    app.kubernetes.io/managed-by: chant
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: otel-agent-endpoints
subjects:
  - kind: ServiceAccount
    name: otel-agent-sa
    namespace: observability

