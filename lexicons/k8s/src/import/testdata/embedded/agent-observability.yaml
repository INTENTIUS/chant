apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/managed-by: chant
    app.kubernetes.io/component: config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/rules.yml
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:80"]
    scrape_configs:
      - job_name: otel-gateway
        dns_sd_configs:
          - names: ["otel-gateway-headless.observability.svc.cluster.local"]
            type: A
            port: 8889
            refresh_interval: 15s
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
  rules.yml: |
    groups:
      - name: slo-support-agent-runs
        interval: 15s
        labels:
          team: agents
        rules:
          - record: slo:sli_error:ratio_rate5m
            expr: |-
              ((sum(rate(traces_span_metrics_calls_total{service_name="support-agent",span_name="invoke_agent support",status_code="STATUS_CODE_ERROR"}[5m]))) or 0 * ((sum(rate(traces_span_metrics_calls_total{service_name="support-agent",span_name="invoke_agent support"}[5m]))) > 0))
              /
              ((sum(rate(traces_span_metrics_calls_total{service_name="support-agent",span_name="invoke_agent support"}[5m]))) > 0)
            labels:
              slo: support-agent-runs
          - record: slo:sli_error:ratio_rate30m
            expr: |-
              ((sum(rate(traces_span_metrics_calls_total{service_name="support-agent",span_name="invoke_agent support",status_code="STATUS_CODE_ERROR"}[30m]))) or 0 * ((sum(rate(traces_span_metrics_calls_total{service_name="support-agent",span_name="invoke_agent support"}[30m]))) > 0))
              /
              ((sum(rate(traces_span_metrics_calls_total{service_name="support-agent",span_name="invoke_agent support"}[30m]))) > 0)
            labels:
              slo: support-agent-runs
          - record: slo:sli_error:ratio_rate1h
            expr: |-
              ((sum(rate(traces_span_metrics_calls_total{service_name="support-agent",span_name="invoke_agent support",status_code="STATUS_CODE_ERROR"}[1h]))) or 0 * ((sum(rate(traces_span_metrics_calls_total{service_name="support-agent",span_name="invoke_agent support"}[1h]))) > 0))
              /
              ((sum(rate(traces_span_metrics_calls_total{service_name="support-agent",span_name="invoke_agent support"}[1h]))) > 0)
            labels:
              slo: support-agent-runs
          - record: slo:sli_error:ratio_rate2h
            expr: |-
              ((sum(rate(traces_span_metrics_calls_total{service_name="support-agent",span_name="invoke_agent support",status_code="STATUS_CODE_ERROR"}[2h]))) or 0 * ((sum(rate(traces_span_metrics_calls_total{service_name="support-agent",span_name="invoke_agent support"}[2h]))) > 0))
              /
              ((sum(rate(traces_span_metrics_calls_total{service_name="support-agent",span_name="invoke_agent support"}[2h]))) > 0)
            labels:
              slo: support-agent-runs
          - record: slo:sli_error:ratio_rate6h
            expr: |-
              ((sum(rate(traces_span_metrics_calls_total{service_name="support-agent",span_name="invoke_agent support",status_code="STATUS_CODE_ERROR"}[6h]))) or 0 * ((sum(rate(traces_span_metrics_calls_total{service_name="support-agent",span_name="invoke_agent support"}[6h]))) > 0))
              /
              ((sum(rate(traces_span_metrics_calls_total{service_name="support-agent",span_name="invoke_agent support"}[6h]))) > 0)
            labels:
              slo: support-agent-runs
          - record: slo:sli_error:ratio_rate1d
            expr: |-
              ((sum(rate(traces_span_metrics_calls_total{service_name="support-agent",span_name="invoke_agent support",status_code="STATUS_CODE_ERROR"}[1d]))) or 0 * ((sum(rate(traces_span_metrics_calls_total{service_name="support-agent",span_name="invoke_agent support"}[1d]))) > 0))
              /
              ((sum(rate(traces_span_metrics_calls_total{service_name="support-agent",span_name="invoke_agent support"}[1d]))) > 0)
            labels:
              slo: support-agent-runs
          - record: slo:sli_error:ratio_rate3d
            expr: |-
              ((sum(rate(traces_span_metrics_calls_total{service_name="support-agent",span_name="invoke_agent support",status_code="STATUS_CODE_ERROR"}[3d]))) or 0 * ((sum(rate(traces_span_metrics_calls_total{service_name="support-agent",span_name="invoke_agent support"}[3d]))) > 0))
              /
              ((sum(rate(traces_span_metrics_calls_total{service_name="support-agent",span_name="invoke_agent support"}[3d]))) > 0)
            labels:
              slo: support-agent-runs
          - record: slo:sli_error:ratio_rate28d
            expr: avg_over_time(slo:sli_error:ratio_rate5m{slo="support-agent-runs"}[28d])
            labels:
              slo: support-agent-runs
          - record: slo:objective:ratio
            expr: vector(0.99)
            labels:
              slo: support-agent-runs
          - record: slo:error_budget:remaining
            expr: 1 - (slo:sli_error:ratio_rate28d{slo="support-agent-runs"} / 0.01)
            labels:
              slo: support-agent-runs
          - alert: ErrorBudgetBurn
            expr: |-
              (
                slo:sli_error:ratio_rate1h{slo="support-agent-runs"} > (13.44 * 0.01)
              )
              and
              (
                slo:sli_error:ratio_rate5m{slo="support-agent-runs"} > (13.44 * 0.01)
              )
            labels:
              slo: support-agent-runs
              severity: page
              long_window: 1h
              short_window: 5m
            annotations:
              summary: SLO support-agent-runs is burning its error budget more than 13.44x too fast (1h and 5m windows)
              description: Support agent runs end without an error span. The error ratio over both the last 1h and the last 5m is above 0.1344 (13.44 times the 0.01 budget of a 0.99 objective). At that rate the 28d error budget is gone in 2d2h.
          - alert: ErrorBudgetBurn
            expr: |-
              (
                slo:sli_error:ratio_rate6h{slo="support-agent-runs"} > (5.6 * 0.01)
              )
              and
              (
                slo:sli_error:ratio_rate30m{slo="support-agent-runs"} > (5.6 * 0.01)
              )
            labels:
              slo: support-agent-runs
              severity: page
              long_window: 6h
              short_window: 30m
            annotations:
              summary: SLO support-agent-runs is burning its error budget more than 5.6x too fast (6h and 30m windows)
              description: Support agent runs end without an error span. The error ratio over both the last 6h and the last 30m is above 0.056 (5.6 times the 0.01 budget of a 0.99 objective). At that rate the 28d error budget is gone in 5d.
          - alert: ErrorBudgetBurn
            expr: |-
              (
                slo:sli_error:ratio_rate1d{slo="support-agent-runs"} > (2.8 * 0.01)
              )
              and
              (
                slo:sli_error:ratio_rate2h{slo="support-agent-runs"} > (2.8 * 0.01)
              )
            labels:
              slo: support-agent-runs
              severity: ticket
              long_window: 1d
              short_window: 2h
            annotations:
              summary: SLO support-agent-runs is burning its error budget more than 2.8x too fast (1d and 2h windows)
              description: Support agent runs end without an error span. The error ratio over both the last 1d and the last 2h is above 0.028 (2.8 times the 0.01 budget of a 0.99 objective). At that rate the 28d error budget is gone in 1w3d.
          - alert: ErrorBudgetBurn
            expr: |-
              (
                slo:sli_error:ratio_rate3d{slo="support-agent-runs"} > (0.933333 * 0.01)
              )
              and
              (
                slo:sli_error:ratio_rate6h{slo="support-agent-runs"} > (0.933333 * 0.01)
              )
            labels:
              slo: support-agent-runs
              severity: ticket
              long_window: 3d
              short_window: 6h
            annotations:
              summary: SLO support-agent-runs is burning its error budget more than 0.933333x too fast (3d and 6h windows)
              description: Support agent runs end without an error span. The error ratio over both the last 3d and the last 6h is above 0.00933333 (0.933333 times the 0.01 budget of a 0.99 objective). At that rate the 28d error budget is gone in 4w2d.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: observability
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/component: traces
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tempo
        app.kubernetes.io/component: traces
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: tempo
          image: grafana/tempo:2.9.0
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/tempo/tempo.yaml
          ports:
            - name: http
              containerPort: 3200
            - name: otlp-grpc
              containerPort: 4317
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: '100m'
              memory: '256Mi'
            limits:
              cpu: '1'
              memory: '1Gi'
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
              readOnly: true
            - name: data
              mountPath: /var/tempo
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: tempo-config
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: observability
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/component: traces
data:
  tempo.yaml: |
    stream_over_http_enabled: true
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
    ingester:
      max_block_duration: 5m
    compactor:
      compaction:
        block_retention: 24h
    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks
    usage_report:
      reporting_enabled: false

---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: observability
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/component: traces
spec:
  selector:
    app.kubernetes.io/name: tempo
  ports:
    - name: http
      port: 3200
      targetPort: http
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
