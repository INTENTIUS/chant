  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: support-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: support-agent
        app.kubernetes.io/component: agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: agent
          image: agent-observability-demo:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: OTLP_ENDPOINT
              value: http://otel-agent.observability.svc:4318
            - name: INTERVAL_MS
              value: '2000'
          resources:
            requests:
              cpu: '20m'
              memory: '64Mi'
            limits:
              cpu: '200m'
              memory: '128Mi'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

---
