# as a connector. collector-contrib ships a receiver and a connector of that
# type, so the real collector gets as far as comparing the ids.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
  datadog:
    endpoint: 127.0.0.1:8126

exporters:
  debug: {}

connectors:
  datadog: {}

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [datadog]
    metrics:
      receivers: [datadog]
      exporters: [debug]
