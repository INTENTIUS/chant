# Vendored from opentelemetry-collector-contrib v0.130.0 (Apache-2.0), unchanged below this header:
# https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/v0.130.0/examples/logline-filtering/otel-col-config-filter-out-logs.yaml

receivers:
  filelog:
    include: [/var/log/busybox/simple.log]
    operators:
      - type: filter
        expr: 'body matches "^INFO:"'

service:
  pipelines:
    logs:
      receivers: [filelog]
      exporters: [otlp/custom]
      processors: []

exporters:
  otlp/custom:
    endpoint: http://0.0.0.0:4242
