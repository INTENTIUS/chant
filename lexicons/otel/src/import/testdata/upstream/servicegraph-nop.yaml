# Vendored from opentelemetry-collector-contrib v0.130.0 (Apache-2.0), unchanged below this header:
# https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/v0.130.0/connector/servicegraphconnector/testdata/service-graph-connector-config.yaml

receivers:
  nop:

exporters:
  nop:

connectors:
  servicegraph:
    latency_histogram_buckets: [1,2,3,4,5]
    dimensions:
      - dimension-1
      - dimension-2
    store:
      ttl: 1s
      max_items: 10
    database_name_attributes: [db.name]

service:
  pipelines:
    traces:
      receivers: [nop]
      exporters: [servicegraph]
    metrics:
      receivers: [servicegraph]
      exporters: [nop]
