# Vendored from opentelemetry-collector-contrib v0.130.0 (Apache-2.0), unchanged below this header:
# https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/v0.130.0/examples/secure-tracing/otel-collector-config.yaml

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:55690
        tls:
          cert_file: /etc/otel-collector.crt
          key_file: /etc/otel-collector.key

processors:
  batch:

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]

