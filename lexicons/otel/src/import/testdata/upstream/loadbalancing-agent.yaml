# Vendored from opentelemetry-collector-contrib v0.130.0 (Apache-2.0), unchanged below this header:
# https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/v0.130.0/exporter/loadbalancingexporter/example/otel-agent-config.yaml

receivers:
  fluentforward:
    endpoint: 0.0.0.0:24224

processors:
  batch:

exporters:
  debug:
    verbosity: detailed
  loadbalancing:
    protocol:
      otlp:
        timeout: 1s
        tls:
          insecure: true
    resolver:
      static:
        hostnames:
          - otel-collector-1:4317
          - otel-collector-2:4317
          - otel-collector-3:4317

extensions:
  health_check:
  pprof:
  zpages:

service:
  extensions: [pprof, zpages, health_check]
  pipelines:
    logs:
      receivers: [fluentforward]
      processors: [batch]
      exporters: [loadbalancing, debug]
