# A collector writing every signal to ClickHouse tables the sql lexicon manages (#4397).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
processors:
  batch: {}
exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000
    database: otel
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    create_schema: false
    logs_table_name: app_logs
    metrics_tables:
      exponential_histogram:
        name: app_exp_histogram
    sending_queue:
      queue_size: 1000
    retry_on_failure:
      enabled: true
service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse]
