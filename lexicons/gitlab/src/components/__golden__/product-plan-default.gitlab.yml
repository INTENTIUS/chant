workflow:
  name: chant-pr-default
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_MERGE_REQUEST_PROJECT_ID'
    - if: '$CI_PIPELINE_SOURCE =~ /^(schedule|web|api|trigger)$/ && $CHANT_PLAN_NOTES == "1" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api|trigger)$/ && $CHANT_PREVIEW_PR =~ /^[0-9]+$/ && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE =~ /^(schedule|web|api|trigger)$/ && $CHANT_NOTE_COMMANDS == "1" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api|trigger)$/ && $CHANT_LOCK_PR =~ /^[0-9]+$/ && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api|trigger)$/ && $CHANT_UNLOCK_PR =~ /^[0-9]+$/ && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

stages:
  - plan
  - evidence
  - plan-note
  - lock
  - note-commands
  - comment-lock
  - comment-unlock
  - replan
  - replan-note

variables:
  CHANT_ENV: default
  GIT_DEPTH: '0'

plan:
  stage: plan
  image: node:22
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_MERGE_REQUEST_PROJECT_ID'
  variables:
    BASE_SHA: '$CI_MERGE_REQUEST_DIFF_BASE_SHA'
    PR_NUMBER: '$CI_MERGE_REQUEST_IID'
    CHANT_PLAN_RECORD: '{"op":"pr-plan","env":"default","labels":{"Env":"default","Pipeline":"pr","Job":"plan"}}'
  script:
    - unset CHANT_FORGE_TOKEN CHANT_GITHUB_TOKEN CHANT_FORGEJO_TOKEN CHANT_GITLAB_TOKEN CHANT_CHECKOUT_TOKEN GITHUB_TOKEN GH_TOKEN FORGEJO_TOKEN GITEA_TOKEN GITLAB_TOKEN CI_JOB_TOKEN ACTIONS_RUNTIME_TOKEN
    - command -v tofu >/dev/null 2>&1 || (curl -fsSL https://get.opentofu.org/install-opentofu.sh -o /tmp/install-opentofu.sh && sh /tmp/install-opentofu.sh --install-method standalone)
    - npm ci
    - chant_plan_started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    - chant_plan_exit=0
    - terragucci plan --pr-note .chant/pr || chant_plan_exit=$?
    - 'CHANT_PLAN_EXIT="$chant_plan_exit" CHANT_PLAN_STARTED="$chant_plan_started" node -e ''const fs=require("fs"),path=require("path"),cp=require("child_process"),crypto=require("crypto");const c=JSON.parse(process.env.CHANT_PLAN_RECORD||"{}"),dir=process.argv[1];const code=Number(process.env.CHANT_PLAN_EXIT||"1"),ended=new Date().toISOString(),started=new Date(Date.parse(process.env.CHANT_PLAN_STARTED||"")||Date.now()).toISOString();let sha="";try{sha=cp.execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8",stdio:["ignore","pipe","ignore"]}).trim()}catch{}const ok=code===0,status=ok?"ok":"fail",ms=Math.max(0,Date.parse(ended)-Date.parse(started));const rec={id:crypto.randomUUID(),op:c.op,env:c.env,started,ended,status,labels:c.labels||{},outcomes:{},phases:[{name:"plan",status,steps:[{fn:"shellCmd",status,durationMs:ms,...(ok?{}:{error:"command exited "+code})}]}],...(sha?{gitSha:sha}:{}),...(ok?{}:{failure:{code:"command-failed",reason:"the plan verb exited "+code,phase:"plan",exitCode:code}})};fs.mkdirSync(dir,{recursive:true});fs.writeFileSync(path.join(dir,"run-record.json"),JSON.stringify(rec)+"\n");'' .chant/pr || echo "chant: the plan''s run record was not written" >&2'
    - '[ "$chant_plan_exit" -eq 0 ] || exit "$chant_plan_exit"'
  artifacts:
    name: chant-pr-plan
    when: always
    paths:
      - .chant/pr

plan-evidence:
  stage: evidence
  image: node:22
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(schedule|web|api|trigger)$/ && $CHANT_PLAN_NOTES == "1" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  environment:
    name: chant-evidence
    action: access
  variables:
    CHANT_RUNNER_KEY: '$CHANT_RUNNER_KEY_PEM'
  script:
    - npm ci
    - terragucci chant ci evidence sign --open --job plan --from-report .chant/pr --base "$CI_COMMIT_SHA" --output .chant/evidence/plan --no-forks
  artifacts:
    when: always
    paths:
      - .chant/evidence/plan

plan-note:
  stage: plan-note
  image: node:22
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(schedule|web|api|trigger)$/ && $CHANT_PLAN_NOTES == "1" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
  script:
    - npm ci
    - terragucci chant components pr-post --open --env default --output .chant/pr --forge gitlab --record-run plan --evidence-dir .chant/evidence/plan

lock:
  stage: lock
  image: node:22
  resource_group: lock
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(schedule|web|api|trigger)$/ && $CHANT_PLAN_NOTES == "1" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    CHANT_LOCK_REACH:
      value: terragucci reached --base "$BASE_SHA" --head "$HEAD_SHA"
      expand: false
  script:
    - npm ci
    - terragucci chant lock --reach --open --base "$CI_COMMIT_SHA" --stage plan --forge gitlab

note-commands:
  stage: note-commands
  image: node:22
  resource_group: note-commands
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(schedule|web|api|trigger)$/ && $CHANT_NOTE_COMMANDS == "1" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - npm ci
    - terragucci chant components pr-notes --forge gitlab --preview-comment --locks

comment-lock:
  stage: comment-lock
  image: node:22
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api|trigger)$/ && $CHANT_LOCK_PR =~ /^[0-9]+$/ && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    PR_NUMBER: '$CHANT_LOCK_PR'
  script:
    - npm ci
    - terragucci chant lock --keep --pr "$PR_NUMBER" --forge gitlab

comment-unlock:
  stage: comment-unlock
  image: node:22
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api|trigger)$/ && $CHANT_UNLOCK_PR =~ /^[0-9]+$/ && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    PR_NUMBER: '$CHANT_UNLOCK_PR'
  script:
    - npm ci
    - terragucci chant unlock --pr "$PR_NUMBER"

replan:
  stage: replan
  image: node:22
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api|trigger)$/ && $CHANT_PREVIEW_PR =~ /^[0-9]+$/ && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($CHANT_PREVIEW_COMMENT =~ /^\/terragucci plan( +[A-Za-z0-9_.\/@+=,:][A-Za-z0-9_.\/@+=,:-]*)? *$/)'
  variables:
    BASE_SHA: '$CI_COMMIT_SHA'
    PR_NUMBER: '$CHANT_PREVIEW_PR'
    CHANT_PLAN_RECORD: '{"op":"pr-plan","env":"default","labels":{"Env":"default","Pipeline":"pr","Job":"plan"}}'
  script:
    - unset CHANT_FORGE_TOKEN CHANT_GITHUB_TOKEN CHANT_FORGEJO_TOKEN CHANT_GITLAB_TOKEN CHANT_CHECKOUT_TOKEN GITHUB_TOKEN GH_TOKEN FORGEJO_TOKEN GITEA_TOKEN GITLAB_TOKEN CI_JOB_TOKEN ACTIONS_RUNTIME_TOKEN
    - unset CHANT_RUNNER_KEY
    - echo "$PR_NUMBER" | grep -Eq '^[0-9]+$' && git fetch --quiet origin "+refs/merge-requests/$PR_NUMBER/head:refs/remotes/origin/chant-apply/$PR_NUMBER" && git checkout --quiet --detach "refs/remotes/origin/chant-apply/$PR_NUMBER"
    - git fetch -q --no-tags origin '+refs/heads/chant/lifecycle:refs/heads/chant/lifecycle' 2>/dev/null || true
    - 'git remote set-url origin "$(git remote get-url origin | sed -E ''s#//[^@/]*@#//#'')"'
    - 'case "$CHANT_PREVIEW_COMMENT" in "/terragucci plan"*) chant_rest="${CHANT_PREVIEW_COMMENT#"/terragucci plan"}" ;; *) chant_rest="" ;; esac'
    - CHANT_PLAN_ARGUMENT="$(printf '%s' "$chant_rest" | tr -d ' ')" && export CHANT_PLAN_ARGUMENT
    - command -v tofu >/dev/null 2>&1 || (curl -fsSL https://get.opentofu.org/install-opentofu.sh -o /tmp/install-opentofu.sh && sh /tmp/install-opentofu.sh --install-method standalone)
    - npm ci
    - chant_plan_started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    - chant_plan_exit=0
    - terragucci plan --pr-note .chant/pr || chant_plan_exit=$?
    - 'CHANT_PLAN_EXIT="$chant_plan_exit" CHANT_PLAN_STARTED="$chant_plan_started" node -e ''const fs=require("fs"),path=require("path"),cp=require("child_process"),crypto=require("crypto");const c=JSON.parse(process.env.CHANT_PLAN_RECORD||"{}"),dir=process.argv[1];const code=Number(process.env.CHANT_PLAN_EXIT||"1"),ended=new Date().toISOString(),started=new Date(Date.parse(process.env.CHANT_PLAN_STARTED||"")||Date.now()).toISOString();let sha="";try{sha=cp.execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8",stdio:["ignore","pipe","ignore"]}).trim()}catch{}const ok=code===0,status=ok?"ok":"fail",ms=Math.max(0,Date.parse(ended)-Date.parse(started));const rec={id:crypto.randomUUID(),op:c.op,env:c.env,started,ended,status,labels:c.labels||{},outcomes:{},phases:[{name:"plan",status,steps:[{fn:"shellCmd",status,durationMs:ms,...(ok?{}:{error:"command exited "+code})}]}],...(sha?{gitSha:sha}:{}),...(ok?{}:{failure:{code:"command-failed",reason:"the plan verb exited "+code,phase:"plan",exitCode:code}})};fs.mkdirSync(dir,{recursive:true});fs.writeFileSync(path.join(dir,"run-record.json"),JSON.stringify(rec)+"\n");'' .chant/pr || echo "chant: the plan''s run record was not written" >&2'
    - '[ "$chant_plan_exit" -eq 0 ] || exit "$chant_plan_exit"'
  artifacts:
    name: chant-pr-plan-replan
    when: always
    paths:
      - .chant/pr

replan-note:
  stage: replan-note
  image: node:22
  needs:
    - job: replan
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api|trigger)$/ && $CHANT_PREVIEW_PR =~ /^[0-9]+$/ && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($CHANT_PREVIEW_COMMENT =~ /^\/terragucci plan( +[A-Za-z0-9_.\/@+=,:][A-Za-z0-9_.\/@+=,:-]*)? *$/)'
      when: always
  variables:
    PR_NUMBER: '$CHANT_PREVIEW_PR'
  script:
    - npm ci
    - HEAD_SHA="$(git ls-remote origin "refs/merge-requests/$PR_NUMBER/head" | cut -f1)" && export HEAD_SHA
    - 'case "$CHANT_PREVIEW_COMMENT" in "/terragucci plan"*) chant_rest="${CHANT_PREVIEW_COMMENT#"/terragucci plan"}" ;; *) chant_rest="" ;; esac'
    - CHANT_PLAN_ARGUMENT="$(printf '%s' "$chant_rest" | tr -d ' ')" && export CHANT_PLAN_ARGUMENT
    - terragucci chant components pr-post --pr "$PR_NUMBER" --head "$HEAD_SHA" --env default --output .chant/pr --forge gitlab --not-affected "$CHANT_PLAN_ARGUMENT" --record-run replan
