# A prometheus.yml using the typed sections and every typed service discovery kind.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    cluster: prod-eu
    replica: a
  query_log_file: /var/log/prometheus/queries.log
  body_size_limit: 10MB
  sample_limit: 50000
  label_limit: 64
  target_limit: 500
alerting:
  alert_relabel_configs:
    - source_labels: [replica]
      regex: a
      action: labeldrop
  alertmanagers:
    - scheme: http
      path_prefix: /alertmanager
      timeout: 10s
      api_version: v2
      static_configs:
        - targets: ["alertmanager-0:9093", "alertmanager-1:9093"]
rule_files:
  - rules/*.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          tier: control
  - job_name: otel-collector
    scrape_interval: 5s
    scrape_timeout: 4s
    metrics_path: /metrics
    honor_labels: true
    honor_timestamps: false
    params:
      format: [prometheus]
    static_configs:
      - targets: ["otel-collector:8889"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "go_.*"
        action: drop
      - source_labels: [job, instance]
        separator: "/"
        target_label: job_instance
        replacement: "$1"
        action: replace
  - job_name: kubernetes-pods
    scheme: https
    tls_config:
      insecure_skip_verify: true
    authorization:
      type: Bearer
      credentials: sample-token
    kubernetes_sd_configs:
      - role: pod
        api_server: https://kubernetes.default.svc:443
        namespaces:
          names: [default, observability]
        selectors:
          - role: pod
            label: app=api
        attach_metadata:
          node: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__address__]
        modulus: 4
        target_label: __tmp_hash
        action: hashmod
  - job_name: files
    file_sd_configs:
      - files: [targets/*.json, targets/*.yml]
        refresh_interval: 1m
  - job_name: http-targets
    basic_auth:
      username: scraper
      password: sample-password
    http_sd_configs:
      - url: https://targets.example.com/sd
        refresh_interval: 2m
  - job_name: dns-targets
    dns_sd_configs:
      - names: [api.service.internal]
        type: A
        port: 9100
        refresh_interval: 30s
  - job_name: ec2-nodes
    ec2_sd_configs:
      - region: eu-west-1
        port: 9100
        refresh_interval: 5m
        filters:
          - name: tag:monitoring
            values: ["true"]
  - job_name: consul-services
    bearer_token: sample-bearer
    consul_sd_configs:
      - server: consul.service.internal:8500
        datacenter: dc1
        services: [api, worker]
        tags: [metrics]
        node_meta:
          rack: r1
        refresh_interval: 1m
  - job_name: docker-hosts
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
remote_write:
  - url: https://mimir.example.com/api/v1/push
    name: mimir
    remote_timeout: 30s
    headers:
      X-Scope-OrgID: tenant-1
    send_exemplars: true
    basic_auth:
      username: writer
      password: sample-password
    write_relabel_configs:
      - source_labels: [__name__]
        regex: "debug_.*"
        action: drop
    queue_config:
      capacity: 10000
      max_shards: 50
      max_samples_per_send: 2000
      batch_send_deadline: 5s
    metadata_config:
      send: true
      send_interval: 1m
remote_read:
  - url: https://mimir.example.com/prometheus/api/v1/read
    name: mimir-read
    read_recent: true
    required_matchers:
      env: prod
otlp:
  promote_resource_attributes: [service.name, k8s.namespace.name]
  translation_strategy: UnderscoreEscapingWithSuffixes
runtime:
  gogc: 75
