# Unchanged below this header.
global:
  telegram_bot_token_file: /global_file
route:
  receiver: team-X-telegram

receivers:
  - name: team-X-telegram
    telegram_configs:
      - chat_id: 123
  - name: team-Y-telegram
    telegram_configs:
      - chat_id: 456
        bot_token_file: /override_file
