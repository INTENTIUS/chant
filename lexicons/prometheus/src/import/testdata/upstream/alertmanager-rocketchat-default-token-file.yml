# Vendored from github.com/prometheus/alertmanager v0.34.1, config/testdata/conf.rocketchat-default-token-file.yml
# (https://github.com/prometheus/alertmanager/blob/v0.34.1/config/testdata/conf.rocketchat-default-token-file.yml). Apache-2.0.
# Unchanged below this header.
global:
  rocketchat_token_file: /global_file
  rocketchat_token_id_file: /etc/alertmanager/rocketchat_token_id
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  receiver: team-Y-rocketchat
  routes:
    - match:
        service: foo
      receiver: team-X-rocketchat
receivers:
  - name: 'team-X-rocketchat'
    rocketchat_configs:
      - channel: '#team-X'
  - name: 'team-Y-rocketchat'
    rocketchat_configs:
      - channel: '#team-Y'
        token_file: /override_file
        token_id_file: /override_file
