# Vendored from github.com/prometheus/alertmanager v0.34.1, config/testdata/conf.wechat-default-api-secret-file.yml
# (https://github.com/prometheus/alertmanager/blob/v0.34.1/config/testdata/conf.wechat-default-api-secret-file.yml). Apache-2.0.
# Unchanged below this header.
global:
  wechat_api_secret_file: '/global_file'
  wechat_api_corp_id: 'my_corp_id'
route:
  receiver: 'wechat-notifications'
  group_by: [alertname, datacenter, app]
receivers:
  - name: 'wechat-notifications'
    wechat_configs:
      # Use global
      - {}
      # Override global with other file
      - api_secret_file: '/override_file'
      # Override global with inline API secret
      - api_secret: 'my_inline_secret'
