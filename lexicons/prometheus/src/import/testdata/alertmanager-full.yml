# Deprecated spellings (match, match_re, source_match, the top-level
# mute_time_intervals), integrations this lexicon does not type (opsgenie,
# msteams), global fields outside the typed set, *_file credentials, Go
# templates, a YAML anchor with a merge key, and one literal credential.
global:
  resolve_timeout: 5m
  smtp_smarthost: smtp.example.com:587
  smtp_from: alertmanager@example.com
  smtp_auth_username: alertmanager
  smtp_auth_password_file: /etc/alertmanager/secrets/smtp-password
  slack_api_url_file: /etc/alertmanager/secrets/slack-url
  opsgenie_api_key_file: /etc/alertmanager/secrets/opsgenie-key
  http_config:
    follow_redirects: true
templates:
  - /etc/alertmanager/templates/*.tmpl
route:
  receiver: default
  group_by: [alertname, cluster]
  group_wait: 30s
  labels:
    summary: '{{ .GroupLabels.alertname }} in {{ .GroupLabels.cluster }}'
  routes:
    - match:
        severity: page
      match_re:
        service: ^(api|web)$
      receiver: oncall
      continue: true
    - matchers: ['team="db"']
      receiver: db-chat
      mute_time_intervals: [weekends]
      active_time_intervals: [business-hours]
    - match:
        alertname: Watchdog
      receiver: heartbeat
      repeat_interval: 1m
inhibit_rules:
  - name: page-mutes-ticket
    source_match:
      severity: page
    target_matchers: ['severity="ticket"']
    equal: [alertname, cluster]
receivers:
  - name: default
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/default-webhook-url
        max_alerts: 10
  - name: oncall
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/secrets/pagerduty-key
        description: '{{ template "pagerduty.default.description" . }}'
        details:
          firing: '{{ .Alerts.Firing | len }}'
    opsgenie_configs:
      - api_key_file: /etc/alertmanager/secrets/opsgenie-key
        priority: P1
  - name: db-chat
    slack_configs:
      - &slack
        channel: '#db-alerts'
        title: '{{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ end }}
        send_resolved: true
      - <<: *slack
        channel: '#db-oncall'
    msteams_configs:
      - webhook_url_file: /etc/alertmanager/secrets/teams-url
  - name: heartbeat
    email_configs:
      - to: heartbeat@example.com
        auth_username: heartbeat
        auth_password: hunter2
        headers:
          Subject: '[heartbeat] {{ .CommonLabels.alertname }}'
time_intervals:
  - name: business-hours
    time_intervals:
      - weekdays: ['monday:friday']
        times:
          - start_time: '09:00'
            end_time: '17:00'
        location: Europe/Berlin
mute_time_intervals:
  - name: weekends
    time_intervals:
      - weekdays: [saturday, sunday]
