{{- $password := .Values.adminPassword | default (randAlphaNum 16) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-admin
type: Opaque
data:
  admin-password: {{ $password | b64enc }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genvalues
  template:
    metadata:
      labels:
        app: genvalues
      annotations:
        # Derived from the generated value — hoisting the secret after render
        # leaves this checksum pointing at bytes that never deploy.
        checksum/secret: {{ $password | sha256sum }}
    spec:
      containers:
        - name: app
          image: nginx
