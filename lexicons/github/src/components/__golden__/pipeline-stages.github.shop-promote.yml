name: shop promote

on:
  workflow_dispatch:
    inputs:
      stage:
        description: The stage the release is promoted into
        required: true
        type: choice
        options:
          - staging
          - prod
      release:
        description: The release's label or digest
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote-staging:
    if: '${{ inputs.stage == ''staging'' }}'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container: node:22
    concurrency:
      group: shop-promote-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Promote the release into staging
        env:
          CHANT_PROMOTE_RELEASE: '${{ inputs.release }}'
        run: npx --no-install plywood components promote --to staging --release "$CHANT_PROMOTE_RELEASE"
  promote-prod:
    if: '${{ inputs.stage == ''prod'' }}'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container: node:22
    concurrency:
      group: shop-promote-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Promote the release into prod
        env:
          CHANT_PROMOTE_RELEASE: '${{ inputs.release }}'
        run: npx --no-install plywood components promote --to prod --release "$CHANT_PROMOTE_RELEASE"
