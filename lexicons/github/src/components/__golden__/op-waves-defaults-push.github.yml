  wave-2-wide-decide-evidence:
    runs-on: ubuntu-latest
    needs:
      - wave-2-wide-decide
    if: '!cancelled()'
    container: node:22
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check out the base, so none of the change's code runs here
        run: |
          CHANT_EVIDENCE_BASE="$(git rev-parse --verify 'HEAD^1'^{commit})" || exit 1
          git checkout --quiet --detach "$CHANT_EVIDENCE_BASE" || exit 1
          echo "CHANT_EVIDENCE_BASE=$CHANT_EVIDENCE_BASE" >> "$GITHUB_ENV"
      - name: Download the wave job's check claims
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tf-apply-wave-2-wide-decide-checks
          path: .chant/op-waves/tf-apply/checks
        continue-on-error: true
      - name: Sign wave 2 (wide)'s checks from the job's step results
        if: '!cancelled()'
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          CHANT_EVIDENCE_SOURCES: '{"policy:wide":{"step":"Check wave 2 (wide)''s plans against the policy"}}'
          CHANT_RUNNER_IDENTITY: oidc
        run: terragucci ci evidence sign --from-job wave-2-wide-decide --check-id policy:wide --claims .chant/op-waves/tf-apply/checks --at "$GITHUB_SHA" --base "$CHANT_EVIDENCE_BASE"
