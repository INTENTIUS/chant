        run: terragucci chant components pr-post --stale

# file: tf-apply-resume.yml
name: tf-apply-resume

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

concurrency:
  group: tf-apply-resume
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  resume:
    runs-on: ubuntu-latest
    container: node:22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resume the waves of tf-apply whose approval arrived
        run: terragucci run resume --op tf-apply
        env:
          GITHUB_TOKEN: '${{ github.token }}'
