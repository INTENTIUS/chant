          path: .chant/op-waves/tf-apply/outcomes/outcome-wave-1.json
          if-no-files-found: ignore
          include-hidden-files: true
          overwrite: true
      - name: Keep the job's check claims
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tf-apply-wave-1-canary-checks
          path: .chant/op-waves/tf-apply/checks
          if-no-files-found: ignore
          include-hidden-files: true
          overwrite: true
      - name: Write the apply report
        if: always()
        run: terragucci report canary
      - name: Keep the apply report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terragucci-report-wave-1-canary
          path: terragucci-report/
          if-no-files-found: ignore
          include-hidden-files: true
