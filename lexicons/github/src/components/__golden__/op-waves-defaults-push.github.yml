  wave-4-rest-evidence:
    runs-on: ubuntu-latest
    needs:
      - wave-4-rest
    if: '!cancelled()'
    container: node:22
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check out the base, so none of the change's code runs here
        run: |
          CHANT_EVIDENCE_BASE="$(git rev-parse --verify 'HEAD^1'^{commit})" || exit 1
          git checkout --quiet --detach "$CHANT_EVIDENCE_BASE" || exit 1
          echo "CHANT_EVIDENCE_BASE=$CHANT_EVIDENCE_BASE" >> "$GITHUB_ENV"
      - name: Download the wave job's check claims
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tf-apply-wave-4-rest-checks
          path: .chant/op-waves/tf-apply/checks
        continue-on-error: true
      - name: Sign wave 4 (rest)'s checks from the job's step results
        if: '!cancelled()'
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          CHANT_EVIDENCE_SOURCES: '{"policy:rest":{"step":"Check wave 4 (rest)''s plans against the policy"}}'
          CHANT_RUNNER_IDENTITY: oidc
        run: terragucci ci evidence sign --from-job wave-4-rest --check-id policy:rest --claims .chant/op-waves/tf-apply/checks --at "$GITHUB_SHA" --base "$CHANT_EVIDENCE_BASE"
  control-dispatch:
    runs-on: ubuntu-latest
    needs:
      - wave-4-rest
    if: '!cancelled()'
    container: node:22
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download the waves' outcomes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: .chant/op-waves/tf-apply/outcomes
      - name: Add up the waves' outcomes
        run: |
          outcome="$(terragucci run wave --spec .chant/op-waves/tf-apply.spec.json --waves-outcome)" || exit 1
          echo "CHANT_CONTROL_OUTCOME=$outcome" >> "$GITHUB_ENV"
      - name: Tell the control repo github.com/acme/control how network's waves ended
        env:
          CHANT_CONTROL_TOKEN: '${{ secrets.TG_CONTROL_TOKEN }}'
          CHANT_CONTROL_SHA: '${{ github.sha }}'
        run: |
          set -u
          member='network'
          op='deploy'
          sha="${CHANT_CONTROL_SHA:-}"
          case "$sha" in ""|*[!0-9a-f]*) echo "chant: the dispatch names no commit sha, so github.com/acme/control was not told" >&2; exit 1 ;; esac
          outcome="${CHANT_CONTROL_OUTCOME:-}"
          case "$outcome" in applied|partial|unchanged|waiting|failed) ;; *) echo "chant: the waves' outcome (\"$outcome\") is not one of applied, partial, unchanged, waiting, failed, so github.com/acme/control was not told" >&2; exit 1 ;; esac
          [ -n "${CHANT_CONTROL_TOKEN:-}" ] || { echo "chant: CHANT_CONTROL_TOKEN is empty; map the TG_CONTROL_TOKEN secret into it, so github.com/acme/control can be told" >&2; exit 1; }
          answer="$(mktemp)"
          code="$(printf 'Authorization: Bearer %s\n' "$CHANT_CONTROL_TOKEN" | curl -sS -o "$answer" -w '%{http_code}' -X POST -H @- -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -d '{"event_type":"chant-applied","client_payload":{"member":"'"$member"'","op":"'"$op"'","sha":"'"$sha"'","outcome":"'"$outcome"'"}}' 'https://api.github.com/repos/acme/control/dispatches')" || { echo "chant: the dispatch to github.com/acme/control could not be sent" >&2; exit 1; }
          case "$code" in 2??) echo "chant: told github.com/acme/control that $member ran its waves ($outcome) (HTTP $code)" ;; *) echo "chant: github.com/acme/control refused the dispatch (HTTP $code): $(head -c 400 "$answer")" >&2; exit 1 ;; esac
