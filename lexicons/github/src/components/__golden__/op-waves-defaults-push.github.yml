name: tf-apply

on:
  push:
    branches:
      - main
      - release
  workflow_dispatch: {}

env:
  SLACK_WEBHOOK: '${{ secrets.SLACK_WEBHOOK }}'
  TEAMS_WEBHOOK: '${{ secrets.TEAMS_WEBHOOK }}'
  RELAY_KEY: '${{ secrets.RELAY_KEY }}'

permissions:
  contents: write

