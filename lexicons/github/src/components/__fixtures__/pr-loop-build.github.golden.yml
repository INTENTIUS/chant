name: chant-pr-prod

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - chant-ci-green
    types:
      - completed
  workflow_dispatch: {}

env:
  CHANT_ENV: prod

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container: node:22
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: command -v tofu >/dev/null 2>&1 || (curl -fsSL https://get.opentofu.org/install-opentofu.sh -o /tmp/install-opentofu.sh && sh /tmp/install-opentofu.sh --install-method standalone)
      - name: Build the templates
        run: chant build --env prod
      - name: Lint the project
        run: chant lint
      - name: Plan the members this pull request reaches
        env:
          BASE_SHA: '${{ github.event.pull_request.base.sha }}'
          PR_NUMBER: '${{ github.event.pull_request.number }}'
          GITHUB_TOKEN: '${{ github.token }}'
          CHANT_RUNNER_KEY: '${{ secrets.CHANT_RUNNER_KEY }}'
        run: chant ci run plan --in-place --no-push --base "$BASE_SHA" --pr "$PR_NUMBER" --env prod --gate pr-apply --forge github
      - name: Keep the plan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chant-pr-plan
          path: .chant/pr
          if-no-files-found: ignore
          include-hidden-files: true
  record:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    container: node:22
    concurrency:
      group: chant-record-prod
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: command -v tofu >/dev/null 2>&1 || (curl -fsSL https://get.opentofu.org/install-opentofu.sh -o /tmp/install-opentofu.sh && sh /tmp/install-opentofu.sh --install-method standalone)
      - name: Build the templates
        run: chant build --env prod
      - name: Lint the project
        run: chant lint
      - name: Record the plan on the merged commit; nothing applies
        env:
          BASE_SHA: '${{ github.event.before }}'
          GITHUB_TOKEN: '${{ github.token }}'
          CHANT_RUNNER_KEY: '${{ secrets.CHANT_RUNNER_KEY }}'
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then git fetch origin "main" && BASE_SHA="$(git merge-base FETCH_HEAD "$GITHUB_SHA")"; if [ "$BASE_SHA" = "$GITHUB_SHA" ]; then BASE_SHA="$(git rev-parse --verify --quiet "$GITHUB_SHA^" || echo 4b825dc642cb6eb9a060e54bf8d69288fbee4904)"; fi; fi; export BASE_SHA
          chant ci run record --in-place --base "$BASE_SHA" --env prod --gate pr-apply --forge github
      - name: Keep the record report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chant-pr-record
          path: .chant/pr
          if-no-files-found: ignore
          include-hidden-files: true
  apply:
    if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: node:22
    concurrency:
      group: chant-apply-prod
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: command -v tofu >/dev/null 2>&1 || (curl -fsSL https://get.opentofu.org/install-opentofu.sh -o /tmp/install-opentofu.sh && sh /tmp/install-opentofu.sh --install-method standalone)
      - name: Build the templates
        run: chant build --env prod
      - name: Lint the project
        run: chant lint
      - name: Restore the record of an earlier attempt at this commit
        uses: actions/cache/restore@v4
        with:
          path: .chant/pr-resume/pr-apply.json
          key: chant-apply-prod-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: chant-apply-prod-${{ github.sha }}-
      - name: Apply the newest green commit under the merged changes' approvals
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          CHANT_RUNNER_KEY: '${{ secrets.CHANT_RUNNER_KEY }}'
        run: |
          git fetch --quiet --tags origin "+refs/heads/main:refs/remotes/origin/main" && GREEN_SHA="$(chant ci last-green)" && git checkout --quiet --detach "$GREEN_SHA"
          chant ci run apply --in-place --env prod --gate pr-apply --forge github
      - name: Keep the record for a re-run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .chant/pr-resume/pr-apply.json
          key: chant-apply-prod-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep the apply report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chant-pr-apply
          path: .chant/pr
          if-no-files-found: ignore
          include-hidden-files: true
