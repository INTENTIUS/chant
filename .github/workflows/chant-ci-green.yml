# Generated by chant — do not edit directly. Regenerate with: chant ci workflow --chant 'npx tsx packages/core/src/cli/main.ts' --install 'npm install --ignore-scripts' (in the workspace root)
name: chant-ci-green

# Tags each commit on the branch that passed its required phases ci/green/<sha>,
# and a green commit that later fails one ci/revoked/<sha>.
on:
  workflow_run:
    workflows:
      - "chant"
      - "release-suites"
    types:
      - completed
    branches:
      - "main"
      - "ci/build/**"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# One tick at a time, and a tick in progress is never cancelled.
concurrency:
  group: chant-ci-green
  cancel-in-progress: false

permissions:
  contents: write
  checks: read
  actions: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: "main"
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
      - name: Install what the tick runs
        run: "npm install --ignore-scripts"
      - name: Tag the commits that turned green, revoke the ones that turned red
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: "npx tsx packages/core/src/cli/main.ts ci tick"
