name: docs-check

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'lexicons/*/docs/**'
      - 'lexicons/*/src/codegen/**'
      - 'packages/core/src/codegen/**'
      - 'scripts/build-docs.sh'
      - 'scripts/check-docs-diataxis.mjs'
      - 'scripts/check-docs-citations.ts'
      - 'packages/core/src/fold/subset.ts'
      - 'scripts/build-diagrams.sh'
      - 'justfile'
      - '.github/workflows/docs-check.yml'

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Cache lexicon schemas
        uses: actions/cache@v5
        with:
          path: ~/.chant
          key: lexicon-schemas-${{ hashFiles('lexicons/*/src/**/fetch.ts', 'lexicons/*/src/**/versions.ts') }}
          restore-keys: |
            lexicon-schemas-

      # Also the main site's sidebar-reachability gate (#1417): a page with
      # no sidebar entry fails here.
      - name: Check Diátaxis classification and sidebar reachability
        run: node scripts/check-docs-diataxis.mjs

      # Prose lint on the `sentences` trope ruleset — a ratchet against the
      # committed baseline, same posture as the repo-wide typecheck: new
      # AI-trope prose fails, existing debt is baselined and burns down.
      - name: Lint docs prose (sentences ratchet)
        run: node scripts/lint-docs-sentences.mjs

      # chant#2425 — the docs' rule citations, against the specification that
      # owns them. `@intentius/tsad-conformance` is built and gated in the
      # specification's repository and is not on npm yet
      # (INTENTIUS/typescript-as-data#23), so the check is loaded from a
      # pinned checkout of that public repository rather than reimplemented
      # here. Pinned to a commit rather than a tag because the package has no
      # release tag yet; `spec/VERSION` inside it is compared against chant's
      # own SPEC_VERSION by the script, so a bump on either side fails loudly.
      #
      # When the package publishes this becomes a devDependency and a plain
      # vitest file; delete these two steps and the fallback in the script.
      - name: Check out the specification (for its citation check)
        uses: actions/checkout@v6
        with:
          repository: INTENTIUS/typescript-as-data
          ref: 3b1c14672d1918054b6fdc63dcfc39c7f7f368ce
          path: .tsad

      - name: Check docs rule citations against the specification
        run: npx tsx scripts/check-docs-citations.ts

      - name: Build unified docs
        run: chmod +x scripts/build-docs.sh && ./scripts/build-docs.sh

      - name: Run lychee link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress
            --root-dir ${{ github.workspace }}/.docs-dist
            --exclude '\.(css|js|mjs|svg|png|jpe?g|ico|woff2?|map|json|xml|webp|avif|gif)$'
            --exclude 'pagefind/'
            '.docs-dist/chant/**/*.html'
          fail: true
