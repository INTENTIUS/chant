name: docs-check

# By hand only (workflow_dispatch) since CI went unit-only on 2026-10-23.
# A dispatch is not a pull request, so the first step runs the full check.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      # The pull_request checkout is the merge commit, so HEAD^1 is the base
      # it is tested against and the diff is exactly what the PR changes.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # Everything the steps below read: the main docs site, every lexicon's
      # authored pages and the codegen that writes them into it (rule pages from
      # src/lint, file markers and ?raw imports from examples/ and aws
      # testdata, package versions), the docs scripts and the prose baseline,
      # the specification pin (root package files) and SPEC_VERSION, plus any
      # Markdown anywhere. Any event other than a PR runs in full.
      - name: Detect docs changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull request, running the full check."
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only HEAD^1 HEAD)"
          relevant="$(printf '%s\n' "$changed" | grep -E \
            -e '^docs/' \
            -e '\.mdx?$' \
            -e '^lexicons/[^/]+/docs/' \
            -e '^lexicons/[^/]+/src/codegen/' \
            -e '^lexicons/[^/]+/src/lint/' \
            -e '^lexicons/[^/]+/examples/' \
            -e '^lexicons/[^/]+/src/testdata/' \
            -e '^lexicons/[^/]+/package\.json$' \
            -e '^packages/core/src/codegen/' \
            -e '^packages/core/src/fold/subset\.ts$' \
            -e '^scripts/(build-docs\.sh|build-diagrams\.sh|check-docs-diataxis\.mjs|check-docs-citations\.ts|lint-docs-sentences\.mjs|lint-prompts\.mjs|docs-sentences-baseline\.json)$' \
            -e '^justfile$' \
            -e '^package(-lock)?\.json$' \
            -e '^\.github/workflows/docs-check\.yml$' \
            || true)"
          if [ -n "$relevant" ]; then
            echo "Docs inputs changed:"
            printf '%s\n' "$relevant"
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "No docs inputs changed, skipping the docs build and link check."
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v6
        if: steps.changes.outputs.docs == 'true'
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install
        if: steps.changes.outputs.docs == 'true'

      - name: Install Graphviz
        if: steps.changes.outputs.docs == 'true'
        run: sudo apt-get install -y graphviz

      - name: Cache lexicon schemas
        if: steps.changes.outputs.docs == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.chant
          key: lexicon-schemas-${{ hashFiles('lexicons/*/src/**/fetch.ts', 'lexicons/*/src/**/versions.ts') }}
          restore-keys: |
            lexicon-schemas-

      # Prose lint on the `sentences` trope ruleset — a ratchet against the
      # committed baseline, same posture as the repo-wide typecheck: new
      # AI-trope prose fails, existing debt is baselined and burns down.
      - name: Lint docs prose (sentences ratchet)
        if: steps.changes.outputs.docs == 'true'
        run: node scripts/lint-docs-sentences.mjs

      # chant#2425 — the docs' rule citations, against the specification that
      # owns them. `@intentius/tsad-conformance` is a devDependency since it
      # published at 1.8.0, so this is the package's own check rather than a
      # second implementation of it, and `npm install` above is all it needs.
      # chant#2470 removed the pinned-checkout dance this used before.
      - name: Check docs rule citations against the specification
        if: steps.changes.outputs.docs == 'true'
        run: npx tsx scripts/check-docs-citations.ts

      - name: Build unified docs
        if: steps.changes.outputs.docs == 'true'
        run: chmod +x scripts/build-docs.sh && ./scripts/build-docs.sh

      # Also the main site's sidebar-reachability gate (#1417): a page with
      # no sidebar entry fails here. It runs after the build because every
      # lexicon's section is generated by it (chant #3993), and
      # --require-lexicons fails the step if none was.
      - name: Check Diátaxis classification and sidebar reachability
        if: steps.changes.outputs.docs == 'true'
        run: node scripts/check-docs-diataxis.mjs --require-lexicons

      # chant #3996: the agent prompts. Every tutorial and how-to page, core
      # and lexicon, and every room carries one that names its page and ends
      # with the never-line in docs/src/prompts.mjs; README.md, the agents page
      # and the home page carry the setup prompt. It reads lexicon pages from
      # their sources, and after the build it also checks each lexicon
      # overview's prompt.
      - name: Check agent prompts
        if: steps.changes.outputs.docs == 'true'
        run: node scripts/lint-prompts.mjs

      - name: Run lychee link check
        if: steps.changes.outputs.docs == 'true'
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress
            --root-dir ${{ github.workspace }}/.docs-dist
            --exclude '\.(css|js|mjs|svg|png|jpe?g|ico|woff2?|map|json|xml|webp|avif|gif)$'
            --exclude 'pagefind/'
            '.docs-dist/chant/**/*.html'
          fail: true
