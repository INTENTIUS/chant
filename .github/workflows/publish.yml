name: publish

on:
  push:
    tags: ['chant-v*']
    # GATED publish-on-merge (#528): uncomment to publish, on merge to main,
    # any package whose version changed. Only version-bumped packages publish
    # (per-package skip-if-unchanged in the publish job); the `test` gate is
    # skipped on this branch path since the merged code already passed PR CI and
    # each `npm publish` re-runs the package's prepack (build + validate). This
    # reuses publish.yml (already the npm trusted-publisher), so NO npm/OIDC
    # change is needed. Un-gate by uncommenting the line below.
    # branches: [main]
  workflow_dispatch:

jobs:
  test:
    # Full validation gate for tag releases and manual dispatch. Skipped on the
    # publish-on-merge (branch) path: that code already passed PR CI, and each
    # `npm publish` re-runs the package's prepack (build + validate) anyway.
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # 10 lexicon prepacks (build + validate) plus the full vitest suite — the
    # suite alone runs ~5m, so a 5m cap gets killed mid-run and skips publish.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install

      - name: Cache lexicon schemas
        uses: actions/cache@v5
        with:
          path: ~/.chant
          key: lexicon-schemas-${{ hashFiles('lexicons/*/src/**/fetch.ts', 'lexicons/*/src/**/versions.ts') }}
          restore-keys: |
            lexicon-schemas-

      - run: npm run --prefix lexicons/aws prepack
      - run: npm run --prefix lexicons/azure prepack
      - run: npm run --prefix lexicons/gitlab prepack
      - run: npm run --prefix lexicons/github prepack
      - run: npm run --prefix lexicons/forgejo prepack
      - run: npm run --prefix lexicons/k8s prepack
      - run: npm run --prefix lexicons/gcp prepack
      - run: npm run --prefix lexicons/helm prepack
      - run: npm run --prefix lexicons/docker prepack
      - run: npm run --prefix lexicons/temporal prepack
      - run: npm run --prefix lexicons/fly prepack
      - run: npx vitest run

  publish:
    needs: [test]
    # Run when the test gate passed (tag / dispatch) or was skipped (merge path).
    # Never runs if test actually failed.
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          # Deliberately NOT setting registry-url: that flag makes
          # actions/setup-node write an .npmrc with `_authToken=${NODE_AUTH_TOKEN}`,
          # and NODE_AUTH_TOKEN defaults to the literal placeholder
          # `XXXXX-XXXXX-XXXXX-XXXXX` when not provided. That placeholder
          # is sent as auth to the registry on `npm publish`, which then
          # 404s instead of falling through to OIDC. Without registry-url
          # there's no .npmrc; npm publish detects the absent auth + the
          # OIDC id-token environment and exchanges for a short-lived
          # publish token via the trusted-publisher record.
      - run: npm install

      # Each package publishes independently: `if: !cancelled()` so one package's
      # publish failure (e.g. a missing trusted-publisher record) does not SKIP
      # every package after it — before this, a single failure left the release
      # half-published (core bumped, lexicons stranded a version behind). The
      # per-step `[ "$V" = "$P" ] && skip` guard makes a re-run idempotent, so a
      # partial release is recovered by re-running or dispatching this workflow.
      - name: Publish @intentius/chant
        if: ${{ !cancelled() }}
        working-directory: packages/core
        run: |
          V=$(node -e "process.stdout.write(require('./package.json').version)")
          P=$(npm view @intentius/chant version 2>/dev/null || echo "none")
          [ "$V" = "$P" ] && echo "Already at $V, skipping" || npm publish --access public --provenance

      # The k8s lexicon declares this as an optional dependency (#1074). npm
      # tolerates an optional dependency that fails to resolve, so publishing it
      # ahead of the lexicon is what keeps `chant lifecycle diff --live` working
      # for a registry install rather than silently degrading to holes.
      - name: Publish @intentius/chant-k8s-client
        if: ${{ !cancelled() }}
        working-directory: packages/k8s-client
        run: |
          V=$(node -e "process.stdout.write(require('./package.json').version)")
          P=$(npm view @intentius/chant-k8s-client version 2>/dev/null || echo "none")
          [ "$V" = "$P" ] && echo "Already at $V, skipping" || npm publish --access public --provenance

      - name: Publish @intentius/chant-lexicon-gitlab
        if: ${{ !cancelled() }}
        working-directory: lexicons/gitlab
        run: |
          V=$(node -e "process.stdout.write(require('./package.json').version)")
          P=$(npm view @intentius/chant-lexicon-gitlab version 2>/dev/null || echo "none")
          [ "$V" = "$P" ] && echo "Already at $V, skipping" || npm publish --access public --provenance

      - name: Publish @intentius/chant-lexicon-aws
