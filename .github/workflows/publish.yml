name: publish

on:
  push:
    # chant-v*        — whole-repo release (`just release`), every package bumped.
    # lexicon-<n>-v*  — single-lexicon patch (`just release-lexicon <n>`). That
    #   recipe has always tagged this pattern and echoed "publish workflow
    #   triggered", but only chant-v* was matched here, so the tag pushed and
    #   nothing published. Either tag reaches the same publish job; the
    #   per-package skip-if-unchanged guard below means a single-lexicon tag
    #   publishes only the package whose version actually moved.
    tags: ['chant-v*', 'lexicon-*-v*']
    # GATED publish-on-merge (#528): uncomment to publish, on merge to main,
    # any package whose version changed. Only version-bumped packages publish
    # (per-package skip-if-unchanged in the publish job); the `test` gate is
    # skipped on this branch path since the merged code already passed PR CI and
    # each `npm publish` re-runs the package's prepack (build + validate). This
    # reuses publish.yml (already the npm trusted-publisher), so NO npm/OIDC
    # change is needed. Un-gate by uncommenting the line below.
    # branches: [main]
  workflow_dispatch:

jobs:
  # Which packages can actually publish over OIDC, answered in seconds. No
  # `needs:`, so it runs beside the test gate — dispatch this workflow and
  # the coverage table is in the run summary before the gate finishes.
  #
  # It lives here rather than in its own workflow because npm matches a
  # trusted-publisher record against the workflow FILENAME: probing from
  # anywhere else reports every package as missing and proves nothing.
  #
  # #3191: a gate. `publish` needs it, so a package with no working record
  # stops the release before anything ships. chant-v0.81.0 (#2646) published
  # 19 packages before the two with no record failed. When GitHub issues no
  # id-token (a fork, a job without the permission) the script can check
  # nothing; it warns and passes.
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/audit-trusted-publishers.sh

  # The CI gate (#2817). This job ran the whole suite again, about 15
  # minutes, on a commit whose `chant` run had already passed: `just release`
  # only tags a bump commit on top of a green commit (#2816). It now checks
  # that run through the API instead. For a bump commit, which only moves
  # version fields and has no run of its own, the run checked is its parent's
  # (scripts/publish-verify-ci.sh). Each `npm publish` below still re-runs the
  # package's prepack under CHANT_RELEASE_GATE, so the build and the release
  # gate run on what ships. The job keeps the id `test` so `publish` and
  # `untag` read its result as before.
  #
  # #3573: its check run is named release-gate. The tag sits on a bump commit
  # on main, where chant.yml's required `test` also runs, and ci.green judges
  # a phase by check-run name, keeping the newest run of each name. Two runs
  # named `test` would let this gate's verdict stand in for the suite's.
  #
  # #3027: the run it checks may still be queued or running when the tag
  # lands, so the script waits for it (up to 45 minutes, or 5 for a run to
  # appear at all) instead of failing at once. It reports how it ended in the
  # `gate` output; on `timeout` the tag is kept (see `untag`). The job timeout
  # sits above the script's own so a slow CI ends as `timeout`, not as a
  # cancelled job.
  test:
    name: release-gate
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      gate: ${{ steps.verify.outputs.outcome }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          # The bump commit and its parent, the commit `chant` ran on.
          fetch-depth: 2
      - name: Require a green chant run on the released commit
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-verify-ci.sh

  publish:
    needs: [test, audit]
    # Run when the CI gate passed (tag / dispatch) or was skipped (merge path),
    # and every package has a trusted-publisher record (#3191). Never runs if
    # either actually failed.
    if: ${{ always() && needs.audit.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      # What this run put on npm, name@version, space-separated. `untag`
      # reads it alongside the registry.
      published: ${{ steps.publish.outputs.published }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          # Deliberately NOT setting registry-url: that flag makes
          # actions/setup-node write an .npmrc with `_authToken=${NODE_AUTH_TOKEN}`,
          # and NODE_AUTH_TOKEN defaults to the literal placeholder
          # `XXXXX-XXXXX-XXXXX-XXXXX` when not provided. That placeholder
          # is sent as auth to the registry on `npm publish`, which then
          # 404s instead of falling through to OIDC. Without registry-url
          # there's no .npmrc; npm publish detects the absent auth + the
          # OIDC id-token environment and exchanges for a short-lived
          # publish token via the trusted-publisher record.
      - run: npm install

      # One script publishes every non-private workspace package, in
      # dependency-safe order, continuing past a failure so one bad package
      # cannot strand the rest of the release (it exits non-zero at the end
      # if any failed). It enumerates the workspace rather than naming
      # packages here: #1177 (k8s-client) and #1253 (fountain) each added a
      # package whose publish step was wrong, and every release since
      # chant-v0.33.0 went red. The skip-if-unchanged check makes re-running
      # idempotent, so a partial release is recovered by re-running or
      # dispatching this workflow.
      - name: Publish workspace packages
        id: publish
        env:
          # Fallback only. Packages with an npm trusted-publisher record
          # publish over OIDC and never touch this. Since #3191 `audit` stops
          # the release when a package has no record, so this is used only
          # when the exchange worked there and then failed here. See
          # scripts/publish-packages.sh.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # chant #1473 — arm the release-time surface gate. `prepack`
          # regenerates from upstream, so the artifact about to be published is
          # built from a fetch nobody reviewed; this makes a lexicon that opted
          # in refuse to ship an API that differs from its committed
          # surface.snapshot.json. Set here and nowhere else: on an ordinary PR
          # upstream drift is expected and reported by the scheduled
          # lexicon-upgrade job, not a reason to fail the build.
          CHANT_RELEASE_GATE: "1"
        run: bash scripts/publish-packages.sh

  # #1481 — a failed release must not leave its tag behind. `just release`
  # pushes the bump commit and the tag before this workflow runs, so when the
  # gate, the audit or the publish fails, main is left claiming a version the
  # registry never got (chant-v0.40.1 was exactly that: tagged, bumped,
  # nothing on npm). Deleting the tag makes the tag list the truth again.
  #
  # The bump commit stays — rewriting main from a workflow is worse than a
  # stale version field, and `just release` floors the next bump on it anyway.
  #
  # #3191: once any package of the release is on npm, the tag stays.
  # Deleting it then leaves npm ahead of git with no tag, which is what
  # chant-v0.81.0 (#2646) did. scripts/release-untag.sh asks the registry about
  # each package the tagged commit bumped (and takes the publish job's own
  # list), keeps the tag and fails with the list of what did and did not
  # publish, or deletes the tag when nothing did. Recover a partial release
  # by fixing the cause and `gh run rerun <id> --failed`: the publish skips
  # what is already on npm. An audit failure publishes nothing, so its tag
  # goes; add the record and push the tag again at the same commit.
  #
  # One exception (#3027): when the gate failed only because the `chant` run
  # was still going after 45 minutes (needs.test.outputs.gate == 'timeout'),
  # the release is not known to be bad, so the tag stays and nothing was
  # published. Once that run is green, `gh run rerun <id> --failed` re-runs
  # the gate and publishes. A cancelled gate (no output) still untags.
  untag:
    needs: [test, audit, publish]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.test.outputs.gate != 'timeout' && (contains(fromJSON('["failure","cancelled"]'), needs.test.result) || contains(fromJSON('["failure","cancelled"]'), needs.audit.result) || contains(fromJSON('["failure","cancelled"]'), needs.publish.result)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          # The tagged bump commit and its parent: the packages it moved are
          # the release's.
          fetch-depth: 2
      - name: Delete the tag of the failed release, unless part of it is on npm
        env:
          PUBLISHED_IN_RUN: ${{ needs.publish.outputs.published }}
        run: |
          echo "::error::release ${GITHUB_REF_NAME} failed (test: ${{ needs.test.result }}, audit: ${{ needs.audit.result }}, publish: ${{ needs.publish.result }})"
          bash scripts/release-untag.sh
