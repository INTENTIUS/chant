name: publish-on-merge

# Per-package publish triggered by a push to main. Only packages whose
# local package.json version differs from the published npm version are
# published — the skip-if-unchanged guard is the same pattern used in
# publish.yml (the monorepo release workflow, triggered by chant-v* tags).
#
# SAFETY GATE: the `push:` trigger below is intentionally commented out.
# Merging a PR that only adds this file is a no-op for npm — nothing
# publishes until a human removes the comment block. Review the workflow,
# confirm the trusted-publisher OIDC record covers this workflow file
# name, then un-gate by removing the comment lines below. (#528, #536)
#
# on:
#   push:
#     branches: [main]

on:
  workflow_dispatch:

# One publish run at a time on main — never cancel an in-flight publish.
concurrency:
  group: publish-on-merge
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write   # required for npm trusted-publisher OIDC exchange
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          # Deliberately NOT setting registry-url — same rationale as publish.yml:
          # with no registry-url there is no .npmrc with a placeholder token, so
          # npm publish falls through to the OIDC trusted-publisher exchange.

      - name: Install dependencies
        run: npm install

      - name: Cache lexicon schemas
        uses: actions/cache@v5
        with:
          path: ~/.chant
          key: lexicon-schemas-${{ hashFiles('lexicons/*/src/**/fetch.ts', 'lexicons/*/src/**/versions.ts') }}
          restore-keys: |
            lexicon-schemas-

      # Each step: cheap version comparison first; only run prepack (and publish)
      # when the local version differs from the one on npm. Independent per-lexicon
      # versions mean any subset of these steps may publish in a given run.

      - name: Publish @intentius/chant
        working-directory: packages/core
        run: |
          V=$(node -e "process.stdout.write(require('./package.json').version)")
          P=$(npm view @intentius/chant version 2>/dev/null || echo "none")
          if [ "$V" = "$P" ]; then
            echo "Already at $V, skipping"
          else
            echo "Publishing @intentius/chant $V (was $P)"
            npm publish --access public --provenance
          fi

      - name: Publish @intentius/chant-lexicon-gitlab
        working-directory: lexicons/gitlab
        run: |
          V=$(node -e "process.stdout.write(require('./package.json').version)")
          P=$(npm view @intentius/chant-lexicon-gitlab version 2>/dev/null || echo "none")
          if [ "$V" = "$P" ]; then
            echo "Already at $V, skipping"
          else
            echo "Publishing @intentius/chant-lexicon-gitlab $V (was $P)"
            npm run prepack
            npm publish --access public --provenance
          fi

