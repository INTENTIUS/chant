name: lexicon-upgrade

# Weekly scheduled dogfood of chant: for each in-scope lexicon, detect a newer
# upstream spec, regen + validate, and open/update a reviewable PR with the API
# surface delta. PR-only — a human merges and the change rides the next release.
# This is the first scheduled workflow in the repo (epic #523 / #527).
run-name: lexicon-upgrade — ${{ github.event_name }}

on:
  # Mondays at 06:00 UTC. Weekly cadence keeps PR noise low (epic #523).
  # First-run prep is complete: baselines seeded (#533), fetch retry (#535),
  # and bot PRs open with a GitHub App token so CI runs (#534). Validated by a
  # pull-request-mode dispatch that opened real upgrade PRs (k8s/gcp bumps, aws
  # drift) with CI, while azure/docker/gitlab/github stayed quiet (#536).
  schedule:
    - cron: '0 6 * * 1'
  # Manual runs stay available (report mode for dry runs).
  workflow_dispatch:
    inputs:
      mode:
        description: 'Finding mode (report | issue | pull-request)'
        required: false
        default: pull-request

# One upgrade run per lexicon at a time; never cancel an in-flight PR update.
concurrency:
  group: lexicon-upgrade-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write        # push the long-lived lexicon-upgrade/<lexicon> branch
  pull-requests: write   # open / update the review PR
  issues: write          # surface a validation-failure report as an issue

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Independent per-lexicon jobs — one failing lexicon must not block others.
      fail-fast: false
      matrix:
        # The in-scope lexicons (epic #523). helm / temporal / forgejo are
        # excluded — they have no upstream spec to upgrade from. fly rolls off
        # the live Fly Machines OpenAPI (docs.machines.dev), like aws/azure/github.
        lexicon: [k8s, gcp, docker, gitlab, aws, azure, github, fly]
    steps:
      # Mint a short-lived GitHub App token so bot PRs trigger CI — a PR opened
      # with the default GITHUB_TOKEN gets no workflow runs (#534). Skipped in
      # report mode (no PR is opened). Requires the org-App secrets below; set
      # them before enabling pull-request mode / un-gating the schedule (#536).
      - name: Generate app token
        id: app-token
        if: ${{ github.event.inputs.mode != 'report' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.LEXICON_UPGRADE_APP_ID }}
          private-key: ${{ secrets.LEXICON_UPGRADE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          # Full history so the long-lived upgrade branch can be reset from main.
          fetch-depth: 0
          # Push the upgrade branch as the App so the PR triggers CI; falls back
          # to the default token in report mode (which never pushes).
          token: ${{ steps.app-token.outputs.token || github.token }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Cache lexicon schemas
        uses: actions/cache@v5
        with:
          path: ~/.chant
          key: lexicon-schemas-${{ hashFiles('lexicons/*/src/**/fetch.ts', 'lexicons/*/src/**/versions.ts') }}
          restore-keys: |
            lexicon-schemas-

      - name: Configure git identity for automated PRs
        run: |
          git config user.name "chant-bot"
          git config user.email "chant-bot@users.noreply.github.com"

      - name: Run lexicon upgrade Op (${{ matrix.lexicon }})
        env:
          # pull-request opens/updates the long-lived branch; overridable on manual runs.
          CHANT_UPGRADE_MODE: ${{ github.event.inputs.mode || 'pull-request' }}
          # The Op's PR automation shells out to `gh` and `git push`. Use the
          # App token so the opened PR triggers CI (#534); falls back to the
          # default token in report mode (no PR opened).
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          # Higher upstream-API rate limit for the spec-version resolvers.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          npx tsx packages/core/src/cli/main.ts run ${{ matrix.lexicon }}-upgrade --local --json > upgrade-${{ matrix.lexicon }}.json
          cat upgrade-${{ matrix.lexicon }}.json

      # Non-gating baseline-integrity check (#545): for pinned lexicons, verify
      # the committed surface.snapshot.json still matches a fresh regen at the
      # pinned version. Surfaces a stale/hand-edited baseline as a step warning
      # without failing the run. Rolling lexicons drift by design, so excluded.
      - name: Verify committed baseline (pinned lexicons)
        if: ${{ contains(fromJSON('["k8s","gcp","docker","gitlab"]'), matrix.lexicon) }}
        continue-on-error: true
        run: npx tsx packages/core/src/cli/main.ts dev surface-diff lexicons/${{ matrix.lexicon }} --check

      - name: Upload upgrade result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexicon-upgrade-${{ matrix.lexicon }}
          path: upgrade-${{ matrix.lexicon }}.json
          if-no-files-found: ignore
