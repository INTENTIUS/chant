name: chant

# Distinct title so it isn't confused with other workflows on the same commit.
run-name: chant — ${{ github.head_ref || github.ref_name }}

# Run once per commit: on PRs (pull_request) and on pushes to main
# (post-merge validation). Without scoping `push` to main, a commit on a
# branch that has an open PR triggers two identical runs.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so a new push stops the previous run.
concurrency:
  group: chant-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  check:
    runs-on: ubuntu-latest
    # 10 was the historical value and this job had crept to ~9m30s against it,
    # so any upstream slowness cancelled the build rather than failing it —
    # which reads as "your change broke CI" when it did not. Attempts are now
    # individually bounded (packages/core/src/codegen/fetch.ts), so this is
    # headroom rather than a licence to grow.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Cache lexicon schemas
        uses: actions/cache@v5
        with:
          path: ~/.chant
          key: lexicon-schemas-${{ hashFiles('lexicons/*/src/**/fetch.ts', 'lexicons/*/src/**/versions.ts') }}
          restore-keys: |
            lexicon-schemas-

      - name: Generate lexicon artifacts
        run: |
          npm run --prefix lexicons/aws prepack
          npm run --prefix lexicons/azure prepack
          npm run --prefix lexicons/gitlab prepack
          npm run --prefix lexicons/github prepack
          npm run --prefix lexicons/forgejo prepack
          npm run --prefix lexicons/k8s prepack
          npm run --prefix lexicons/gcp prepack
          npm run --prefix lexicons/helm prepack
          npm run --prefix lexicons/docker prepack
          npm run --prefix lexicons/temporal prepack
          npm run --prefix lexicons/fly prepack
          npm run --prefix lexicons/fountain prepack
          npm run --prefix lexicons/k3d prepack
          npm run --prefix lexicons/k3s prepack
          # cedar generates from the project's own .cedarschema, falling
          # back to the schema bundled at src/spec/default-schema.cedarschema
          # so a clean checkout still produces a surface to gate (#1650).
          npm run --prefix lexicons/cedar prepack

      - name: Typecheck
        run: npx tsc --noEmit -p packages/core/tsconfig.json

      # The whole repo, not just core (#1366). The root tsconfig includes
      # `lexicons/**/*` — every lexicon, example and helper script — so all of
      # it was inside the project TypeScript was configured for and outside the
      # one CI checked. It had accumulated 91 errors unnoticed, including
      # composites that erased their own result type and wiring props that
      # rejected the intrinsics the docs tell you to pass. Enforced here so the
      # number cannot grow back.
      - name: Typecheck the whole repo (#1366)
        run: npx tsc --noEmit

      # The k8s API client (#1074) is its own package, so `just build`'s
      # core-only typecheck does not cover it. It is not a lexicon either, so
      # check-lexicons below does not reach it.
      - name: Typecheck the Kubernetes API client (#1074)
        run: npx tsc --noEmit -p packages/k8s-client/tsconfig.build.json

      - name: Lexicon completeness contract (#1067)
        run: npx tsx scripts/check-lexicons.ts

      # #1388 — the two typechecks above cover packages/core and k8s-client, and
      # check-lexicons builds each lexicon's tsconfig.build.json, which excludes
      # tests. Nothing typechecked a lexicon test, script or example. This does,
      # against a baseline that can only shrink.
      - name: Repo-wide typecheck (tests, scripts, examples)
        run: npx tsx scripts/typecheck.ts

      - name: Lint aws reference composites (EVL regression guard, #916/#952)
        # The lexicon's own composites must obey the evaluability rules they teach.
        run: npx tsx packages/core/src/cli/main.ts lint lexicons/aws/src/composites

      - name: Audit runtime dependencies
        run: node scripts/depcheck.mjs

      - name: Lint example project
        run: npx tsx packages/core/src/cli/main.ts lint lexicons/aws/examples/lambda-function/src --format sarif > results.sarif

      - name: Build example project
        run: npx tsx packages/core/src/cli/main.ts build lexicons/aws/examples/lambda-function/src --output template.json

      - name: Run Op in local mode (regression guard)
        working-directory: examples/local-op-quickstart
        run: |
          npx tsx ../../packages/core/src/cli/main.ts run hello --local --json > result.json
          node -e "process.exit(JSON.parse(require('fs').readFileSync('result.json','utf8')).ok ? 0 : 1)"

      - name: Run supply-chain example component (regression guard, #630)
        working-directory: examples/supply-chain
        run: |
          npx tsx ../../packages/core/src/cli/main.ts run --components supply-chain-demo --env local --json > result.json
          node -e "process.exit(JSON.parse(require('fs').readFileSync('result.json','utf8')).results[0].ok ? 0 : 1)"
          test -s sbom.spdx.json
          test -s config-bom.spdx.json
          rm -f result.json sbom.spdx.json config-bom.spdx.json

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Cache lexicon schemas
        uses: actions/cache@v5
        with:
          path: ~/.chant
          key: lexicon-schemas-${{ hashFiles('lexicons/*/src/**/fetch.ts', 'lexicons/*/src/**/versions.ts') }}
          restore-keys: |
            lexicon-schemas-

      - name: Generate lexicon artifacts
        run: |
          npm run --prefix lexicons/aws prepack
          npm run --prefix lexicons/azure prepack
          npm run --prefix lexicons/gitlab prepack
          npm run --prefix lexicons/github prepack
          npm run --prefix lexicons/forgejo prepack
          npm run --prefix lexicons/k8s prepack
          npm run --prefix lexicons/gcp prepack
          npm run --prefix lexicons/helm prepack
          npm run --prefix lexicons/docker prepack
          npm run --prefix lexicons/temporal prepack
          npm run --prefix lexicons/fly prepack
          npm run --prefix lexicons/fountain prepack
          npm run --prefix lexicons/k3d prepack
          npm run --prefix lexicons/k3s prepack
          # cedar generates from the project's own .cedarschema, falling
          # back to the schema bundled at src/spec/default-schema.cedarschema
          # so a clean checkout still produces a surface to gate (#1650).
          npm run --prefix lexicons/cedar prepack

      # The helm lexicon targets Helm 4 (epic #1228); the runner image ships
      # Helm 3. Pin the version the render tests run against.
      - name: Install Helm 4 (pinned)
        run: |
          curl -fsSL -o /tmp/helm.tgz https://get.helm.sh/helm-v4.1.1-linux-amd64.tar.gz
          echo "5d4c7623283e6dfb1971957f4b755468ab64917066a8567dd50464af298f4031  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short

      # Includes examples/fold-differential.test.ts (#1025, epic #1019) — the
      # fold-vs-run zero-drift gate over examples/* + every lexicon's own
      # examples/* fixtures. It's a normal vitest file (see
      # vitest.config.ts's `include`), gated here like everything else in
      # this step; `just fold-differential` runs it alone with its
      # per-source report.
      - name: Run tests
        run: npx vitest run

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Cache lexicon schemas
        uses: actions/cache@v5
        with:
          path: ~/.chant
          key: lexicon-schemas-${{ hashFiles('lexicons/*/src/**/fetch.ts', 'lexicons/*/src/**/versions.ts') }}
          restore-keys: |
            lexicon-schemas-

      - name: Generate and validate AWS lexicon
        run: npm run --prefix lexicons/aws prepack

      - name: Generate and validate GitLab lexicon
        run: npm run --prefix lexicons/gitlab prepack

      - name: Generate and validate GitHub lexicon
        run: npm run --prefix lexicons/github prepack

      - name: Generate and validate Forgejo lexicon
        run: npm run --prefix lexicons/forgejo prepack

      - name: Generate and validate K8s lexicon
        run: npm run --prefix lexicons/k8s prepack

      - name: Generate and validate GCP lexicon
        run: npm run --prefix lexicons/gcp prepack

      - name: Generate and validate Azure lexicon
        run: npm run --prefix lexicons/azure prepack

      - name: Generate and validate Helm lexicon
        run: npm run --prefix lexicons/helm prepack

      - name: Generate and validate Docker lexicon
        run: npm run --prefix lexicons/docker prepack

      - name: Generate and validate Temporal lexicon
        run: npm run --prefix lexicons/temporal prepack

      - name: Generate and validate Fly lexicon
        run: npm run --prefix lexicons/fly prepack

      - name: Generate and validate Fountain lexicon
        run: npm run --prefix lexicons/fountain prepack

      - name: Generate and validate K3d lexicon
        run: npm run --prefix lexicons/k3d prepack

      - name: Generate and validate K3s lexicon
        run: npm run --prefix lexicons/k3s prepack

      # cedar joins this job now that it has a real generate and a real
      # validate (#1650) — 33 required names over the bundled default schema.
      # Before that its prepack was bundle + build and had nothing to assert.
      - name: Generate and validate Cedar lexicon
        run: npm run --prefix lexicons/cedar prepack

  smoke-npm:
    if: false  # disabled — Docker smoke tests are for local/release validation, not every push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: npm smoke tests (docker build)
        run: docker build -f test/Dockerfile.smoke-npm -t chant-smoke-npm .
