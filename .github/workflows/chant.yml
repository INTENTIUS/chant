name: chant

# Distinct title so it isn't confused with other workflows on the same commit.
run-name: chant — ${{ github.head_ref || github.ref_name }}

# Run once per commit: on PRs (pull_request) and on pushes to main
# (post-merge validation). Without scoping `push` to main, a commit on a
# branch that has an open PR triggers two identical runs.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels that PR's superseded run. main's runs are never
# cancelled (#2816): every main commit gets a verdict, so `just release` always
# has a recent green commit to tag. On main the group is the commit itself, so
# a later push neither cancels a run in progress nor replaces a queued one.
concurrency:
  group: chant-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  security-events: write

jobs:
  check:
    runs-on: ubuntu-latest
    # 10 was the historical value and this job had crept to ~9m30s against it,
    # so any upstream slowness cancelled the build rather than failing it —
    # which reads as "your change broke CI" when it did not. Attempts are now
    # individually bounded (packages/core/src/codegen/fetch.ts), so this is
    # headroom rather than a licence to grow.
    timeout-minutes: 20
    steps:
      # Recorded first so the timeout-report step below (#2076) can compute
      # how long the job actually ran before a job-level timeout cancelled it.
      - name: Record job start time
        id: start-time
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Cache lexicon schemas
        uses: actions/cache@v5
        with:
          path: ~/.chant
          key: lexicon-schemas-${{ hashFiles('lexicons/*/src/**/fetch.ts', 'lexicons/*/src/**/versions.ts') }}
          restore-keys: |
            lexicon-schemas-

      - name: Generate lexicon artifacts
        run: |
          npm run --prefix lexicons/aws prepack
          npm run --prefix lexicons/azure prepack
          npm run --prefix lexicons/gitlab prepack
          npm run --prefix lexicons/github prepack
          npm run --prefix lexicons/forgejo prepack
          npm run --prefix lexicons/otel prepack
          npm run --prefix lexicons/k8s prepack
          npm run --prefix lexicons/gcp prepack
          npm run --prefix lexicons/helm prepack
          npm run --prefix lexicons/docker prepack
          npm run --prefix lexicons/fly prepack
          npm run --prefix lexicons/fountain prepack
          npm run --prefix lexicons/k3d prepack
          npm run --prefix lexicons/k3s prepack
          npm run --prefix lexicons/render prepack
          npm run --prefix lexicons/systemone prepack
          npm run --prefix lexicons/terraform prepack
          # cedar generates from the project's own .cedarschema, falling
          # back to the schema bundled at src/spec/default-schema.cedarschema
          # so a clean checkout still produces a surface to gate (#1650).
          npm run --prefix lexicons/cedar prepack
          npm run --prefix lexicons/cpln prepack

      - name: Typecheck
        run: npx tsc --noEmit -p packages/core/tsconfig.json

      # The whole repo, not just core (#1366). The root tsconfig includes
      # `lexicons/**/*` — every lexicon, example and helper script — so all of
      # it was inside the project TypeScript was configured for and outside the
      # one CI checked. It had accumulated 91 errors unnoticed, including
      # composites that erased their own result type and wiring props that
      # rejected the intrinsics the docs tell you to pass. Enforced here so the
      # number cannot grow back.
      - name: Typecheck the whole repo (#1366)
        run: npx tsc --noEmit

      # The k8s API client (#1074) is its own package, so `just build`'s
      # core-only typecheck does not cover it. It is not a lexicon either, so
      # check-lexicons below does not reach it.
      - name: Typecheck the Kubernetes API client (#1074)
        run: npx tsc --noEmit -p packages/k8s-client/tsconfig.build.json

      - name: Lexicon completeness contract (#1067)
        run: npx tsx scripts/check-lexicons.ts

      # #1388 — the two typechecks above cover packages/core and k8s-client, and
      # check-lexicons builds each lexicon's tsconfig.build.json, which excludes
      # tests. Nothing typechecked a lexicon test, script or example. This does,
      # against a baseline that can only shrink.
      - name: Repo-wide typecheck (tests, scripts, examples)
        run: npx tsx scripts/typecheck.ts

      # #2657 (ws-052) — the chant and hud boundary. packages/core opens no
      # listener and imports no UI or agent-runtime package, and the owner
      # roster in docs/data/boundary.yaml matches the code's closed lists.
      # Both read source only, so they run here as a named step and also in
      # the test shards through vitest's include list, as no-egress does.
      - name: Boundary guards (no listener, owner roster)
        run: npx vitest run test/no-listener.test.ts test/boundary-roster.test.ts

      - name: Lint aws reference composites (EVL regression guard, #916/#952)
        # The lexicon's own composites must obey the evaluability rules they teach.
        run: npx tsx packages/core/src/cli/main.ts lint lexicons/aws/src/composites

      - name: Audit runtime dependencies
        run: node scripts/depcheck.mjs

      - name: Lint example project
        run: npx tsx packages/core/src/cli/main.ts lint lexicons/aws/examples/lambda-function/src --format sarif > results.sarif

      - name: Build example project
        run: npx tsx packages/core/src/cli/main.ts build lexicons/aws/examples/lambda-function/src --output template.json

      - name: Run Op in local mode (regression guard)
        working-directory: examples/local-op-quickstart
        # The lint runs first: this step executed the example without anything
        # checking its Op source against the evaluability rules, which is how
        # an EVL003 in `hello.op.ts` went unnoticed (#2251).
        run: |
          npx tsx ../../packages/core/src/cli/main.ts lint
          npx tsx ../../packages/core/src/cli/main.ts run hello --local --json > result.json
          node -e "process.exit(JSON.parse(require('fs').readFileSync('result.json','utf8')).status === 'ok' ? 0 : 1)"

      - name: Run supply-chain example component (regression guard, #630)
        working-directory: examples/supply-chain
        run: |
          npx tsx ../../packages/core/src/cli/main.ts run --components supply-chain-demo --env local --json > result.json
          node -e "process.exit(JSON.parse(require('fs').readFileSync('result.json','utf8')).results[0].ok ? 0 : 1)"
          test -s sbom.spdx.json
          test -s config-bom.spdx.json
          rm -f result.json sbom.spdx.json config-bom.spdx.json

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

      # #2076, a job-level timeout-minutes cancels the job rather than
      # failing it (GitHub Actions docs, "expressions": cancelled() is true
      # once the job is cancelled, and a step guarded by cancelled() still
      # runs even though the rest of the job was skipped). Without this the
      # job still ends red, and a reviewer cannot tell a timeout from a real
      # failure without opening the run.
      - name: Report a timeout, distinct from a failure
        if: cancelled()
        run: |
          elapsed=$(( ($(date +%s) - ${{ steps.start-time.outputs.epoch }}) / 60 ))
          message="check job timed out after ~${elapsed}m against its 20 minute ceiling. This is a CI timeout, not a check failure."
          echo "::error::${message}"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "${message}" >> "$GITHUB_STEP_SUMMARY"
          fi

  # The suite runs as four vitest shards in parallel. vitest assigns each test
  # file to exactly one shard (sorted by a hash of its path), so the four
  # together run the same files a single `npx vitest run` does. The required
  # `test` check is the aggregate job below, not these.
  test-shard:
    name: test-shard (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # The unsharded suite needed a 20 minute ceiling (#1993). A shard runs a
    # quarter of the files after the same setup, so 15 leaves room for the
    # setup plus runner variance.
    timeout-minutes: 15
    strategy:
      # Let every shard finish so one failing shard does not hide another's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # Recorded first so the timeout-report step below (#2076) can compute
      # how long the job actually ran before a job-level timeout cancelled it.
      - name: Record job start time
        id: start-time
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Cache lexicon schemas
        uses: actions/cache@v5
        with:
          path: ~/.chant
          key: lexicon-schemas-${{ hashFiles('lexicons/*/src/**/fetch.ts', 'lexicons/*/src/**/versions.ts') }}
          restore-keys: |
            lexicon-schemas-

      - name: Generate lexicon artifacts
        run: |
          npm run --prefix lexicons/aws prepack
          npm run --prefix lexicons/azure prepack
          npm run --prefix lexicons/gitlab prepack
          npm run --prefix lexicons/github prepack
          npm run --prefix lexicons/forgejo prepack
          npm run --prefix lexicons/otel prepack
          npm run --prefix lexicons/k8s prepack
          npm run --prefix lexicons/gcp prepack
          npm run --prefix lexicons/helm prepack
          npm run --prefix lexicons/docker prepack
          npm run --prefix lexicons/fly prepack
          npm run --prefix lexicons/fountain prepack
          npm run --prefix lexicons/k3d prepack
          npm run --prefix lexicons/k3s prepack
          npm run --prefix lexicons/render prepack
          npm run --prefix lexicons/systemone prepack
          npm run --prefix lexicons/terraform prepack
          # cedar generates from the project's own .cedarschema, falling
          # back to the schema bundled at src/spec/default-schema.cedarschema
          # so a clean checkout still produces a surface to gate (#1650).
          npm run --prefix lexicons/cedar prepack
          npm run --prefix lexicons/cpln prepack

      # The helm lexicon targets Helm 4 (epic #1228); the runner image ships
      # Helm 3. Pin the version the render tests run against.
      - name: Install Helm 4 (pinned)
        run: |
          curl -fsSL -o /tmp/helm.tgz https://get.helm.sh/helm-v4.1.1-linux-amd64.tar.gz
          echo "5d4c7623283e6dfb1971957f4b755468ab64917066a8567dd50464af298f4031  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short

      # Includes examples/fold-differential.test.ts (#1025, epic #1019) — the
      # fold-vs-run zero-drift gate over examples/* + every lexicon's own
      # examples/* fixtures. It's a normal vitest file (see
      # vitest.config.ts's `include`), gated here like everything else in
      # this step; `just fold-differential` runs it alone with its
      # per-source report.
      - name: Run tests (shard ${{ matrix.shard }}/4)
        run: npx vitest run --shard=${{ matrix.shard }}/4

      # #2076, a job-level timeout-minutes cancels the job rather than
      # failing it (GitHub Actions docs, "expressions": cancelled() is true
      # once the job is cancelled, and a step guarded by cancelled() still
      # runs even though the rest of the job was skipped). Without this the
      # job still ends red, and a reviewer cannot tell a timeout from a real
      # test failure without opening the run (#1993's second acceptance item).
      - name: Report a timeout, distinct from a test failure
        if: cancelled()
        run: |
          elapsed=$(( ($(date +%s) - ${{ steps.start-time.outputs.epoch }}) / 60 ))
          message="test shard ${{ matrix.shard }}/4 timed out after ~${elapsed}m against its 15 minute ceiling. This is a CI timeout, not a test failure."
          echo "::error::${message}"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "${message}" >> "$GITHUB_STEP_SUMMARY"
          fi

  # The required status check. Branch protection requires a check named
  # `test`; this job reports it and passes only when every shard passed. It
  # runs with always() so a failed or cancelled shard still produces a red
  # `test` rather than a skipped one.
  test:
    needs: test-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test shard to pass
        env:
          SHARDS: ${{ needs.test-shard.result }}
        run: |
          echo "test-shard result: ${SHARDS}"
          if [ "${SHARDS}" != "success" ]; then
            echo "::error::One or more test shards did not succeed (result: ${SHARDS})."
            exit 1
          fi

  validate:
    runs-on: ubuntu-latest
    # Same failure as the test job in #1993: runs land at 4m20s-4m49s against
    # a 5 minute ceiling, so cancellation tracked runner variance rather than
    # the change. Matches the other jobs in this workflow.
    timeout-minutes: 20
    # #1481 — arm the release gate here, so this job runs the prepack the
    # publish workflow runs. `npm publish` re-runs each lexicon's prepack
    # under CHANT_RELEASE_GATE=1, which adds the surface-snapshot check and
    # (for aws) refuses a build that could not load the pinned spec. Before
    # this, that gate ran only inside `npm publish`: release-preflight.sh
    # trusted a green `chant` run that had never executed it, and two
    # releases in a row died on a check CI was structurally unable to see.
    # Every input the gate depends on is pinned (the aws spec by content,
    # #1511; k8s by version tag), so arming it on PRs is deterministic —
    # it moves only when a commit moves it.
    env:
      CHANT_RELEASE_GATE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Cache lexicon schemas
        uses: actions/cache@v5
        with:
          path: ~/.chant
          key: lexicon-schemas-${{ hashFiles('lexicons/*/src/**/fetch.ts', 'lexicons/*/src/**/versions.ts') }}
          restore-keys: |
            lexicon-schemas-


      - name: Generate and validate AWS lexicon
        run: npm run --prefix lexicons/aws prepack

      - name: Generate and validate GitLab lexicon
        run: npm run --prefix lexicons/gitlab prepack

      - name: Generate and validate GitHub lexicon
        run: npm run --prefix lexicons/github prepack

      - name: Generate and validate Forgejo lexicon
        run: npm run --prefix lexicons/forgejo prepack

      - name: Generate and validate OTel lexicon
        run: npm run --prefix lexicons/otel prepack

      - name: Generate and validate K8s lexicon
        run: npm run --prefix lexicons/k8s prepack

      - name: Generate and validate GCP lexicon
        run: npm run --prefix lexicons/gcp prepack

      - name: Generate and validate Azure lexicon
        run: npm run --prefix lexicons/azure prepack

      - name: Generate and validate Helm lexicon
        run: npm run --prefix lexicons/helm prepack

      - name: Generate and validate Docker lexicon
        run: npm run --prefix lexicons/docker prepack

      - name: Generate and validate Fly lexicon
        run: npm run --prefix lexicons/fly prepack

      - name: Generate and validate Fountain lexicon
        run: npm run --prefix lexicons/fountain prepack

      - name: Generate and validate K3d lexicon
        run: npm run --prefix lexicons/k3d prepack

      - name: Generate and validate K3s lexicon
        run: npm run --prefix lexicons/k3s prepack

      # cedar joins this job now that it has a real generate and a real
      # validate (#1650) — 33 required names over the bundled default schema.
      # Before that its prepack was bundle + build and had nothing to assert.
      - name: Generate and validate Cedar lexicon
        run: npm run --prefix lexicons/cedar prepack

      - name: Generate and validate Render lexicon
        run: npm run --prefix lexicons/render prepack

      - name: Generate and validate Cpln lexicon
        run: npm run --prefix lexicons/cpln prepack

      - name: Generate and validate Terraform lexicon
        run: npm run --prefix lexicons/terraform prepack

      - name: Generate and validate systemone lexicon
        run: npm run --prefix lexicons/systemone prepack

  smoke-npm:
    # Deliberately off (#1687). The Docker smoke surface — this image plus the
    # per-lexicon sections of test/integration.sh — is local-only: `just smoke`.
    # A Docker build per push costs more than it catches. Revisit when there is
    # a schedule or release-tag trigger worth paying for.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: npm smoke tests (docker build)
        run: docker build -f test/Dockerfile.smoke-npm -t chant-smoke-npm .
