name: sql-server-ddl

# Weekly advisory check (#3872): does the newest ClickHouse or Postgres
# release write DDL the sql lexicon's parser does not read? A clause the
# parser does not know builds with a warning, so this is how chant hears about
# one within a week of a release, before a user does. It reads each server's
# own tests at its newest release tag and compares what the parser leaves
# unread or refuses with a committed baseline
# (lexicons/sql/src/<dialect>/testdata/server-ddl-baseline.json). It never
# fails a build and stays off pull requests: it fetches both servers' tests.
run-name: sql-server-ddl — ${{ github.event_name }}

on:
  # Mondays at 07:30 UTC, after emulator-freshness, to spread the load.
  schedule:
    - cron: '30 7 * * 1'
  workflow_dispatch:

concurrency:
  group: sql-server-ddl
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: sql-server-ddl (${{ matrix.dialect }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dialect: [clickhouse, postgres]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm install

      - name: Read the newest release's DDL
        id: ddl
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx tsx scripts/check-sql-server-ddl.ts ${{ matrix.dialect }}

      # One issue per dialect and release, refreshed when the same release is
      # checked again. Advisory: a human teaches the parser or updates the baseline.
      - name: Surface an issue for what is new
        if: ${{ steps.ddl.outputs.found == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.ddl.outputs.title }}
          BODY: ${{ steps.ddl.outputs.body }}
        run: |
          # `gh issue create --label` fails without opening the issue when the label is missing.
          gh label create sql --description "The sql lexicon" --color 1d76db --force
          existing=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$BODY"
            echo "Refreshed issue #$existing"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label sql
            echo "Opened a new issue"
          fi
