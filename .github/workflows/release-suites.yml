name: release-suites

# The long suites a release gates on (#3793). Pull request CI (chant.yml) runs
# only fast checks; everything that spawns the CLI, runs tsc over fixtures,
# builds the example corpus or boots a container is the vitest e2e project
# (*.e2e.test.ts), and it runs here, on main, never on a pull request.
#
# The aggregate job is named `suites`, and chant.workspace.json's ci.green
# requires a `suites` phase beside check, test and validate. `chant ci tick`
# (chant-ci-green.yml) tags a main commit ci/green/<sha> only when all four
# passed on it, and `just release` (scripts/release-preflight.sh) tags the
# newest commit with a ci/green tag. So a release only ships a commit these
# suites passed.
#
# ci.green declares suites `build: "newest"` (#4169), and `chant ci workflow`
# writes the triggers and concurrency below from it. Each push to main queues
# a run; one runs at a time, and GitHub keeps only the newest waiting, so the
# commits between are never built. The tick records those as unbuilt, covered
# by the newer commit. When a run goes red the tick bisects: it pushes a
# ci/build/<sha> tag on an unbuilt commit and starts this workflow there by
# hand (workflow_dispatch), each tag in a concurrency group of its own. `chant
# ci run --at <sha>` asks for the same to make a chosen commit releasable.
# Locally the same suite is `just test-e2e`.
run-name: release-suites — ${{ github.ref_name }}

# Written by chant ci workflow from ci.green's build (#4169); edit ci.green and run it again.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

# Written by chant ci workflow from ci.green's build (#4169); edit ci.green and run it again.
concurrency:
  group: chant-build-suites-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The e2e project in three shards. #2812's migrated release test allows
  # itself 20 minutes, and the setup before it is about 3.
  e2e:
    name: e2e (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Record job start time
        id: start-time
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Cache lexicon schemas
        uses: actions/cache/restore@v5
        with:
          path: ~/.chant
          key: lexicon-schemas-${{ hashFiles('lexicons/*/src/**/fetch.ts', 'lexicons/*/src/**/versions.ts') }}
          restore-keys: |
            lexicon-schemas-

      # Every step of every lexicon's prepack, as `npm publish` runs it, so
      # the e2e tests that compile against a lexicon's dist see a full build.
      - name: Generate lexicon artifacts
        run: scripts/ci-lexicon-artifacts.sh

      # The same pinned Helm 4 the unit shards install (epic #1228).
      - name: Install Helm 4 (pinned)
        run: |
          curl -fsSL -o /tmp/helm.tgz https://get.helm.sh/helm-v4.1.1-linux-amd64.tar.gz
          echo "5d4c7623283e6dfb1971957f4b755468ab64917066a8567dd50464af298f4031  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short

      # Longest file first, as in the unit shards.
      - name: Restore vitest's recorded durations
        uses: actions/cache@v5
        with:
          path: node_modules/.vite/vitest
          key: vitest-results-e2e-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vitest-results-e2e-${{ matrix.shard }}-

      - name: Run end-to-end tests (shard ${{ matrix.shard }}/3)
        run: npx vitest run --project e2e --shard=${{ matrix.shard }}/3

      - name: Record the job's duration
        if: always()
        run: |
          elapsed=$(( $(date +%s) - ${{ steps.start-time.outputs.epoch }} ))
          echo "e2e shard ${{ matrix.shard }}/3 ran $((elapsed / 60))m$((elapsed % 60))s" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report a timeout, distinct from a test failure
        if: cancelled()
        run: |
          elapsed=$(( ($(date +%s) - ${{ steps.start-time.outputs.epoch }}) / 60 ))
          message="e2e shard ${{ matrix.shard }}/3 timed out after ~${elapsed}m against its 30 minute ceiling. This is a CI timeout, not a test failure."
          echo "::error::${message}"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "${message}" >> "$GITHUB_STEP_SUMMARY"
          fi

  # The check ci.green's `suites` phase reads. It passes only when every
  # shard passed, and runs with always() so a failed or cancelled shard gives
  # a red `suites` rather than a skipped one.
  suites:
    needs: [e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every e2e shard to pass
        env:
          SHARDS: ${{ needs.e2e.result }}
        run: |
          echo "e2e result: ${SHARDS}"
          if [ "${SHARDS}" != "success" ]; then
            echo "::error::One or more e2e shards did not succeed (result: ${SHARDS})."
          fi
          [ "${SHARDS}" = "success" ]
