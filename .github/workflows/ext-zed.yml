name: Zed Extension

on:
  push:
    paths:
      - "editors/zed/**"
    tags:
      - "ext-zed-v*"
  pull_request:
    paths:
      - "editors/zed/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-wasip1
      - run: cargo build --release --target wasm32-wasip1
        working-directory: editors/zed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chant-zed-${{ github.sha }}
          path: editors/zed/target/wasm32-wasip1/release/*.wasm

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/ext-zed-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chant-zed-${{ github.sha }}
          path: wasm

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: wasm/*.wasm
