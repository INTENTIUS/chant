name: emulator-freshness

# Weekly advisory check: is any lexicon's pinned emulator image behind its
# latest upstream release? scripts/check-emulator-freshness.ts enumerates every
# lexicon's EmulatorSpec that declares an `upstream` (#1345): fly's mudflaps and
# spritzer, Floci for aws, floci-az, floci-gcp and the sql pins.
# Surfaces a single tracking issue when a pin is behind, never an auto-bump. Each
# tag lives on its lexicon's EmulatorSpec and moves only when a consuming test
# needs the newer emulator (#808 T2 policy).
run-name: emulator-freshness — ${{ github.event_name }}

on:
  # Mondays at 07:00 UTC — an hour after lexicon-upgrade, to spread the load.
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: emulator-freshness
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  # #3573: named for the workflow. It runs on main's tip, where chant.yml's
  # required `check` also runs, and ci.green judges a phase by check-run name.
  check:
    name: emulator-freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm install

      - name: Check emulator pin freshness
        id: freshness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx tsx scripts/check-emulator-freshness.ts

      # Open or refresh a single tracking issue when a pin is behind. Advisory —
      # a human reviews and bumps the pin per the #808 policy.
      - name: Surface a tracking issue when behind
        if: ${{ steps.freshness.outputs.behind == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          # Every word here is in the earlier Fly-only title, so the
          # `in:title` search below still finds an issue opened under it.
          TITLE: 'chore: emulator image pin(s) behind latest release'
          BODY: ${{ steps.freshness.outputs.body }}
        run: |
          # The repo has no `chore` label by default, and `gh issue create
          # --label chore` hard-fails ("could not add label: 'chore' not
          # found") WITHOUT opening the issue — so every run since the pins
          # went stale died here and the advisory issue was never filed.
          # Create it up front; --force makes this idempotent.
          gh label create chore \
            --description "Routine maintenance — pin bumps, chores" \
            --color ededed --force

          existing=$(gh issue list --state open --search "in:title $TITLE" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$BODY"
            echo "Refreshed issue #$existing"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label chore
            echo "Opened a new tracking issue"
          fi
