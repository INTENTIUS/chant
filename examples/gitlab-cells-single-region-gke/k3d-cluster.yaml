apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: gitlab-cells-smoke
servers: 1
agents: 0
ports:
  - port: '8080:30080'
    nodeFilters:
      - server:0
  - port: '8081:30081'
    nodeFilters:
      - server:0
options:
  k3d:
    wait: true
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
      - arg: --disable=servicelb
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
