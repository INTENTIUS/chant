name: chant-pr-demo

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - ci/green/**

env:
  CHANT_ENV: demo

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: docker
    container: chant-fan-out-demo-job:local
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build the templates
        run: npm run build
      - name: Lint the project
        run: chant lint
      - name: Plan the members this pull request reaches
        env:
          BASE_SHA: '${{ github.event.pull_request.base.sha }}'
          PR_NUMBER: '${{ github.event.pull_request.number }}'
          GITHUB_TOKEN: '${{ github.token }}'
          CHANT_RUN_EVENTS_DIR: .chant/pr/run-events
          CHANT_RUNNER_KEY: '${{ secrets.CHANT_RUNNER_KEY }}'
        run: chant ci run plan --in-place --no-push --base "$BASE_SHA" --pr "$PR_NUMBER" --env demo --gate pr-apply --forge forgejo --events-json --report-url "s3://chant-demo/fan-out-estate/reports"
      - name: Keep the plan report
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: chant-pr-plan
          path: .chant/pr
          if-no-files-found: ignore
  record:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: docker
    container: chant-fan-out-demo-job:local
    concurrency:
      group: chant-record-demo
      cancel-in-progress: false
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build the templates
        run: npm run build
      - name: Lint the project
        run: chant lint
      - name: Record the plan on the merged commit; nothing applies
        env:
          BASE_SHA: '${{ github.event.before }}'
          GITHUB_TOKEN: '${{ github.token }}'
          CHANT_RUN_EVENTS_DIR: .chant/pr/run-events
          CHANT_RUNNER_KEY: '${{ secrets.CHANT_RUNNER_KEY }}'
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then git fetch origin "main" && BASE_SHA="$(git merge-base FETCH_HEAD "$GITHUB_SHA")"; if [ "$BASE_SHA" = "$GITHUB_SHA" ]; then BASE_SHA="$(git rev-parse --verify --quiet "$GITHUB_SHA^" || echo 4b825dc642cb6eb9a060e54bf8d69288fbee4904)"; fi; fi; export BASE_SHA
          chant ci run record --in-place --base "$BASE_SHA" --env demo --gate pr-apply --forge forgejo --events-json --report-url "s3://chant-demo/fan-out-estate/reports"
      - name: Keep the record report
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: chant-pr-record
          path: .chant/pr
          if-no-files-found: ignore
  apply:
    if: startsWith(github.ref, 'refs/tags/ci/green/')
    runs-on: docker
    container: chant-fan-out-demo-job:local
    concurrency:
      group: chant-apply-demo
      cancel-in-progress: false
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build the templates
        run: npm run build
      - name: Lint the project
        run: chant lint
      - name: Restore the record of an earlier attempt at this commit
        uses: https://code.forgejo.org/actions/cache/restore@v4
        with:
          path: .chant/pr-resume/pr-apply.json
          key: chant-apply-demo-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: chant-apply-demo-${{ github.sha }}-
      - name: Apply the newest green commit under the merged changes' approvals
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          CHANT_RUN_EVENTS_DIR: .chant/pr/run-events
          CHANT_RUNNER_KEY: '${{ secrets.CHANT_RUNNER_KEY }}'
        run: |
          git fetch --quiet --tags origin "+refs/heads/main:refs/remotes/origin/main" && GREEN_SHA="$(chant ci last-green)" && git checkout --quiet --detach "$GREEN_SHA"
          chant ci run apply --in-place --env demo --gate pr-apply --forge forgejo --events-json --report-url "s3://chant-demo/fan-out-estate/reports"
      - name: Keep the record for a re-run
        if: always()
        uses: https://code.forgejo.org/actions/cache/save@v4
        with:
          path: .chant/pr-resume/pr-apply.json
          key: chant-apply-demo-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep the apply report
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: chant-pr-apply
          path: .chant/pr
          if-no-files-found: ignore
