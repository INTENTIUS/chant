# THE "BEFORE" — the bespoke pipeline this example replaces.
#
# Two services (api, ui) behind one shared ALB. Notice what happens as the
# service count grows: every service copies the SAME two jobs — a hand-rolled
# docker build/push, then a deploy job that shells `describe-stacks | jq` to
# find the shared stack's outputs and its own image repo before it can deploy.
#
# The build+deploy pair for `ui` below is a near-verbatim copy of `api`'s. That
# duplication is the sprawl: N services -> N copies of this glue, each drifting
# on its own. A cross-cutting change (add a wait-for-healthy, change the deploy
# flags) means editing every copy by hand.
#
# `../` holds the "after": three build.json components run by one generic driver.

stages:
  - build
  - deploy

# ─────────────────────────── api ───────────────────────────
build-api:
  stage: build
  image: { name: docker:27-cli }
  services:
    - { name: docker:27-dind, alias: docker }
  variables: { DOCKER_TLS_CERTDIR: /certs }
  before_script:
    - apk add --no-cache aws-cli
    - aws ecr get-login-password | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
  script:
    - docker build -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/alb-api:$CI_COMMIT_REF_SLUG ./api
    - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/alb-api:$CI_COMMIT_REF_SLUG
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy-api:
  stage: deploy
  image: { name: amazon/aws-cli:latest, entrypoint: [''] }
  needs: [{ job: build-api }]
  script:
    # find the shared stack's outputs by hand, then grep out the ones we need
    - OUTPUTS=$(aws cloudformation describe-stacks --stack-name shared-alb --query 'Stacks[0].Outputs' --output json)
    - PARAMS=$(echo "$OUTPUTS" | jq -r '[(.[] | select(.OutputKey == "ClusterArn") | "clusterArn=" + .OutputValue), (.[] | select(.OutputKey == "ListenerArn") | "listenerArn=" + .OutputValue), (.[] | select(.OutputKey == "AlbSgId") | "albSgId=" + .OutputValue), (.[] | select(.OutputKey == "ExecutionRoleArn") | "executionRoleArn=" + .OutputValue), (.[] | select(.OutputKey == "VpcId") | "vpcId=" + .OutputValue), (.[] | select(.OutputKey == "PrivateSubnet1") | "privateSubnet1=" + .OutputValue), (.[] | select(.OutputKey == "PrivateSubnet2") | "privateSubnet2=" + .OutputValue)] | join(" ")')
    - IMAGE_URI=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey == "ApiRepoUri") | .OutputValue'):${CI_COMMIT_REF_SLUG}
    - aws cloudformation deploy --template-file templates/api.json --stack-name api --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset --parameter-overrides $PARAMS image=$IMAGE_URI
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ─────────────────────────── ui (a verbatim copy — this is the sprawl) ───────────────────────────
build-ui:
  stage: build
  image: { name: docker:27-cli }
  services:
    - { name: docker:27-dind, alias: docker }
  variables: { DOCKER_TLS_CERTDIR: /certs }
  before_script:
    - apk add --no-cache aws-cli
    - aws ecr get-login-password | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
  script:
    - docker build -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/alb-ui:$CI_COMMIT_REF_SLUG ./ui
    - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/alb-ui:$CI_COMMIT_REF_SLUG
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy-ui:
  stage: deploy
  image: { name: amazon/aws-cli:latest, entrypoint: [''] }
  needs: [{ job: build-ui }]
  script:
    - OUTPUTS=$(aws cloudformation describe-stacks --stack-name shared-alb --query 'Stacks[0].Outputs' --output json)
    - PARAMS=$(echo "$OUTPUTS" | jq -r '[(.[] | select(.OutputKey == "ClusterArn") | "clusterArn=" + .OutputValue), (.[] | select(.OutputKey == "ListenerArn") | "listenerArn=" + .OutputValue), (.[] | select(.OutputKey == "AlbSgId") | "albSgId=" + .OutputValue), (.[] | select(.OutputKey == "ExecutionRoleArn") | "executionRoleArn=" + .OutputValue), (.[] | select(.OutputKey == "VpcId") | "vpcId=" + .OutputValue), (.[] | select(.OutputKey == "PrivateSubnet1") | "privateSubnet1=" + .OutputValue), (.[] | select(.OutputKey == "PrivateSubnet2") | "privateSubnet2=" + .OutputValue)] | join(" ")')
    - IMAGE_URI=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey == "UiRepoUri") | .OutputValue'):${CI_COMMIT_REF_SLUG}
    - aws cloudformation deploy --template-file templates/ui.json --stack-name ui --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset --parameter-overrides $PARAMS image=$IMAGE_URI
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
